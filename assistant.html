<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>JASONBOOK ✨ - JASON Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0A0A0F;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--ligne:#26262F}
.top{flex-shrink:0;background:#0A0A0F;padding:10px 12px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.top .back{font-size:22px;cursor:pointer;flex-shrink:0}
.top .avatar{width:44px;height:44px;min-width:44px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#FFC107);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;flex-shrink:0}
.top .avatar .dot-online{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#22C55E;border:2px solid #0A0A0F;border-radius:50%}
.top .info{flex:1;min-width:0}
.top b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;color:#22C55E;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{width:38px;height:38px;min-width:38px;border-radius:50%;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
.suggestions{flex-shrink:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid var(--ligne)}
.suggestions::-webkit-scrollbar{display:none}
.suggestions button{flex-shrink:0;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:11px 13px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#1F1F2E;border:1px solid var(--ligne);align-self:flex-start;border-bottom-left-radius:4px}
.msg.mine{background:linear-gradient(135deg,var(--violet),var(--violet2));align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:4px;text-align:right}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.typing{display:none;gap:4px;align-items:center;background:#1F1F2E;padding:12px 14px;border-radius:18px;align-self:flex-start}
.typing.show{display:flex}
.typing i{width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.quick{flex-shrink:0;padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap;background:#12121A;border-top:1px solid var(--ligne)}
.quick button{background:#2A2A35;border:1px solid var(--ligne);color:#fff;padding:7px 12px;border-radius:999px;font-size:11px;cursor:pointer}
.preview-img{flex-shrink:0;display:none;gap:8px;align-items:center;background:#12121A;padding:8px 12px;border-top:1px solid var(--ligne)}
.preview-img.show{display:flex}
.preview-img img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.preview-img span{flex:1;font-size:12px;color:#A1A1AA}
.preview-img button{background:#E0245E;border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}
.input-wrap{flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#12121A;border-top:1px solid var(--ligne);display:flex;gap:8px;align-items:center}
.input-wrap input{flex:1;min-width:0;padding:12px 14px;background:#2A2A35;border:none;border-radius:999px;outline:none;color:#fff;font-size:14px}
.input-wrap input::placeholder{color:#888}
.input-wrap button{width:44px;height:44px;min-width:44px;border:none;border-radius:50%;background:#2A2A35;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.input-wrap button.send{background:linear-gradient(135deg,var(--violet),var(--or));color:#fff}
.input-wrap button:disabled{opacity:.5}
/* ✅ BLOC CODE COMME META AI */
.code-block{background:#0A0A0F;border:1px solid #2A2A35;border-radius:14px;overflow:hidden;margin:8px 0}
.code-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:#1F1F2E}
.code-head .code-icon{width:32px;height:32px;min-width:32px;background:#2A2A35;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.code-head b{font-size:13px;color:#fff;flex:1;text-align:left}
.code-head .voir-code{font-size:12px;color:#A1A1AA;white-space:nowrap}
.code-head .fleche{font-size:11px;color:#888;transition:transform .2s}
.code-block.open .fleche{transform:rotate(180deg)}
.code-body{display:none;background:#0A0A0F}
.code-block.open .code-body{display:block}
.code-body pre{white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:12.5px;line-height:1.6;color:#E5E7EB;margin:0;padding:12px;max-height:380px;overflow:auto}
.code-actions{display:flex;gap:8px;padding:10px;border-top:1px solid #2A2A35}
.code-actions button{flex:1;border:0;padding:10px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer}
.btn-copier-code{background:#FFC107;color:#000}
</style>
</head>
<body>

<div class="top">
<span class="back" onclick="history.back()">←</span>
<div class="avatar">🤖<span class="dot-online"></span></div>
<div class="info"><b>JASON Assistant ✨</b><small>En ligne • Pose-moi toutes tes questions</small></div>
<button onclick="effacerChat()">🗑️</button>
</div>

<div class="suggestions">

<button onclick="poser('Pourquoi le ciel est bleu ?')">🌌 Pourquoi ciel bleu ?</button>

<div class="input-wrap">
<button onclick="document.getElementById('fileImgAssistant').click()">📷</button>

<input id="msgInput" placeholder="Pose-moi n'importe quelle question..." onkeydown="if(event.key==='Enter') envoyer()">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid');
if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"Ami";
const body = document.getElementById('chatBody');
const input = document.getElementById('msgInput');
const btnSend = document.getElementById('btnSend');

let history = [];
let imageTemp = "";

const API_BASE = "https://davbot.pages.dev";
function getApiUrl(){
  if(location.origin.includes("davbot.pages.dev")) return location.origin + "/api/intelligence-artificielle/ask";
  return API_BASE + "/api/intelligence-artificielle/ask";
}

const KNOWLEDGE = `Tu es JASON Assistant, l'assistant officiel de JASONBOOK.
Tu as été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK, Made in Kinshasa, République Démocratique du Congo.
JASONBOOK est un réseau social congolais : posts, stories 24h, messages, vocaux, photos, booster, live, boutique.
L'utilisateur actuel s'appelle ${monNom}.
Tu réponds à TOUTES les questions : JASONBOOK, maths, cours, sciences, histoire, sport, amour, business, code, traduction, santé, motivation, culture, Congo.`;

const RULES = `Règles strictes :
1. Tu t'appelles JASON Assistant, jamais DAVBOT, jamais un autre nom.
2. Si on te demande qui t'a créé, qui est ton créateur, qui t'a fait : tu réponds TOUJOURS : J'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK.
3. Ne mentionne JAMAIS DAVBOT, ni l'API, ni un autre créateur.
4. Réponds clairement, en français simple, comme un ami congolais, gentil, drôle, avec des emojis.
5. Réponds DIRECTEMENT à la question, ne demande jamais de préciser.
6. Si on envoie une image, analyse-la vraiment et décris ce que tu vois.
7. REGLE CODE OBLIGATOIRE : Quand tu donnes du code (html, css, js, python...), tu mets TOUJOURS le code dans un bloc comme ça :
\`\`\`html
ton code ici
\`\`\`
ou \`\`\`js, \`\`\`css, \`\`\`python. Tu peux mettre 1 petite phrase avant et après, mais JAMAIS du code sans bloc \`\`\`. C'est pour afficher un beau bloc Voir le code.`;

function heure(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

// ✅ TRANSFORME ```lang ... ``` EN BLOC COMME META AI
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formaterMessage(texte){
  let t = String(texte||"");
  // On protège d'abord le texte hors code
  const blocs = [];
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    const idx = blocs.length;
    blocs.push({lang: lang||'', code: code});
    return `__CODEBLOC_${idx}__`;
  });
  // Texte normal : **gras** + retours ligne
  t = escHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  // On remet les blocs code
  blocs.forEach((b, idx) => {
    const nom = b.lang ? 'Code ' + b.lang.toUpperCase() : 'Code';
    const id = 'code_' + Math.random().toString(36).slice(2,8);
    const codeSafe = escHtml(b.code.trim());
    const blocHtml = `<div class="code-block" id="${id}"><div class="code-head" onclick="document.getElementById('${id}').classList.toggle('open')"><span class="code-icon">&lt;&gt;</span><b>${nom}</b><span class="voir-code">Voir le code</span><span class="fleche">▼</span></div><div class="code-body"><pre>${codeSafe}</pre><div class="code-actions"><button class="btn-copier-code" onclick="copierBlocCode('${id}', this)">📋 Copier le code</button></div></div></div>`;
    t = t.replace(`__CODEBLOC_${idx}__`, blocHtml);
  });
  // Si l'IA a oublié les ``` mais a envoyé du HTML brut, on le met aussi en bloc
  if(blocs.length===0 && (t.includes('&lt;!DOCTYPE') || t.includes('&lt;html') || t.includes('&lt;style'))){
    const id = 'code_' + Math.random().toString(36).slice(2,8);
    const txtBrut = String(texte||"").replace(/```html|```/g,'');
    t = `<div class="code-block" id="${id}"><div class="code-head" onclick="document.getElementById('${id}').classList.toggle('open')"><span class="code-icon">&lt;&gt;</span><b>Code Html</b><span class="voir-code">Voir le code</span><span class="fleche">▼</span></div><div class="code-body"><pre>${escHtml(txtBrut.trim())}</pre><div class="code-actions"><button class="btn-copier-code" onclick="copierBlocCode('${id}', this)">📋 Copier le code</button></div></div></div>`;
  }
  return t;
}
window.copierBlocCode = async (id, btn) => {
  const code = document.querySelector('#'+id+' pre').innerText;
  try{ await navigator.clipboard.writeText(code); btn.innerText = '✅ Copié !'; }
  catch(e){ prompt('Copie le code :', code); }
  setTimeout(()=> btn.innerText = '📋 Copier le code', 2000);
};
window.toggleCode = (id) => { document.getElementById(id).classList.toggle('open'); };

function ajouterMsg(texte, qui, image=""){
  const div = document.createElement('div');
  div.className = 'msg ' + qui;
  let html = formaterMessage(texte);
  if(image) html += `<img src="${image}">`;
  div.innerHTML = html + `<small>${heure()}</small>`;
  body.appendChild(div); body.scrollTop = body.scrollHeight;
  return div;
}
function afficherTyping(){
  const t = document.createElement('div');
  t.className = 'typing show'; t.id='typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  body.appendChild(t); body.scrollTop = body.scrollHeight;
}
function cacherTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }
async function sauver(texte, qui){
  try{ const r = push(ref(db,'jasonbook/assistant/'+uid)); await set(r,{texte, qui, timestamp:Date.now(), date:new Date().toLocaleString()}); }catch(e){}
}
async function charger(){
  try{
    const snap = await get(ref(db,'jasonbook/assistant/'+uid));
    const d = snap.val();
    if(d){
      const arr = Object.values(d).sort((a,b)=>a.timestamp-b.timestamp).slice(-40);
      arr.forEach(m=>{
        ajouterMsg(m.texte, m.qui);
        if(m.qui==='mine') history.push({role:'user', content:m.texte});
        if(m.qui==='bot') history.push({role:'assistant', content:m.texte});
      });
      history = history.slice(-20);
    } else {
      const bienvenue = `Salut ${monNom} 👋\n\nMoi c'est JASON Assistant 🤖✨\n\nJ'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK 🇨🇩\n\nJe suis comme Meta AI sur Facebook, mais pour JASONBOOK !\nTu peux me poser TOUTES tes questions :\n\n📖 Cours / Maths / Sciences\n🌍 Traduction\n💻 Code\n⚽ Sport / Musique\n❤️ Amour / Conseil\n💰 Business\n📝 Légende pour ton post\n😂 Blague / Motivation\n🇨🇩 Congo / Kinshasa\n📷 Envoie-moi une image, je l'analyse\n\nVas-y, pose-moi n'importe quelle question !`;
      ajouterMsg(bienvenue, 'bot'); sauver(bienvenue,'bot');
    }
  }catch(e){ ajouterMsg(`Salut ${monNom} 👋 Je suis JASON Assistant, créé par Jason Aloma, développeur congolais. Pose-moi toutes tes questions !`, 'bot'); }
}
charger();
document.getElementById('fileImgAssistant').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{ imageTemp = ev.target.result; document.getElementById('previewImg').src = imageTemp; document.getElementById('previewImgBox').classList.add('show'); };
  r.readAsDataURL(f);
});
window.retirerImage = ()=>{ imageTemp = ""; document.getElementById('previewImgBox').classList.remove('show'); document.getElementById('fileImgAssistant').value = ""; };
window.poser = (txt)=>{ input.value = txt; envoyer(); };
window.effacerChat = async ()=>{
  if(!confirm("Effacer la conversation avec l'assistant ?")) return;
  body.innerHTML=""; history=[]; retirerImage();
  ajouterMsg(`Conversation effacée ✅\nRepose-moi une question ${monNom} 😊\nMoi c'est JASON Assistant, créé par Jason Aloma`, 'bot');
};
function corrigerReponse(txt){
  let t = String(txt||"");
  t = t.replace(/DAVBot/gi, "JASON Assistant").replace(/DAV BOT/gi, "JASON Assistant").replace(/Davbot/gi, "JASON Assistant").replace(/davbot/gi, "JASON Assistant");
  if(t.toLowerCase().includes("créé par") && !t.toLowerCase().includes("jason aloma")) t += "\n\n— Je précise : j'ai été créé par Jason Aloma, développeur congolais";
  return t;
}
function extraireReponse(data){
  if(!data) return "";
  if(typeof data === 'string') return data;
  const cles = ["reply","response","message","text","answer","result","output","content","reponse","ai_response","bot_response","completion","analysis","analyse"];
  for(const k of cles){
    if(typeof data[k] === 'string' && data[k].trim().length > 2) return data[k];
    if(data[k] && typeof data[k] === 'object'){ const sous = extraireReponse(data[k]); if(sous) return sous; }
  }
  if(Array.isArray(data.choices) && data.choices[0]){
    const c = data.choices[0];
    if(c.message && typeof c.message.content === 'string') return c.message.content;
    if(typeof c.text === 'string') return c.text;
  }
  if(data.data) { const sous = extraireReponse(data.data); if(sous) return sous; }
  let meilleur = "";
  function fouiller(obj){
    if(!obj || typeof obj !== 'object') return;
    for(const v of Object.values(obj)){
      if(typeof v === 'string' && v.length > meilleur.length && v.length > 10 && !v.includes("http") && !v.includes("{") && !v.includes("jasonbook_uid")) meilleur = v;
      else if(typeof v === 'object'){ fouiller(v); }
    }
  }
  fouiller(data);
  return meilleur;
}
function aleatoire(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function essayerMaths(texte){
  const t = texte.toLowerCase().replace(/combien font?|calcule|c'est combien|ça fait|egal|=|\?/g,"").trim();
  const nettoye = t.replace(/x|×/g,"*").replace(/:/g,"/").replace(/,/g,".").replace(/[^0-9+\-*/(). ]/g,"").trim();
  if(nettoye.length >= 3 && /[+\-*/]/.test(nettoye) && /^[0-9+\-*/(). ]+$/.test(nettoye)){
    try{ const res = Function("return ("+nettoye+")")(); if(typeof res === 'number' && isFinite(res)) return `🧮 ${texte} = ${res}`; }catch(e){}
  }
  return null;
}
function cerveauLocal(texte, aImage){
  const t = texte.toLowerCase();
  const maths = essayerMaths(texte);
  if(maths) return maths;
  if(aImage) return `Super image ${monNom} 📷✨\n\nJe vois ton image ! Elle est bien claire.\n\nSi c'est une photo de toi, un post, ou une story : tu peux la publier direct dans JASONBOOK !\n\n• Pour Story : Fil → Toi + → Choisir photo\n• Pour Post : Bouton + → Publier\n\nTu veux que je t'aide à écrire une légende ? Dis-moi : "Écris une légende" 😊\n\n— JASON Assistant, créé par Jason Aloma 🇨🇩`;
  if(t.includes("qui") && (t.includes("créé") || t.includes("createur") || t.includes("créateur") || t.includes("fondateur") || t.includes("fait"))) return `Moi c'est JASON Assistant 🤖✨\n\nJ'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK, Made in Kinshasa 🇨🇩`;
  if(t.includes("bouton") && t.includes("rouge")) return `Voilà ton bouton rouge 👇\n\n\`\`\`html\n<button style="background:red;color:white;padding:12px 20px;border:none;border-radius:999px;font-weight:800">Clique-moi</button>\n\`\`\`\n\nTu veux que je change la couleur ?`;
  if(t.includes("code")) return `Ok ${monNom}, voilà un exemple 👇\n\n\`\`\`html\n<button style="background:#7C3AED;color:white;padding:12px 20px;border:none;border-radius:999px">Mon bouton JASONBOOK ✨</button>\n\`\`\`\n\nDis-moi quel code tu veux exactement et je te le fais !`;
  if(t.includes("pourquoi") && t.includes("ciel") && t.includes("bleu")) return `🌌 Pourquoi le ciel est bleu ?\n\nParce que la lumière du soleil se disperse dans l'air, et c'est la couleur bleue qui se disperse le plus. C'est pour ça que nos yeux voient le ciel bleu !\nLe soir, on voit orange / rouge 🌇`;
  if(t.includes("pourquoi") && (t.includes("pleut") || t.includes("pluie"))) return `🌧️ Pourquoi il pleut ?\n\nLe soleil chauffe l'eau → vapeur monte → nuages → gouttes trop lourdes → pluie ! C'est le cycle de l'eau.`;
  if(t.includes("pourquoi") && (t.includes("dort") || t.includes("dormir"))) return `😴 Pourquoi on dort ?\n\nParce que ton corps et ton cerveau ont besoin de se reposer, de ranger ce que tu as appris et de récupérer de l'énergie. Il faut 7-8h par nuit !`;
  if(t.includes("pourquoi")) return `Bonne question ${monNom} 🤔\n\nTu m'as demandé : "${texte}"\n\nVoilà l'explication simple : tout dans la nature a une raison ! Si c'est sur le ciel, la pluie, le corps, la Terre, c'est souvent à cause de la science, du soleil, de l'eau ou de l'air.\n\nDis-moi : "Pourquoi le ciel est bleu ?" ou "Pourquoi il pleut ?" et je t'explique en détail ! 😊`;
  if(t.includes("bonjour") || t.includes("salut")) return `Salut ${monNom} 👋😊 Ça va ? Pose-moi toutes tes questions !`;
  if(t.includes("blague")) return aleatoire(["😂 Pourquoi les plongeurs plongent-ils toujours en arrière ? Parce que sinon, ils tombent dans le bateau ! 🤣","😂 Pourquoi JASONBOOK est le meilleur ? Parce que c'est Made in Kinshasa 🇨🇩✨ !","😂 Que dit un bit à l'autre ? On se retrouve dans le bus ! 🚌"]);
  if(t.includes("story")) return `✨ Pour publier une Story : Fil → Toi + → Choisis photo → Publier. Ta story reste 24h ⏰`;
  if(t.includes("booster")) return `🚀 Pour Booster : Ouvre ton post → Clique sur la photo → Bouton jaune Booster 🔥`;
  if(t.includes("jasonbook")) return `📖 JASONBOOK c'est le réseau social 100% congolais 🇨🇩, créé par Jason Aloma. Posts, stories, messages, vocaux, booster, live, boutique !`;
  if(t.includes("motive")) return `🔥 Allez ${monNom} ! Ne regarde pas en arrière, on avance seulement ! Jason Aloma a créé JASONBOOK tout seul à Kinshasa, toi aussi tu peux réussir ! 💪🚀`;
  if(t.includes("légende") || t.includes("legende")) return `✍️ Légende pour toi : "Nouveau jour, nouvelle énergie 🔥 Made in Kinshasa 🇨🇩 #JASONBOOK"`;
  if(t.includes("merci")) return `De rien ${monNom} 😊❤️`;
  return `Hmm intéressant ${monNom} 🤔\n\nTu m'as dit : "${texte}"\n\nJe suis JASON Assistant, créé par Jason Aloma, développeur congolais 🇨🇩\n\nJe peux répondre à tout : Maths, Cours, Traduction, Sport, Amour, Business, JASONBOOK, Blague...\n\nRepose ta question un peu différemment, je vais te répondre ! 😊`;
}

window.envoyer = async ()=>{
  const txt = input.value.trim();
  const img = imageTemp;
  if(!txt && !img) return;
  const texteAffiche = txt || "Analyse cette image.";
  ajouterMsg(texteAffiche, 'mine', img); sauver(texteAffiche,'mine');
  history.push({role:'user', content:texteAffiche});
  history = history.slice(-20);
  input.value=""; retirerImage();
  input.disabled=true; btnSend.disabled=true;
  afficherTyping();

  try{
    const response = await fetch(
      getApiUrl(),
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          message: texteAffiche,
          image: img || "",
          knowledge: KNOWLEDGE,
          rules: RULES,
          history: history.slice(0, -1)
        })
      }
    );

    const data = await response.json();
    console.log(data);

    let reponse = extraireReponse(data);
    if(!reponse && typeof data === 'string') reponse = data;

    const apiBloquee = !reponse || reponse.toLowerCase().includes("connectez-vous") || reponse.toLowerCase().includes("payante") || reponse.toLowerCase().includes("utiliser les api") || reponse.length < 3;

    cacherTyping();
    let finale = apiBloquee ? cerveauLocal(texteAffiche, !!img) : corrigerReponse(reponse);
    ajouterMsg(finale, 'bot'); sauver(finale,'bot');
    history.push({role:'assistant', content:finale});
    history = history.slice(-20);

  }catch(e){
    console.error(e);
    cacherTyping();
    const finale = cerveauLocal(texteAffiche, !!img);
    ajouterMsg(finale, 'bot'); sauver(finale,'bot');
  } finally {
    input.disabled=false; btnSend.disabled=false; input.focus();
  }
};
</script>
