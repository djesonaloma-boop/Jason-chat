<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>JASONBOOK ✨ - Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0A0A0F;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--ligne:#26262F}
.top{flex-shrink:0;background:#0A0A0F;padding:10px 12px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.top .back{font-size:22px;cursor:pointer;flex-shrink:0}
.top .avatar{width:44px;height:44px;min-width:44px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#FFC107);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;flex-shrink:0}
.top .avatar .dot-online{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#22C55E;border:2px solid #0A0A0F;border-radius:50%}
.top .info{flex:1;min-width:0}
.top b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;color:#22C55E;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{width:38px;height:38px;min-width:38px;border-radius:50%;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
.suggestions{flex-shrink:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid var(--ligne)}
.suggestions::-webkit-scrollbar{display:none}
.suggestions button{flex-shrink:0;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:85%;padding:11px 13px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#1F1F2E;border:1px solid var(--ligne);align-self:flex-start;border-bottom-left-radius:4px}
.msg.mine{background:linear-gradient(135deg,var(--violet),var(--violet2));align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:4px;text-align:right}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.typing{display:none;gap:4px;align-items:center;background:#1F1F2E;padding:12px 14px;border-radius:18px;align-self:flex-start}
.typing.show{display:flex}
.typing i{width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.quick{flex-shrink:0;padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap;background:#12121A;border-top:1px solid var(--ligne)}
.quick button{background:#2A2A35;border:1px solid var(--ligne);color:#fff;padding:7px 12px;border-radius:999px;font-size:11px;cursor:pointer}
.preview-img{flex-shrink:0;display:none;gap:8px;align-items:center;background:#12121A;padding:8px 12px;border-top:1px solid var(--ligne)}
.preview-img.show{display:flex}
.preview-img img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.preview-img span{flex:1;font-size:12px;color:#A1A1AA}
.preview-img button{background:#E0245E;border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}
.input-wrap{flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#12121A;border-top:1px solid var(--ligne);display:flex;gap:8px;align-items:center}
.input-wrap input{flex:1;min-width:0;padding:12px 14px;background:#2A2A35;border:none;border-radius:999px;outline:none;color:#fff;font-size:14px}
.input-wrap input::placeholder{color:#888}
.input-wrap button{width:44px;height:44px;min-width:44px;border:none;border-radius:50%;background:#2A2A35;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.input-wrap button.send{background:linear-gradient(135deg,var(--violet),var(--or));color:#fff}
.input-wrap button:disabled{opacity:.5}
</style>
</head>
<body>

<div class="top">
<span class="back" onclick="history.back()">←</span>
<div class="avatar">🤖<span class="dot-online"></span></div>
<div class="info"><b>JASON Assistant ✨</b><small>En ligne • Créé par Jason Aloma</small></div>
<button onclick="effacerChat()">🗑️</button>
</div>

<div class="suggestions">
<button onclick="poser('Bonjour, présente-toi')">👋 Présente-toi</button>
<button onclick="poser('Comment publier une story ?')">✨ Story</button>
<button onclick="poser('Comment booster mon post ?')">🚀 Booster</button>
<button onclick="poser('Qui t\'a créé ?')">👑 Ton créateur</button>
<button onclick="poser('Raconte-moi une blague')">😂 Blague</button>
</div>

<div class="chat-body" id="chatBody"></div>

<div class="quick">
<button onclick="poser('Bonjour')">👋 Bonjour</button>
<button onclick="poser('Aide-moi')">🆘 Aide</button>
<button onclick="poser('C\'est quoi JASONBOOK ?')">📖 JASONBOOK</button>
</div>

<div class="preview-img" id="previewImgBox">
<img id="previewImg" src="">
<span>Image prête à envoyer 📷</span>
<button onclick="retirerImage()">✕</button>
</div>

<div class="input-wrap">
<button onclick="document.getElementById('fileImgAssistant').click()">📷</button>
<input type="file" id="fileImgAssistant" accept="image/*" style="display:none">
<input id="msgInput" placeholder="Pose ta question à JASON Assistant..." onkeydown="if(event.key==='Enter') envoyer()">
<button class="send" id="btnSend" onclick="envoyer()">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid');
if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"Ami";
const body = document.getElementById('chatBody');
const input = document.getElementById('msgInput');
const btnSend = document.getElementById('btnSend');

// ✅ ON GARDE L'API MAIS ON NE DEPEND PLUS D'ELLE
const API_URL = "https://davbot.pages.dev/api/intelligence-artificielle/ask";
const KNOWLEDGE = `Tu es JASON Assistant, l'assistant officiel de JASONBOOK. Tu as été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK, Made in Kinshasa, RDC. L'utilisateur s'appelle ${monNom}.`;
const RULES = `Tu t'appelles JASON Assistant, jamais DAVBOT. Si on te demande qui t'a créé : J'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK. Ne mentionne jamais DAVBOT. Réponds clairement, en français, comme un ami congolais, avec des emojis.`;

let history = [];
let imageTemp = "";
function heure(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function ajouterMsg(texte, qui, image=""){
  const div = document.createElement('div');
  div.className = 'msg ' + qui;
  let html = String(texte).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  if(image) html += `<img src="${image}">`;
  div.innerHTML = html + `<small>${heure()}</small>`;
  body.appendChild(div); body.scrollTop = body.scrollHeight;
  return div;
}
function afficherTyping(){
  const t = document.createElement('div');
  t.className = 'typing show'; t.id='typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  body.appendChild(t); body.scrollTop = body.scrollHeight;
}
function cacherTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }
async function sauver(texte, qui){
  try{ const r = push(ref(db,'jasonbook/assistant/'+uid)); await set(r,{texte, qui, timestamp:Date.now(), date:new Date().toLocaleString()}); }catch(e){}
}
async function charger(){
  try{
    const snap = await get(ref(db,'jasonbook/assistant/'+uid));
    const d = snap.val();
    if(d){
      const arr = Object.values(d).sort((a,b)=>a.timestamp-b.timestamp).slice(-30);
      arr.forEach(m=>{
        ajouterMsg(m.texte, m.qui);
        if(m.qui==='mine') history.push({role:'user', content:m.texte});
        if(m.qui==='bot') history.push({role:'assistant', content:m.texte});
      });
      history = history.slice(-20);
    } else {
      const bienvenue = `Salut ${monNom} 👋\n\nMoi c'est JASON Assistant 🤖✨\n\nJ'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK.\n\nJe suis là pour t'aider dans JASONBOOK :\n• Publier un post / story\n• Booster tes publications\n• Envoyer des messages\n• Trouver des amis\n• Analyser une image 📷\n• Toutes tes questions\n\nPose-moi une question ou envoie-moi une image !`;
      ajouterMsg(bienvenue, 'bot'); sauver(bienvenue,'bot');
    }
  }catch(e){ ajouterMsg(`Salut ${monNom} 👋 Je suis JASON Assistant, créé par Jason Aloma, développeur congolais. Pose-moi une question !`, 'bot'); }
}
charger();
document.getElementById('fileImgAssistant').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    imageTemp = ev.target.result;
    document.getElementById('previewImg').src = imageTemp;
    document.getElementById('previewImgBox').classList.add('show');
  };
  r.readAsDataURL(f);
});
window.retirerImage = ()=>{
  imageTemp = "";
  document.getElementById('previewImgBox').classList.remove('show');
  document.getElementById('fileImgAssistant').value = "";
};
window.poser = (txt)=>{ input.value = txt; envoyer(); };
window.effacerChat = async ()=>{
  if(!confirm("Effacer la conversation avec l'assistant ?")) return;
  body.innerHTML=""; history=[]; retirerImage();
  ajouterMsg(`Conversation effacée ✅\nRepose-moi une question ${monNom} 😊\nMoi c'est JASON Assistant, créé par Jason Aloma`, 'bot');
};
function corrigerReponse(txt){
  let t = String(txt||"");
  t = t.replace(/DAVBot/gi, "JASON Assistant").replace(/DAV BOT/gi, "JASON Assistant").replace(/Davbot/gi, "JASON Assistant").replace(/davbot/gi, "JASON Assistant");
  if(t.toLowerCase().includes("créé par") && !t.toLowerCase().includes("jason aloma")){
    t += "\n\n— Je précise : j'ai été créé par Jason Aloma, développeur congolais";
  }
  return t;
}
function extraireReponse(data){
  if(!data) return "";
  if(typeof data === 'string') return data;
  const cles = ["reply","response","message","text","answer","result","output","content","reponse","ai_response","bot_response","completion","analysis","analyse"];
  for(const k of cles){
    if(typeof data[k] === 'string' && data[k].trim().length > 2) return data[k];
    if(data[k] && typeof data[k] === 'object'){
      const sous = extraireReponse(data[k]);
      if(sous) return sous;
    }
  }
  if(Array.isArray(data.choices) && data.choices[0]){
    const c = data.choices[0];
    if(c.message && typeof c.message.content === 'string') return c.message.content;
    if(typeof c.text === 'string') return c.text;
  }
  if(data.data) {
    const sous = extraireReponse(data.data);
    if(sous) return sous;
  }
  let meilleur = "";
  function fouiller(obj){
    if(!obj || typeof obj !== 'object') return;
    for(const v of Object.values(obj)){
      if(typeof v === 'string' && v.length > meilleur.length && v.length > 10 && !v.includes("http") && !v.includes("{") && !v.includes("jasonbook_uid")){
        meilleur = v;
      } else if(typeof v === 'object'){ fouiller(v); }
    }
  }
  fouiller(data);
  return meilleur;
}

// ✅ CERVEAU LOCAL - MARCHE MEME SI L'API EST PAYANTE / BLOQUEE
function cerveauLocal(texte, aImage){
  const t = texte.toLowerCase();
  if(aImage){
    return `Super image ${monNom} 📷✨\n\nJe vois ton image ! Elle est bien claire.\n\nSi c'est une photo de toi, un post, ou une story : tu peux la publier direct dans JASONBOOK !\n\n• Pour Story : Fil → Toi + → Choisir photo\n• Pour Post : Bouton + en bas → Publier\n\nTu veux que je t'aide à écrire une légende pour cette photo ? Dis-moi : "Écris une légende" 😊\n\n— JASON Assistant, créé par Jason Aloma 🇨🇩`;
  }
  if(t.includes("qui") && (t.includes("créé") || t.includes("createur") || t.includes("créateur") || t.includes("fondateur") || t.includes("fait") || t.includes("développé") || t.includes("developpe"))){
    return `Moi c'est JASON Assistant 🤖✨\n\nJ'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK, Made in Kinshasa 🇨🇩\n\nC'est lui qui m'a créé pour t'aider dans JASONBOOK !`;
  }
  if(t.includes("présente") || t.includes("presente") || t.includes("tu es qui") || t.includes("c'est quoi ton nom") || t.includes("ton nom")){
    return `Salut ${monNom} 👋\n\nMoi c'est JASON Assistant 🤖\nJ'ai été créé par Jason Aloma, un développeur congolais, fondateur de JASONBOOK.\n\nJe suis ton assistant dans JASONBOOK : je t'aide pour publier, story, booster, messages, amis, et même analyser tes images 📷\n\nPose-moi une question !`;
  }
  if(t.includes("bonjour") || t.includes("salut") || t.includes("hello") || t.includes("yo") || t.includes("coucou")){
    return `Salut ${monNom} 👋😊\n\nÇa va ? Moi je suis là, en forme !\n\nTu veux :\n• Publier quelque chose ?\n• Voir tes stories ?\n• Booster un post ?\n• Une blague ?\n\nDis-moi !`;
  }
  if(t.includes("ça va") || t.includes("ca va") || t.includes("comment tu vas") || t.includes("la forme")){
    return `Ça va super bien ${monNom} 😎✨ Et toi ?\n\nMoi je suis toujours en ligne pour t'aider, même à 3h du matin 😂\nDis-moi, tu veux publier quoi aujourd'hui ?`;
  }
  if(t.includes("story") || t.includes("statut") || t.includes("stories")){
    return `✨ Pour publier une Story :\n\n1. Va sur le Fil (Accueil)\n2. En haut, clique sur le rond Toi +\n3. Choisis une photo / vidéo\n4. Ajoute un texte si tu veux\n5. Clique sur Publier la story\n\nTa story reste 24h ⏰\nLes gens peuvent réagir avec 👍 ❤️ 🥰 😡 😭 😥 😲\nEt toi tu peux voir qui a réagi en cliquant sur 👀 Voir qui a réagi !`;
  }
  if(t.includes("booster") || t.includes("boost")){
    return `🚀 Pour Booster ton post :\n\n1. Ouvre ta publication\n2. Clique sur la photo pour l'ouvrir en grand\n3. Clique sur le bouton jaune 🚀 Booster\n4. Choisis ton option (Likes, Commentaires, Partages)\n\nTon post sera plus visible dans le Fil ! 🔥`;
  }
  if(t.includes("publier") || t.includes("post") || t.includes("publication") || t.includes("légende") || t.includes("legende") || t.includes("caption")){
    if(t.includes("légende") || t.includes("legende")) return `Voici 3 légendes pour toi ${monNom} ✨ :\n\n1. "Nouveau jour, nouvelle énergie 🔥 Made in Kinshasa 🇨🇩 #JASONBOOK"\n2. "La vie est belle quand on est entouré des bonnes personnes ❤️✨"\n3. "Ne regarde pas en arrière, on avance seulement 🚀💪"\n\nTu veux une autre style ? Drôle, amour, motivation ?`;
    return `📝 Pour publier :\n\n1. Clique sur le bouton + en bas au milieu\n2. Ou clique sur Quoi de neuf ?\n3. Écris ton texte, ajoute une photo / vidéo\n4. Clique sur Publier\n\nEt voilà, tout le monde verra ton post dans le Fil ! ✨`;
  }
  if(t.includes("message") || t.includes("discuter") || t.includes("chat") || t.includes("parler")){
    return `💬 Pour envoyer un message :\n\n1. Va dans Messages en bas\n2. Cherche ton ami dans la liste\n3. Clique sur son nom\n4. Écris ton message et envoie ➤\n\nTu peux aussi envoyer :\n📷 Photo\n🎤 Vocal (bouton micro)\n↩️ Répondre à un message (reste appuyé)`;
  }
  if(t.includes("ami") || t.includes("suivre") || t.includes("abonn")){
    return `👥 Pour trouver des amis :\n\n1. Va dans Amis\n2. Ou utilise la 🔍 Recherche en haut\n3. Cherche le nom de la personne\n4. Clique sur Suivre / Ajouter\n\nPlus tu as d'amis, plus ton fil est vivant ! 🎉`;
  }
  if(t.includes("blague") || t.includes("drole") || t.includes("drôle") || t.includes("rire") || t.includes("marrant")){
    const blagues = [
      "😂 Pourquoi les plongeurs plongent-ils toujours en arrière ?\nParce que sinon, ils tombent dans le bateau ! 🤣",
      "😂 Que dit un bit à l'autre ?\nOn se retrouve dans le bus ! 🚌",
      "😂 Pourquoi les oiseaux ne jouent-ils jamais aux cartes ?\nParce qu'ils ont peur du chat ! 🐱",
      "😂 Pourquoi JASONBOOK est le meilleur ?\nParce que c'est Made in Kinshasa 🇨🇩✨ !",
      "😂 Qu'est-ce qu'un Congolais dit quand il est content ?\n« Na za bien ! » 😎🔥"
    ];
    return blagues[Math.floor(Math.random()*blagues.length)];
  }
  if(t.includes("jasonbook") || t.includes("c'est quoi") || t.includes("cest quoi")){
    return `📖 JASONBOOK c'est quoi ?\n\nC'est le réseau social 100% congolais 🇨🇩, créé par Jason Aloma, développeur congolais.\n\nTu peux :\n• Publier des posts et stories\n• Discuter en messages, vocaux, photos\n• Booster tes posts\n• Aller en Live\n• Vendre dans la Boutique 🛒\n\nMade in Kinshasa, pour tout le monde ! ✨`;
  }
  if(t.includes("kinshasa") || t.includes("congo") || t.includes("rdc") || t.includes("congolais")){
    return `🇨🇩 Kinshasa c'est la capitale ! La ville la plus ambiançée !\n\nJASONBOOK c'est Made in Kinshasa, pour tous les Congolais et tout le monde !\n\nTu es de quel quartier ${monNom} ? Gombe, Bandal, Matete, Lemba, Ngaliema ? 😎`;
  }
  if(t.includes("amour") || t.includes("coeur") || t.includes("crush") || t.includes("copine") || t.includes("copain") || t.includes("draguer")){
    return `❤️ Ah l'amour...\n\nSi tu as un crush sur JASONBOOK :\n1. Réagis à ses stories avec 🥰 ❤️\n2. Commente ses posts gentiment\n3. Envoie-lui un message 💬\n\nAllez, lance-toi, on ne sait jamais ! 😘`;
  }
  if(t.includes("argent") || t.includes("gagner") || t.includes("business") || t.includes("vendre")){
    return `💰 Pour gagner avec JASONBOOK :\n\n1. Publie beaucoup de contenu de qualité\n2. Utilise le Booster pour être visible\n3. Gagne des abonnés / amis\n4. Vends dans la Boutique / Marketplace 🛒\n\nLe travail paie toujours ! 💪`;
  }
  if(t.includes("aide") || t.includes("help") || t.includes("comment") || t.includes("explique")){
    return `🆘 Je peux t'aider pour :\n\n• ✨ Story - Comment publier une story\n• 📝 Publier - Comment faire un post\n• 🚀 Booster - Comment booster\n• 💬 Message - Comment discuter\n• 👥 Amis - Comment trouver des amis\n• 😂 Blague - Pour rigoler\n• 📷 Image - Envoie-moi une image, je l'analyse\n\nÉcris juste un mot : ex : Story ou Booster`;
  }
  if(t.includes("merci")){
    return `De rien ${monNom} 😊❤️\nC'est normal, je suis là pour toi !\nTu as une autre question ?`;
  }
  if(t.includes("au revoir") || t.includes("bye") || t.includes("bonne nuit") || t.includes("à plus")){
    return `À plus ${monNom} 👋😊\nReviens quand tu veux, je suis toujours là !\n\n— JASON Assistant, créé par Jason Aloma 🇨🇩`;
  }
  return `Hmm intéressant ${monNom} 🤔\n\nTu m'as dit : "${texte}"\n\nJe suis JASON Assistant, créé par Jason Aloma, développeur congolais 🇨🇩\n\nJe peux t'aider pour :\n• ✨ Story\n• 📝 Publier\n• 🚀 Booster\n• 💬 Message\n• 👥 Amis\n• 😂 Blague\n• 📷 Analyse d'image\n\nÉcris l'un de ces mots et je t'explique tout ! 😊`;
}

window.envoyer = async ()=>{
  const txt = input.value.trim();
  const img = imageTemp;
  if(!txt && !img) return;
  const texteAffiche = txt || "📷 Analyse cette image.";
  ajouterMsg(texteAffiche, 'mine', img); sauver(texteAffiche,'mine');
  history.push({role:'user', content:texteAffiche});
  history = history.slice(-20);
  input.value=""; retirerImage();
  input.disabled=true; btnSend.disabled=true;
  afficherTyping();

  // ✅ 1. On essaie l'API /ask
  let reponseAPI = "";
  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ message: texteAffiche, image: img || "", knowledge: KNOWLEDGE, rules: RULES, history: history.slice(0, -1) })
    });
    const rawText = await response.text();
    let data;
    try{ data = JSON.parse(rawText); }catch(e){ data = rawText; }
    reponseAPI = extraireReponse(data);
    if(!reponseAPI && typeof rawText === 'string') reponseAPI = rawText;
  }catch(e){ reponseAPI = ""; }

  // ✅ 2. Si l'API dit "Connectez-vous / payantes / compte" ou ne répond rien → CERVEAU LOCAL
  const apiBloquee = !reponseAPI || reponseAPI.toLowerCase().includes("connectez-vous") || reponseAPI.toLowerCase().includes("payante") || reponseAPI.toLowerCase().includes("compte jason") || reponseAPI.toLowerCase().includes("utiliser les api") || reponseAPI.length < 3;

  cacherTyping();
  let reponseFinale = "";
  if(apiBloquee){
    reponseFinale = cerveauLocal(texteAffiche, !!img);
  } else {
    reponseFinale = corrigerReponse(reponseAPI);
  }
  ajouterMsg(reponseFinale, 'bot'); sauver(reponseFinale,'bot');
  history.push({role:'assistant', content:reponseFinale});
  history = history.slice(-20);
  input.disabled=false; btnSend.disabled=false; input.focus();
};
</script>
