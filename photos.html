<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Photos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{font-size:23px;letter-spacing:-.3px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-grey{background:#f0f2f5;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border:none;background:#fff;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs button.active{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid .item{aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;background:#e4e6eb;position:relative}
.grid .item img{width:100%;height:100%;object-fit:cover}
.grid .item .info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:14px 8px 8px;font-size:12px;line-height:1.3}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:75vh;border-radius:10px;object-fit:contain}
.lightbox .caption{color:#fff;margin-top:12px;text-align:center;max-width:600px}
.lightbox .close{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.lightbox .prev{left:12px}.lightbox .next{right:12px}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>📷 Photos</h1><button class="btn-blue" onclick="location.href='creer-post.html'">➕ Publier une photo</button></div>
<div class="tabs">
<button id="t-toutes" class="active" onclick="showTab('toutes')">Toutes les photos</button>
<button id="t-miennes" onclick="showTab('miennes')">Mes photos</button>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">📷</div><h3>Aucune photo pour le moment</h3><p>Publie la première photo !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="photos.html">📷</a><a href="profil.html">👤</a></nav>

<div class="lightbox" id="lightbox">
<button class="close" onclick="fermerLightbox()">✕</button>
<button class="nav prev" onclick="photoPrec()">‹</button>
<img id="lbImg">
<button class="nav next" onclick="photoSuiv()">›</button>
<div class="caption"><b id="lbNom"></b><br><span id="lbTexte"></span><br><small id="lbMeta"></small><br><button class="btn-grey" style="margin-top:10px" id="btnLbSupp" onclick="supprimerPhoto()">🗑️ Supprimer</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let toutes=[], filtre='toutes', indexActuel=0;
window.showTab=(t)=>{ filtre=t; ['toutes','miennes'].forEach(x=>document.getElementById('t-'+x).classList.toggle('active',x===t)); rendre(); };
function listeFiltree(){ return filtre==='miennes' ? toutes.filter(p=>p.auteurUid===uid) : toutes; }
function rendre(){
  const liste=listeFiltree(); const grid=document.getElementById('grid'); grid.innerHTML="";
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach((p,i)=>{
    const div=document.createElement('div'); div.className='item'; div.onclick=()=>ouvrirLightbox(i);
    div.innerHTML=`<img src="${p.photoUrl}"><div class="info"><b>${p.nomAuteur||""}</b><br>${(p.texte||"").substring(0,40)}${(p.texte||"").length>40?'...':''}</div>`;
    grid.appendChild(div);
  });
}
window.ouvrirLightbox=(i)=>{
  indexActuel=i; const p=listeFiltree()[i]; if(!p) return;
  document.getElementById('lightbox').classList.add('open');
  document.getElementById('lbImg').src=p.photoUrl;
  document.getElementById('lbNom').innerText=p.nomAuteur||"";
  document.getElementById('lbTexte').innerText=p.texte||"";
  document.getElementById('lbMeta').innerText=(p.ville||"")+" • "+(p.date||"")+" • 👍 "+(p.likesCount||0);
  document.getElementById('btnLbSupp').style.display = p.auteurUid===uid ? "inline-block" : "none";
};
window.fermerLightbox=()=>document.getElementById('lightbox').classList.remove('open');
window.photoPrec=()=>{ const l=listeFiltree(); indexActuel=(indexActuel-1+l.length)%l.length; ouvrirLightbox(indexActuel); };
window.photoSuiv=()=>{ const l=listeFiltree(); indexActuel=(indexActuel+1)%l.length; ouvrirLightbox(indexActuel); };
window.supprimerPhoto=async()=>{ const p=listeFiltree()[indexActuel]; if(!p) return; if(!confirm("Supprimer cette photo ?")) return; await remove(ref(db,'jasonbook/posts/'+p.id)); fermerLightbox(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fermerLightbox(); if(e.key==='ArrowRight') photoSuiv(); if(e.key==='ArrowLeft') photoPrec(); });
onValue(ref(db,'jasonbook/posts'), (snap)=>{
  const data=snap.val(); if(!data){ toutes=[]; rendre(); return; }
  toutes=Object.entries(data).map(([id,p])=>({id,...p})).filter(p=>p.photoUrl).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  rendre();
});
</script>
</body>
</html>
