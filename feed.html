<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>JASONBOOK ✨ - Recherche</title>
<style>
:root{--bg:#0A0A0F;--card:#16161F;--card2:#1F1F2E;--violet:#7C3AED;--gold:#FFC107;--muted:#A1A1AA;--line:#26262F}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh;padding-bottom:92px;padding-top:62px;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
/* HEADER COMME FEED - NE DISPARAIT PAS */
.header-fixe{position:fixed;top:0;left:0;right:0;z-index:999;background:#0A0A0F;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px}
.logo{font-size:20px;font-weight:900;white-space:nowrap;flex:1;line-height:1}
.logo i{color:var(--gold);font-style:normal}
.logo small{display:block;font-size:8px;color:var(--muted);letter-spacing:1.2px;margin-top:1px}
.btn-top{width:38px;height:38px;min-width:38px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;position:relative}
.btn-top .dot{position:absolute;top:-5px;right:-5px;background:#E0245E;color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:999px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0A0A0F}
.wrap{max-width:650px;margin:0 auto;padding:12px 10px}
.search-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.search-box .row{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px}
.search-box input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font-size:15px;padding:10px 0}
.search-box input::placeholder{color:var(--muted)}
.btn-search{background:var(--violet);border:0;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.btn-clear{background:#2A2A35;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:14px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--card);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tabs button.active{background:linear-gradient(135deg,var(--gold),#FF9800);color:#000;border-color:transparent}
.sec{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px;padding:12px 4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card:active{background:var(--card2)}
.ava{width:52px;height:52px;min-width:52px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.card .info{flex:1;min-width:0}
.card .info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-mini{border:0;padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.btn-voir{background:var(--card2);color:#fff}
.btn-ami{background:var(--gold);color:#000}
.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px;margin-bottom:12px;cursor:pointer}
.post .head{display:flex;gap:10px;align-items:center}
.post .head .info{flex:1;min-width:0}
.post .head small{color:var(--muted);font-size:11px}
.post p{margin:10px 0;white-space:pre-wrap;line-height:1.5;font-size:14px;color:#E8E8EF;overflow-wrap:anywhere}
.post img.pimg{width:100%;max-height:320px;object-fit:cover;border-radius:14px;display:block}
.post video{width:100%;max-height:320px;border-radius:14px;background:#000}
.post .counts{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:12px}
.empty{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 12px;color:var(--muted);margin-top:10px}
.loading{text-align:center;color:var(--gold);padding:20px;font-size:13px}
.histo{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0}
.histo button{background:var(--card2);border:1px solid var(--line);color:#fff;padding:7px 12px;border-radius:999px;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,10,15,.96);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.bottom button.active{color:var(--gold)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F}
</style>
</head>
<body>

<div class="header-fixe">
  <div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
  <button class="btn-top" onclick="location.href='recherche.html'">🔍</button>
  <button class="btn-top" onclick="location.href='notifications.html'">🔔<span class="dot" id="dotNotifTop">0</span></button>
  <button class="btn-top" onclick="location.href='feed.html'">🏠</button>
</div>

<main class="wrap">
<div class="search-box">
  <div class="row">
    <span>🔍</span>
    <input id="inputRecherche" placeholder="Chercher une personne, une publication..." autocomplete="off">
    <button class="btn-clear" id="btnClear" onclick="effacerRecherche()" style="display:none">✕</button>
    <button class="btn-search" onclick="lancerRecherche()">Chercher</button>
  </div>
  <div id="zoneHisto" style="display:none">
    <div class="sec">🕐 RÉCENTES</div>
    <div class="histo" id="listeHisto"></div>
    <button onclick="effacerHisto()" style="background:none;border:0;color:#FF8A9A;font-size:12px;padding:6px">Effacer l'historique</button>
  </div>
</div>

<div class="tabs">
  <button class="active" data-filtre="tout" onclick="setFiltre('tout',this)">✨ Tout</button>
  <button data-filtre="personnes" onclick="setFiltre('personnes',this)">👥 Personnes</button>
  <button data-filtre="posts" onclick="setFiltre('posts',this)">📝 Publications</button>
  <button data-filtre="videos" onclick="setFiltre('videos',this)">🎥 Vidéos</button>
</div>

<div id="loading" class="loading" style="display:none">⏳ Recherche...</div>
<div id="resultats"></div>
<div id="empty" class="empty" style="display:none">
  <div style="font-size:42px">🔍</div>
  <h3 style="color:#fff;margin:8px 0">Tape un nom ou un mot</h3>
  <p>Ex : Jason, Kinshasa, Musique...</p>
</div>
</main>

<div class="bottom">
<button onclick="location.href='feed.html'"><span>🏠</span>Accueil</button>
<button onclick="location.href='amis.html'"><span>👥</span>Amis</button>
<button onclick="location.href='creer-post.html'"><span class="centre">+</span></button>
<button onclick="location.href='messages.html'"><span>💬</span>Messages</button>
<button onclick="location.href='profil.html'"><span>👤</span>Moi</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,get} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const uid=localStorage.getItem("jasonbook_uid");
const $=id=>document.getElementById(id);
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function avatarHTML(photo,nom){return photo?`<img src="${escapeHTML(photo)}">`:escapeHTML((nom||"?").charAt(0).toUpperCase());}
let tousUsers=[]; let tousPosts=[]; let filtre="tout"; let requete="";

function getHisto(){ try{return JSON.parse(localStorage.getItem("jasonbook_histo_recherche")||"[]")}catch(e){return []} }
function saveHisto(q){
  let h=getHisto(); h=h.filter(x=>x.toLowerCase()!==q.toLowerCase()); h.unshift(q); h=h.slice(0,8);
  localStorage.setItem("jasonbook_histo_recherche",JSON.stringify(h)); afficherHisto();
}
function afficherHisto(){
  let h=getHisto();
  if(!h.length){ $("zoneHisto").style.display="none"; return; }
  if(requete){ $("zoneHisto").style.display="none"; return; }
  $("zoneHisto").style.display="block";
  $("listeHisto").innerHTML=h.map(x=>`<button onclick="rechercherDepuisHisto('${escapeHTML(x)}')">🕐 ${escapeHTML(x)}</button>`).join("");
}
window.effacerHisto=()=>{ localStorage.removeItem("jasonbook_histo_recherche"); afficherHisto(); };
window.rechercherDepuisHisto=(q)=>{ $("inputRecherche").value=q; lancerRecherche(); };
window.effacerRecherche=()=>{ $("inputRecherche").value=""; requete=""; $("btnClear").style.display="none"; afficherHisto(); $("resultats").innerHTML=""; $("empty").style.display="block"; };

window.setFiltre=(f,btn)=>{
  filtre=f;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  afficherResultats();
};

function normalise(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

window.lancerRecherche=()=>{
  let q=$("inputRecherche").value.trim();
  if(!q) return;
  requete=q;
  $("btnClear").style.display="block";
  saveHisto(q);
  afficherResultats();
};

function afficherResultats(){
  let box=$("resultats");
  if(!requete){
    box.innerHTML=""; $("empty").style.display="block"; afficherHisto(); return;
  }
  $("empty").style.display="none"; $("zoneHisto").style.display="none";
  let q=normalise(requete);
  // ✅ VRAIE RECHERCHE DANS LES UTILISATEURS
  let users=tousUsers.filter(u=>{
    let texte=normalise((u.nom||"")+" "+(u.ville||"")+" "+(u.pays||"")+" "+(u.bio||""));
    return texte.includes(q);
  }).slice(0,20);
  // ✅ VRAIE RECHERCHE DANS LES POSTS
  let posts=tousPosts.filter(p=>{
    let texte=normalise((p.texte||"")+" "+(p.nomAuteur||""));
    return texte.includes(q);
  }).slice(0,20);
  let videos=posts.filter(p=>p.videoUrl);

  if(filtre==="personnes") posts=[];
  if(filtre==="posts") users=[];
  if(filtre==="videos"){ users=[]; posts=videos; }

  let html="";
  if(users.length){
    html+=`<div class="sec">👥 PERSONNES (${users.length})</div>`;
    html+=users.map(u=>{
      let isMoi=u.id===uid;
      return `<div class="card" onclick="voirProfil('${escapeHTML(u.id)}')">
        <div class="ava">${avatarHTML(u.photo||u.photoUrl,u.nom)}</div>
        <div class="info"><b>${escapeHTML(u.nom||"Utilisateur")}</b><small>${escapeHTML(u.ville||"")}${u.pays?" • "+escapeHTML(u.pays):""}${u.bio?" • "+escapeHTML(u.bio.slice(0,40)):""}</small></div>
        <button class="btn-mini ${isMoi?'btn-voir':'btn-ami'}" onclick="event.stopPropagation(); voirProfil('${escapeHTML(u.id)}')">${isMoi?'Moi':'Voir'}</button>
      </div>`;
    }).join("");
  }
  if(posts.length){
    html+=`<div class="sec">📝 PUBLICATIONS (${posts.length})</div>`;
    html+=posts.map(p=>{
      let photo=p.photoUrl||p.image||""; let video=p.videoUrl||"";
      return `<div class="post" onclick="voirProfil('${escapeHTML(p.auteurUid||"")}')">
        <div class="head"><div class="ava" style="width:40px;height:40px;font-size:14px">${avatarHTML(p.photoAuteur,p.nomAuteur)}</div><div class="info"><b>${escapeHTML(p.nomAuteur||"")}</b><br><small>${escapeHTML(p.date||"")}</small></div></div>
        <p>${escapeHTML((p.texte||"").slice(0,220))}</p>
        ${photo?`<img class="pimg" src="${escapeHTML(photo)}">`:""}
        ${video?`<video controls src="${escapeHTML(video)}"></video>`:""}
        <div class="counts">❤️ ${p.likesCount||0} • 💬 ${p.commentairesCount||0} • ↗️ ${p.partagesCount||0}</div>
      </div>`;
    }).join("");
  }
  if(!html){
    box.innerHTML=`<div class="empty"><div style="font-size:42px">😢</div><h3 style="color:#fff;margin:8px 0">Aucun résultat pour "${escapeHTML(requete)}"</h3><p>Essaie un autre nom ou un autre mot.</p></div>`;
    return;
  }
  box.innerHTML=html;
}
window.voirProfil=(id)=>{
  if(!id) return;
  if(id===uid) location.href='profil.html';
  else location.href='profil-ami.html?uid='+id;
};

// ✅ CHARGE LES VRAIS UTILISATEURS DEPUIS FIREBASE
get(ref(db,'jasonbook/users')).then(s=>{
  let d=s.val()||{};
  tousUsers=Object.entries(d).map(([id,u])=>({id,...u}));
  // Si tu as déjà tapé, re-affiche
  if(requete) afficherResultats();
});
onValue(ref(db,'jasonbook/posts'),s=>{
  let d=s.val()||{};
  tousPosts=Object.entries(d).map(([id,p])=>({id,...p})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  if(requete) afficherResultats();
});

// ✅ NOTIF EN HAUT
if(uid){
  onValue(ref(db,'jasonbook/notifications/'+uid),s=>{
    let d=s.val(); let n=0; if(d) Object.values(d).forEach(x=>{if(!x.lu)n++});
    let dot=$("dotNotifTop"); if(dot){ if(n>0){dot.style.display="flex"; dot.innerText=n>99?"99+":n;} else dot.style.display="none"; }
  });
}

// ✅ QUAND TU ARRIVES DEPUIS FEED AVEC ?q=Jason
let params=new URLSearchParams(location.search);
let q0=params.get("q");
if(q0){ $("inputRecherche").value=q0; requete=q0; $("btnClear").style.display="block"; afficherResultats(); }
else { $("empty").style.display="block"; afficherHisto(); }

$("inputRecherche").addEventListener("input",()=>{
  let v=$("inputRecherche").value.trim();
  $("btnClear").style.display=v?"block":"none";
  if(!v){ requete=""; afficherResultats(); return; }
  requete=v; afficherResultats();
});
$("inputRecherche").addEventListener("keydown",e=>{ if(e.key==="Enter") lancerRecherche(); });
$("inputRecherche").focus();
</script>
</body>
</html>
