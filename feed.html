<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JASONBOOK ✨ - Accueil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
:root{--bg:#0A0A0F;--card:#16161F;--card2:#1F1F2E;--violet:#7C3AED;--gold:#FFC107;--muted:#A1A1AA;--line:#26262F;--red:#E0245E}
body{background:var(--bg);color:#fff;min-height:100vh;padding-bottom:92px;overflow-x:hidden}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);padding:8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.logo{font-size:16px;font-weight:900;white-space:nowrap;flex-shrink:0}
.logo i{color:var(--gold);font-style:normal}
.logo small{display:block;font-size:7px;color:var(--muted);letter-spacing:.8px}
.search-top{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-notif,.btn-menu{width:34px;height:34px;min-width:34px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.wrap{max-width:650px;margin:0 auto;padding:10px 10px}
.creer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.creer .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.creer .ava img{width:100%;height:100%;object-fit:cover}
.creer input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:10px 12px;color:#fff;outline:none;font-size:13px}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.post-head{display:flex;gap:10px;align-items:center;padding:12px 12px 8px}
.post-head .ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden;flex-shrink:0}
.post-head .ava img{width:100%;height:100%;object-fit:cover}
.post-head .info{flex:1;min-width:0}
.post-head b{font-size:15px}
.post-head small{color:var(--muted);font-size:12px;display:block}
.btn-suivre{background:transparent;border:1.5px solid var(--gold);color:var(--gold);padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;flex-shrink:0}
.btn-suivre.suit{background:var(--gold);color:#111}
.post-texte{padding:2px 12px 10px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.post-img{width:100%;display:block;max-height:520px;object-fit:cover;background:#000}
/* ✅ C'EST TON STYLE D'AVANT POUR LES BOUTONS EN BAS - COMME TON POST "Nsimba nsix" */
.actions{display:flex;align-items:center;gap:6px;padding:10px 8px}
.actions button{flex:1;background:var(--card2);border:none;color:#fff;padding:9px 4px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.actions button.active-like{color:#FF6B9D}
.actions button.active-fav{color:var(--gold)}
.actions button span{font-size:15px}
.commentaires{background:#0F0F16;padding:10px 12px;border-top:1px solid var(--line);display:none}
.commentaires.open{display:block}
.com-item{display:flex;gap:8px;margin-bottom:8px}
.com-item .c-ava{width:28px;height:28px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;overflow:hidden}
.com-item .c-ava img{width:100%;height:100%;object-fit:cover}
.com-item .c-box{background:var(--card2);border-radius:12px;padding:7px 10px;flex:1}
.com-item b{font-size:12px}
.com-item p{font-size:13px;margin-top:2px}
.com-form{display:flex;gap:6px;margin-top:8px}
.com-form input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 12px;color:#fff;outline:none;font-size:13px}
.com-form button{background:var(--gold);border:none;border-radius:999px;padding:9px 14px;font-weight:800;color:#111}
.empty{text-align:center;color:var(--muted);padding:30px;background:var(--card);border-radius:16px;border:1px solid var(--line)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(10,10,15,.98);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;flex:1}
.bottom button.active{color:var(--gold)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F;flex:none}
</style>
</head>
<body>

<div class="top">
<div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
<div class="search-top" onclick="location.href='recherche.html'">🔍 Chercher...</div>
<button class="btn-notif" onclick="location.href='notifications.html'">🔔</button>
<button class="btn-menu" onclick="location.href='profil.html'">☰</button>
</div>

<div class="wrap">
<div class="creer">
<div class="ava" id="monAva">J</div>
<input readonly placeholder="Quoi de neuf, publie quelque chose..." onclick="location.href='creer-post.html'">
</div>
<div id="feed"></div>
<div class="empty" id="emptyBox" style="display:none">Aucune publication pour le moment.<br>Sois le premier à publier ! ✨</div>
</div>

<div class="bottom">
<button class="active"><span>🏠</span>Accueil</button>
<button onclick="location.href='amis.html'"><span>👥</span>Amis</button>
<button onclick="location.href='creer-post.html'"><span class="centre">+</span></button>
<button onclick="location.href='messages.html'"><span>💬</span>Messages</button>
<button onclick="location.href='profil.html'"><span>👤</span>Moi</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,set,remove,push,get} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const uid=localStorage.getItem("jasonbook_uid");
const monNom=localStorage.getItem("jasonbook_nom")||"Moi";
const maPhoto=localStorage.getItem("jasonbook_photo")||"";
if(!uid) location.href="index.html";
document.getElementById('monAva').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let posts={}, likes={}, commentaires={}, favoris={}, suivis=new Set();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function rendre(){
  const box=document.getElementById('feed'); box.innerHTML="";
  let liste=Object.entries(posts).map(([id,p])=>({id,...p})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  document.getElementById('emptyBox').style.display=liste.length?"none":"block";
  liste.forEach(p=>{
    const nbLikes = likes[p.id] ? Object.keys(likes[p.id]).length : (p.likes || 0);
    const nbComs = commentaires[p.id] ? Object.keys(commentaires[p.id]).length : (p.nbCommentaires || 0);
    const nbPartages = p.partages || 0;
    const jaiLike = likes[p.id] && likes[p.id][uid];
    const estFav = favoris[p.id] ? true : false;
    const jeSuis = suivis.has(p.auteurUid);
    const div=document.createElement('div'); div.className='post';
    div.innerHTML=`
      <div class="post-head">
        <div class="ava">${p.photoAuteur?`<img src="${esc(p.photoAuteur)}" loading="lazy">`:esc((p.nomAuteur||"?").charAt(0).toUpperCase())}</div>
        <div class="info"><b>${esc(p.nomAuteur||"Utilisateur")}</b><small>${esc(p.date||"")}</small></div>
        ${p.auteurUid!==uid?`<button class="btn-suivre ${jeSuis?'suit':''}" onclick="toggleSuivre('${p.auteurUid}',this)">${jeSuis?'✓ Suivi':'Suivre'}</button>`:''}
      </div>
      ${p.texte?`<div class="post-texte">${esc(p.texte)}</div>`:''}
      ${p.image?`<img class="post-img" src="${esc(p.image)}" loading="lazy">`:''}
      ${p.video?`<video class="post-img" src="${esc(p.video)}" controls preload="none"></video>`:''}
      <div class="actions">
        <button class="${jaiLike?'active-like':''}" onclick="toggleLike('${p.id}',this)"><span>${jaiLike?'❤️':'❤️'}</span> ${nbLikes}</button>
        <button onclick="toggleComs('${p.id}')"><span>💬</span> ${nbComs}</button>
        <button onclick="partager('${p.id}')"><span>↗️</span> ${nbPartages}</button>
        <button class="${estFav?'active-fav':''}" onclick="toggleFav('${p.id}',this)"><span>⭐</span> ${estFav?'Favori':'Favori'}</button>
      </div>
      <div class="commentaires" id="coms-${p.id}">
        <div id="liste-coms-${p.id}"></div>
        <div class="com-form"><input id="input-${p.id}" placeholder="Écrire un commentaire..."><button onclick="envoyerCom('${p.id}')">Envoyer</button></div>
      </div>
    `;
    box.appendChild(div);
    const cBox=document.getElementById(`liste-coms-${p.id}`);
    if(cBox){
      const coms=commentaires[p.id]||{};
      Object.values(coms).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(c=>{
        const cdiv=document.createElement('div'); cdiv.className='com-item';
        cdiv.innerHTML=`<div class="c-ava">${c.photo?`<img src="${esc(c.photo)}">`:esc((c.nom||"?").charAt(0))}</div><div class="c-box"><b>${esc(c.nom||"")}</b><p>${esc(c.texte||"")}</p></div>`;
        cBox.appendChild(cdiv);
      });
    }
  });
}
window.toggleLike=async (postId)=>{
  const likeRef=ref(db,'jasonbook/likes/'+postId+'/'+uid);
  const snap=await get(likeRef);
  if(snap.exists()){ await remove(likeRef); }
  else { await set(likeRef,{uid, nom:monNom, timestamp:Date.now()}); }
};
window.toggleFav=async (postId)=>{
  const favRef=ref(db,'jasonbook/favoris/'+uid+'/'+postId);
  const snap=await get(favRef);
  if(snap.exists()){ await remove(favRef); }
  else { await set(favRef,{postId, timestamp:Date.now()}); }
};
window.toggleComs=(postId)=>{ document.getElementById('coms-'+postId).classList.toggle('open'); };
window.envoyerCom=async (postId)=>{
  const inp=document.getElementById('input-'+postId);
  const texte=inp.value.trim(); if(!texte) return;
  const n=push(ref(db,'jasonbook/commentaires/'+postId));
  await set(n,{auteurUid:uid, nom:monNom, photo:maPhoto, texte, timestamp:Date.now(), date:new Date().toLocaleString()});
  inp.value="";
};
window.partager=async (postId)=>{
  const p=posts[postId]; if(!p) return;
  const texte=`${p.texte||""}`;
  if(navigator.share){ try{ await navigator.share({title:'JASONBOOK', text:texte, url:location.href}); }catch(e){} }
  else { await navigator.clipboard.writeText(texte); alert("Texte copié !"); }
  await set(ref(db,'jasonbook/posts/'+postId+'/partages'), (p.partages||0)+1);
};
window.toggleSuivre=async (cibleUid)=>{
  if(suivis.has(cibleUid)){ await remove(ref(db,'jasonbook/suivis/'+uid+'/'+cibleUid)); }
  else { await set(ref(db,'jasonbook/suivis/'+uid+'/'+cibleUid),{timestamp:Date.now()}); }
};
onValue(ref(db,'jasonbook/posts'),s=>{ posts=s.val()||{}; rendre(); });
onValue(ref(db,'jasonbook/likes'),s=>{ likes=s.val()||{}; rendre(); });
onValue(ref(db,'jasonbook/commentaires'),s=>{ commentaires=s.val()||{}; rendre(); });
onValue(ref(db,'jasonbook/favoris/'+uid),s=>{ favoris=s.val()||{}; rendre(); });
onValue(ref(db,'jasonbook/suivis/'+uid),s=>{ const d=s.val()||{}; suivis=new Set(Object.keys(d)); rendre(); });
</script>
</body>
</html>
