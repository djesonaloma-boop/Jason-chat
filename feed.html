<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Fil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{width:100%;max-width:100%;overflow-x:hidden !important;touch-action:pan-y;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh;position:relative}
header{background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06);width:100%;max-width:100%;overflow:hidden}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--blue);font-size:19px;cursor:pointer;letter-spacing:-.3px;flex-shrink:0;white-space:nowrap}
.logo span{width:32px;height:32px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;min-width:0;background:#f0f2f5;border:none;padding:11px 12px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:5px;align-items:center;flex-shrink:0}
.icons a{width:36px;height:36px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;flex-shrink:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:650px;margin:14px auto;padding:0 10px;width:100%;overflow-x:hidden}
/* STORIES - seul endroit qui peut glisser, mais SEULEMENT à l'intérieur */
.stories{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.stories::-webkit-scrollbar{display:none}
.s-card{width:110px;height:185px;flex:0 0 110px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:#ddd}
.s-card img{width:100%;height:100%;object-fit:cover}
.s-card .overlay{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
.s-card .name{position:absolute;bottom:8px;left:7px;right:7px;color:#fff;font-weight:700;font-size:12px;line-height:1.2}
.s-card .av{position:absolute;top:7px;left:7px;width:34px;height:34px;border-radius:50%;border:3px solid var(--blue);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;font-size:14px}
.s-card .av img{width:100%;height:100%;object-fit:cover}
.s-card.add{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #ccc}
.s-card.add .plus{width:42px;height:42px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.s-card.add p{font-size:12px;font-weight:700;color:#555}
/* CREER POST */
.create{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--line);width:100%}
.create .top{display:flex;gap:10px;align-items:center}
.create input{flex:1;min-width:0;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.create .btns{display:flex;gap:6px;margin-top:10px}
.create .btns button{flex:1;border:none;background:#f0f2f5;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
/* POSTS */
.post{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);width:100%;overflow:hidden}
.post .head{display:flex;gap:10px;align-items:center;width:100%}
.post .head .info{flex:1;min-width:0}.post .head small{color:var(--grey)}
.post .head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.post p{margin:10px 0;white-space:pre-wrap;font-size:15px;line-height:1.5;word-break:break-word}
.post img.pimg{width:100%;border-radius:10px;max-height:380px;object-fit:cover;margin-top:6px}
.post video{width:100%;border-radius:10px;max-height:420px;background:#000}
.post .actions{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.post .actions button{border:none;background:none;font-weight:700;color:var(--grey);cursor:pointer;padding:8px;font-size:13.5px}
.post .actions button.liked{color:var(--blue)}
.empty{text-align:center;color:var(--grey);padding:30px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:42px}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30;width:100%;max-width:100%}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="stories" id="storiesRow"></div>

<div class="create">
<div class="top"><div class="avatar" id="myAvatar2">?</div><input placeholder="Quoi de neuf, Jason ?" onclick="location.href='creer-post.html'" readonly></div>
<div class="btns"><button onclick="location.href='creer-post.html'">🖼️ Photo</button><button onclick="location.href='creer-post.html'">🎥 Vidéo</button><button onclick="location.href='creer-post.html'">✍️ Publier</button></div>
</div>

<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">📝</div><h3>Aucune publication pour le moment</h3><p>Sois le premier à publier sur JASONBOOK</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="videos.html">🎥</a><a href="profil.html">👤</a></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"Jason";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const avHtml = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
document.getElementById('myAvatar').innerHTML = avHtml;
document.getElementById('myAvatar2').innerHTML = avHtml;
let mesLikes=new Set();
let tousPosts=[];
function rendrePosts(){
  const box=document.getElementById('list'); box.innerHTML="";
  if(!tousPosts.length){ document.getElementById('emptyBox').style.display='block'; return; }
  document.getElementById('emptyBox').style.display='none';
  tousPosts.forEach(p=>{
    const liked=mesLikes.has(p.id);
    const div=document.createElement('div'); div.className='post';
    div.innerHTML=`
      <div class="head"><div class="avatar" onclick="location.href='profil-ami.html?uid=${p.auteurUid}'">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.nomAuteur||"?").charAt(0)}</div><div class="info"><b>${p.nomAuteur||""}</b><br><small>${p.date||""}</small></div>${p.auteurUid===uid?`<button style="border:none;background:none;font-size:18px;cursor:pointer" onclick="supprimerPost('${p.id}')">🗑️</button>`:""}</div>
      <p>${p.texte||""}</p>
      ${p.photoUrl?`<img class="pimg" src="${p.photoUrl}">`:""}
      ${p.image?`<img class="pimg" src="${p.image}">`:""}
      ${p.videoUrl?`<video controls preload="metadata" src="${p.videoUrl}"></video>`:""}
      <div class="actions"><button class="${liked?'liked':''}" onclick="liker('${p.id}',${p.likesCount||0})">👍 ${p.likesCount||0} J'aime</button><button onclick="location.href='feed.html'">💬 ${p.commentairesCount||0}</button><button>↗️ ${p.partagesCount||0}</button></div>`;
    box.appendChild(div);
  });
}
window.liker=async(id,actuel)=>{ if(mesLikes.has(id)){ await remove(ref(db,'jasonbook/likes/'+uid+'/'+id)); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'),Math.max(0,actuel-1)); } else { await set(ref(db,'jasonbook/likes/'+uid+'/'+id),true); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'),actuel+1); } };
window.supprimerPost=async(id)=>{ if(!confirm("Supprimer ?")) return; await remove(ref(db,'jasonbook/posts/'+id)); };
onValue(ref(db,'jasonbook/likes/'+uid),s=>{ const d=s.val(); mesLikes=new Set(d?Object.keys(d):[]); rendrePosts(); });
onValue(ref(db,'jasonbook/posts'),s=>{ const d=s.val(); tousPosts=d?Object.entries(d).map(([id,p])=>({id,...p})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendrePosts(); });
onValue(ref(db,'jasonbook/stories'),s=>{
  const d=s.val(); const now=Date.now(); const row=document.getElementById('storiesRow'); row.innerHTML="";
  const add=document.createElement('div'); add.className='s-card add'; add.onclick=()=>location.href='stories.html'; add.innerHTML=`<div class="plus">+</div><p>Créer une story</p>`; row.appendChild(add);
  if(!d) return;
  const parAuteur={};
  Object.values(d).filter(x=>(x.expire||0)>now).forEach(x=>{ if(!parAuteur[x.auteurUid]) parAuteur[x.auteurUid]=[]; parAuteur[x.auteurUid].push(x); });
  Object.values(parAuteur).forEach(g=>{ const st=g[0]; const div=document.createElement('div'); div.className='s-card'; div.onclick=()=>location.href='stories.html'; div.innerHTML=`<img src="${st.media}"><div class="overlay"></div><div class="av">${st.photoAuteur?`<img src="${st.photoAuteur}">`:(st.auteurNom||"?").charAt(0)}</div><div class="name">${st.auteurNom||""}</div>`; row.appendChild(div); });
});
</script>
</body>
</html>
