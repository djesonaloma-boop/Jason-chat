<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK ✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0A0A0F;color:#fff;padding-bottom:92px;overflow-x:hidden}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--or2:#FF9800;--carte:#16161F;--ligne:#26262F;--gris:#A1A1AA}
/* ===== NOUVEAU HEADER - PAS FACEBOOK ===== */
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);padding:10px 14px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:900;letter-spacing:-.5px;white-space:nowrap}
.logo i{color:var(--or);font-style:normal}
.logo small{display:block;font-size:8px;color:var(--gris);letter-spacing:1.5px}
.search{flex:1;background:#1F1F2E;border:1px solid var(--ligne);border-radius:999px;padding:9px 14px;display:flex;gap:6px;align-items:center;color:var(--gris);font-size:13px;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0;cursor:pointer;border:2px solid #fff}
.avatar img{width:100%;height:100%;object-fit:cover}
/* ===== TABS POUR TOI / SUIVIS - COMME TIKTOK, PAS FACEBOOK ===== */
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;border:1px solid var(--ligne);background:var(--carte);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.active{background:linear-gradient(135deg,var(--or),var(--or2));color:#000;border-color:transparent}
/* ===== STORIES CERCLES - STYLE INSTA / TIKTOK ===== */
.stories{display:flex;gap:12px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;width:72px;text-align:center;cursor:pointer}
.story .c{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--or),var(--violet),#FF2D55);margin:0 auto}
.story .c div{width:100%;height:100%;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;border:3px solid #0A0A0F}
.story .c img{width:100%;height:100%;object-fit:cover}
.story b{font-size:11px;display:block;margin-top:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== POST - STYLE TIKTOK, PAS FACEBOOK ===== */
.wrap{max-width:620px;margin:0 auto;padding:0 12px}
.post{background:var(--carte);border-radius:24px;overflow:hidden;margin-bottom:16px;border:1px solid var(--ligne);position:relative}
.post-head{display:flex;gap:10px;align-items:center;padding:12px}
.post-head .info{flex:1;min-width:0}
.post-head b{font-size:15px}
.post-head small{color:var(--gris);font-size:12px}
.post-head .follow{border:1px solid var(--or);background:none;color:var(--or);padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.post p.txt{padding:0 14px 12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.post .media{position:relative;background:#000}
.post .media img,.post .media video{width:100%;display:block;max-height:520px;object-fit:cover}
/* ACTIONS A DROITE - COMME TIKTOK, PAS EN BAS COMME FACEBOOK */
.side-actions{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:5}
.side-actions button{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.side-actions button.liked{background:linear-gradient(135deg,var(--or),var(--or2));color:#000;border-color:transparent}
.side-actions small{font-size:11px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-top:-6px}
/* COMMENTAIRES */
.comments{border-top:1px solid var(--ligne);padding:12px;display:none}
.comments.open{display:block}
.comment{display:flex;gap:8px;margin-bottom:8px}
.comment .avatar{width:32px;height:32px;font-size:13px}
.comment .bubble{background:#2A2A35;padding:8px 12px;border-radius:14px;flex:1}
.comment .bubble b{font-size:13px}
.comment .bubble span{font-size:13px;display:block;margin-top:2px}
.comment .bubble small{font-size:11px;color:var(--gris)}
.comment-input{display:flex;gap:8px;margin-top:8px}
.comment-input input{flex:1;background:#2A2A35;border:none;padding:10px 14px;border-radius:999px;color:#fff;outline:none}
.comment-input button{background:linear-gradient(135deg,var(--violet),var(--violet2));border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer}
/* BOUTON CREER */
.create-card{background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(255,193,7,.14));border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:14px;margin:6px 0 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.create-card .txt{flex:1}
.create-card b{font-size:15px}
.create-card small{color:var(--gris);font-size:12px}
.create-card .plus{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
/* BOTTOM NAV JASONBOOK */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,10,15,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ligne)}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px;font-weight:700}
.bottom button.active{color:var(--or)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F;box-shadow:0 8px 20px rgba(124,58,237,.5)}
.loading{text-align:center;color:var(--or);padding:20px;font-weight:700}
.empty{text-align:center;color:var(--gris);padding:30px;background:var(--carte);border-radius:20px;border:1px solid var(--ligne)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.open{display:flex}
.modal-box{background:#17171F;width:100%;max-width:420px;border-radius:18px;padding:20px;border:1px solid var(--ligne)}
.modal-box textarea{width:100%;background:#2A2A35;border:1px solid var(--ligne);border-radius:12px;color:#fff;padding:12px;min-height:80px;outline:none}
.modal-box button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<!-- NOUVEAU HEADER -->
<div class="top">
<div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
<div class="search" onclick="location.href='recherche.html'">🔍 <span>Chercher...</span></div>
<div class="avatar" id="myAvatarTop" onclick="location.href='profil.html'">?</div>
</div>

<!-- TABS TIKTOK -->
<div class="tabs">
<button class="active">✨ Pour Toi</button>
<button onclick="location.href='amis.html'">👥 Amis</button>
<button onclick="location.href='videos.html'">🎥 Vidéos</button>
<button onclick="location.href='notifications.html'">🔔 Notifs <span id="badgeNotifTop"></span></button>
</div>

<div class="wrap">
<!-- STORIES CERCLES -->
<div class="stories" id="storiesRow"></div>

<!-- CREER -->
<div class="create-card" onclick="location.href='creer-post.html'">
<div class="avatar" id="myAvatar2">?</div>
<div class="txt"><b>Quoi de neuf, Jason ?</b><br><small>Photo • Vidéo • Texte • Cours • Dessin</small></div>
<div class="plus">+</div>
</div>

<div class="loading" id="loading">⏳ Chargement...</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div style="font-size:42px">📝</div><h3>Aucune publication</h3><p>Sois le premier à publier<br><br><button onclick="location.href='creer-post.html'" style="background:linear-gradient(135deg,#7C3AED,#FFC107);border:none;padding:12px 20px;border-radius:999px;color:#fff;font-weight:800;cursor:pointer">➕ Créer le 1er post</button></p></div>
</div>

<!-- BOTTOM NAV - PAS FACEBOOK -->
<div class="bottom">
<button class="active" onclick="location.href='feed.html'"><span>🏠</span>Accueil</button>
<button onclick="location.href='amis.html'"><span>👥</span>Amis</button>
<button onclick="location.href='creer-post.html'"><span class="centre">+</span></button>
<button onclick="location.href='videos.html'"><span>🎥</span>Vidéos</button>
<button onclick="location.href='profil.html'"><span>👤</span>Moi</button>
</div>

<div class="modal" id="modalPartage"><div class="modal-box">
<h3>↗️ Partager ce post</h3>
<p id="partagePreview" style="color:#A1A1AA;font-size:13px;margin-bottom:8px"></p>
<textarea id="partageTexte" placeholder="Ajoute un mot (optionnel)..."></textarea>
<button style="background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff" onclick="confirmerPartage()">Partager sur mon fil</button>
<button style="background:#2A2A35;color:#fff" onclick="fermerPartage()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"Jason";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const avHtml = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
['myAvatarTop','myAvatar2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=avHtml; });
let mesLikes=new Set(); let tousPosts=[]; let postAPartager=null; let commentairesParPost={};
function rendrePosts(){
  const box=document.getElementById('list'); if(!box) return; box.innerHTML="";
  const load=document.getElementById('loading'); if(load) load.style.display='none';
  if(!tousPosts.length){ document.getElementById('emptyBox').style.display='block'; return; }
  document.getElementById('emptyBox').style.display='none';
  tousPosts.forEach(p=>{
    const liked=mesLikes.has(p.id);
    const coms = commentairesParPost[p.id] || [];
    const div=document.createElement('div'); div.className='post';
    let comsHtml = coms.map(c=>`<div class="comment"><div class="avatar">${c.photoAuteur?`<img src="${c.photoAuteur}">`:(c.nomAuteur||"?").charAt(0)}</div><div class="bubble"><b>${c.nomAuteur||""}</b><span>${c.texte||""}</span><small>${c.date||""}</small></div></div>`).join('');
    if(!coms.length) comsHtml = `<p style="color:#A1A1AA;font-size:13px;text-align:center">Aucun commentaire. Sois le premier !</p>`;
    let mediaHtml = "";
    if(p.photoUrl || p.image || p.videoUrl){
      mediaHtml = `<div class="media">${p.photoUrl?`<img src="${p.photoUrl}">`:""}${p.image?`<img src="${p.image}">`:""}${p.videoUrl?`<video controls preload="metadata" src="${p.videoUrl}"></video>`:""}
      <div class="side-actions">
        <button class="${liked?'liked':''}" onclick="liker('${p.id}',${p.likesCount||0})">${liked?'❤️':'🤍'}</button><small>${p.likesCount||0}</small>
        <button onclick="toggleCommentaires('${p.id}')">💬</button><small>${p.commentairesCount||0}</small>
        <button onclick="ouvrirPartage('${p.id}')">↗️</button><small>${p.partagesCount||0}</small>
      </div></div>`;
    }
    div.innerHTML=`<div class="post-head"><div class="avatar" onclick="location.href='profil-ami.html?uid=${p.auteurUid}'">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.nomAuteur||"?").charAt(0)}</div><div class="info"><b>${p.nomAuteur||""}</b><br><small>${p.date||""} ${p.partageDe?`• Partagé de ${p.partageDeNom||""}`:""}</small></div>${p.auteurUid===uid?`<button style="border:none;background:none;font-size:18px;cursor:pointer;color:#fff" onclick="supprimerPost('${p.id}')">🗑️</button>`:`<button class="follow">Suivre</button>`}</div><p class="txt">${p.texte||""}</p>${mediaHtml}${!p.photoUrl && !p.image && !p.videoUrl ? `<div style="display:flex;gap:10px;padding:0 14px 12px"><button onclick="liker('${p.id}',${p.likesCount||0})" style="flex:1;background:#2A2A35;border:none;color:#fff;padding:10px;border-radius:999px;font-weight:700">${liked?'❤️':'🤍'} ${p.likesCount||0}</button><button onclick="toggleCommentaires('${p.id}')" style="flex:1;background:#2A2A35;border:none;color:#fff;padding:10px;border-radius:999px;font-weight:700">💬 ${p.commentairesCount||0}</button><button onclick="ouvrirPartage('${p.id}')" style="flex:1;background:#2A2A35;border:none;color:#fff;padding:10px;border-radius:999px;font-weight:700">↗️ ${p.partagesCount||0}</button></div>`:""}<div class="comments" id="com-${p.id}"><div>${comsHtml}</div><div class="comment-input"><input id="inputCom-${p.id}" placeholder="Écris un commentaire..." onkeydown="if(event.key==='Enter') envoyerCommentaire('${p.id}')"><button onclick="envoyerCommentaire('${p.id}')">➤</button></div></div>`;
    box.appendChild(div);
  });
}
window.toggleCommentaires=(id)=>{ const el=document.getElementById('com-'+id); if(el) el.classList.toggle('open'); };
window.liker=async(id,actuel)=>{ try{ if(mesLikes.has(id)){ await remove(ref(db,'jasonbook/likes/'+uid+'/'+id)); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'),Math.max(0,actuel-1)); } else { await set(ref(db,'jasonbook/likes/'+uid+'/'+id),true); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'),actuel+1); const p=tousPosts.find(x=>x.id===id); if(p && p.auteurUid!==uid){ const nRef=push(ref(db,'jasonbook/notifications/'+p.auteurUid)); await set(nRef,{type:"like",texte:monNom+" a aimé ta publication",deUid:uid,deNom:monNom,date:new Date().toLocaleString(),lu:false}); } } }catch(e){} };
window.envoyerCommentaire=async(id)=>{
  const inp=document.getElementById('inputCom-'+id); if(!inp) return; const txt=inp.value.trim(); if(!txt) return;
  const p=tousPosts.find(x=>x.id===id);
  const newRef=push(ref(db,'jasonbook/commentaires/'+id));
  await set(newRef,{ auteurUid:uid, nomAuteur:monNom, photoAuteur:maPhoto||"", texte:txt, date:new Date().toLocaleString(), timestamp:Date.now() });
  await set(ref(db,'jasonbook/posts/'+id+'/commentairesCount'), (p?.commentairesCount||0)+1);
  inp.value="";
  if(p && p.auteurUid!==uid){ const nRef=push(ref(db,'jasonbook/notifications/'+p.auteurUid)); await set(nRef,{type:"commentaire",texte:monNom+" a commenté ta publication : "+txt,deUid:uid,deNom:monNom,date:new Date().toLocaleString(),lu:false}); }
};
window.ouvrirPartage=(id)=>{ postAPartager=tousPosts.find(x=>x.id===id); if(!postAPartager) return; document.getElementById('partagePreview').innerText = "Post de "+(postAPartager.nomAuteur||"")+" : "+(postAPartager.texte||"").slice(0,80); document.getElementById('partageTexte').value=""; document.getElementById('modalPartage').classList.add('open'); };
window.fermerPartage=()=>{ document.getElementById('modalPartage').classList.remove('open'); postAPartager=null; };
window.confirmerPartage=async()=>{
  if(!postAPartager) return;
  const monTexte=document.getElementById('partageTexte').value.trim();
  const newRef=push(ref(db,'jasonbook/posts'));
  await set(newRef,{ auteurUid:uid, nomAuteur:monNom, photoAuteur:maPhoto||"", texte: monTexte ? monTexte+"\n\n--- Partagé ---\n"+(postAPartager.texte||"") : (postAPartager.texte||""), photoUrl:postAPartager.photoUrl||postAPartager.image||"", videoUrl:postAPartager.videoUrl||"", date:new Date().toLocaleString(), timestamp:Date.now(), likesCount:0, commentairesCount:0, partagesCount:0, partageDe:postAPartager.id, partageDeNom:postAPartager.nomAuteur||"" });
  await set(ref(db,'jasonbook/posts/'+postAPartager.id+'/partagesCount'), (postAPartager.partagesCount||0)+1);
  if(postAPartager.auteurUid!==uid){ const nRef=push(ref(db,'jasonbook/notifications/'+postAPartager.auteurUid)); await set(nRef,{type:"partage",texte:monNom+" a partagé ta publication",deUid:uid,deNom:monNom,date:new Date().toLocaleString(),lu:false}); }
  fermerPartage(); alert("Partagé ! 🎉");
};
window.supprimerPost=async(id)=>{ if(!confirm("Supprimer ?")) return; await remove(ref(db,'jasonbook/posts/'+id)); };
if(uid){
  onValue(ref(db,'jasonbook/likes/'+uid),s=>{ const d=s.val(); mesLikes=new Set(d?Object.keys(d):[]); rendrePosts(); });
  onValue(ref(db,'jasonbook/posts'),s=>{ const d=s.val(); tousPosts=d?Object.entries(d).map(([id,p])=>({id,...p})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendrePosts(); });
  onValue(ref(db,'jasonbook/commentaires'),s=>{
    const d=s.val(); commentairesParPost={};
    if(d) Object.entries(d).forEach(([postId, coms])=>{ commentairesParPost[postId]=Object.values(coms).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)); });
    rendrePosts();
  });
  onValue(ref(db,'jasonbook/notifications/'+uid),s=>{ const d=s.val(); let n=0; if(d) Object.values(d).forEach(x=>{ if(!x.lu) n++; }); const el=document.getElementById('badgeNotifTop'); if(el) el.innerText = n?`(${n})`:""; });
}
onValue(ref(db,'jasonbook/stories'),s=>{
  const d=s.val(); const now=Date.now(); const row=document.getElementById('storiesRow'); if(!row) return; row.innerHTML="";
  const add=document.createElement('div'); add.className='story'; add.onclick=()=>location.href='stories.html'; add.innerHTML=`<div class="c"><div>+</div></div><b>Toi</b>`; row.appendChild(add);
  if(!d) return;
  const parAuteur={};
  Object.values(d).filter(x=>(x.expire||0)>now).forEach(x=>{ if(!parAuteur[x.auteurUid]) parAuteur[x.auteurUid]=[]; parAuteur[x.auteurUid].push(x); });
  Object.values(parAuteur).forEach(g=>{ const st=g[0]; const div=document.createElement('div'); div.className='story'; div.onclick=()=>location.href='stories.html'; div.innerHTML=`<div class="c"><div>${st.photoAuteur?`<img src="${st.photoAuteur}">`:(st.auteurNom||"?").charAt(0)}</div></div><b>${st.auteurNom||""}</b>`; row.appendChild(div); });
});
</script>
</body>
</html>
