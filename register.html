
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a14">
<title>Inscription — JASON BUSINESS</title>
<style>
:root{--bg:#050a14;--card:#0c1525;--blue:#00d4ff;--gold:#d8aa45;--text:#f5f7fb;--muted:#9aa8bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#102644,var(--bg) 65%);font-family:Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid #26364b;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0008}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#1763a8);display:grid;place-items:center;color:#06111e;font-weight:900;font-size:24px;margin-bottom:15px}
h1{font-size:25px;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;font-size:14px}
input{width:100%;padding:14px;margin:7px 0;background:#07101e;border:1px solid #2b3a50;border-radius:11px;color:white;font-size:15px;outline:none}
input:focus{border-color:var(--blue)}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:11px;background:linear-gradient(90deg,var(--blue),#58a9ff);color:#06111e;font-weight:800;font-size:15px}
label{font-size:13px;color:#d9e2ef;display:flex;gap:9px;align-items:flex-start;margin-top:15px}
label input{width:auto;margin:2px 0}
a{color:var(--gold)}
#message{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
<div class="logo">JB</div>
<h1>Créer un compte</h1>
<p>JASON BUSINESS — Web • Design • Digital • Intelligence artificielle</p>
<form id="registerForm">
<input id="name" placeholder="Nom complet" autocomplete="name" required maxlength="100">
<input id="phone" type="tel" placeholder="Numéro de téléphone" autocomplete="tel" required maxlength="25">
<input id="email" type="email" placeholder="Adresse Gmail" autocomplete="email" required>
<input id="password" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="new-password" minlength="6" required>
<input id="confirmPassword" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password" minlength="6" required>
<input id="referral" placeholder="Code de parrainage (facultatif)" maxlength="50">
<label>
<input id="terms" type="checkbox" required>
<span>J’accepte les conditions d’utilisation et confirme l’exactitude des informations fournies.</span>
</label>
<button id="registerBtn" type="submit">Créer mon compte</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<p>Tu as déjà un compte ? <a href="login.html">Se connecter</a></p>
<p>🔒 Ne partage jamais ton mot de passe.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const btn = document.getElementById("registerBtn");

function showMessage(text, ok=false) {
  message.textContent = text;
  message.style.color = ok ? "#4ade80" : "#ff8d8d";
}

function friendlyError(error) {
  const errors = {
    "auth/email-already-in-use": "Cette adresse possède déjà un compte.",
    "auth/invalid-email": "Adresse Gmail invalide.",
    "auth/weak-password": "Choisis un mot de passe plus robuste.",
    "auth/network-request-failed": "Connexion Internet indisponible.",
    "auth/operation-not-allowed": "Active Email/Password dans Firebase Authentication.",
    "auth/too-many-requests": "Trop de tentatives. Réessaie plus tard.",
    "PERMISSION_DENIED": "Firebase Database refuse l'enregistrement. Vérifie les règles."
  };
  return errors[error.code] || error.message || "Une erreur est survenue.";
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const confirmation = document.getElementById("confirmPassword").value;
  const referral = document.getElementById("referral").value.trim();

  if (!name || !phone || !email) {
    return showMessage("Remplis tous les champs obligatoires.");
  }
  if (password !== confirmation) {
    return showMessage("Les deux mots de passe ne correspondent pas.");
  }
  if (password.length < 6) {
    return showMessage("Le mot de passe doit contenir au moins 6 caractères.");
  }
  if (!document.getElementById("terms").checked) {
    return showMessage("Accepte les conditions pour continuer.");
  }

  btn.disabled = true;
  btn.textContent = "Création du compte...";
  showMessage("");

  let credential = null;

  try {
    credential = await auth.createUserWithEmailAndPassword(email, password);
    const user = credential.user;

    await user.updateProfile({ displayName: name });

    const profile = {
      name: name,
      phone: phone,
      referral: referral,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    };

    const updates = {};
    for (const [key, value] of Object.entries(profile)) {
      updates["users/" + user.uid + "/" + key] = value;
    }
    await db.ref().update(updates);

    showMessage("Compte créé avec succès ! Ouverture de ton espace...", true);
    location.replace("dashboard.html");

  } catch (error) {
    if (credential && credential.user) {
      showMessage(
        "Le compte d'authentification existe, mais le profil n'a pas pu être enregistré. " +
        "Vérifie les règles Firebase, puis reconnecte-toi. Détail : " + friendlyError(error)
      );
    } else {
      showMessage(friendlyError(error));
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "Créer mon compte";
  }
});
</script>
</body>
</html>
