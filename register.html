<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JASON FACE - Inscription</title>
<style>
:root{--bg:#050914;--card:#0f1c32;--border:rgba(255,255,255,.09);--text:#eef3ff;--muted:#8da2bc;--blue:#1877f2;--green:#23c55e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at top,rgba(0,140,255,.15),transparent 55%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#101d35,#0c152a);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 80px #0006}
.logo{font-weight:900;font-size:24px;text-align:center;margin-bottom:6px}.logo b{color:var(--blue)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.input{width:100%;background:#13203c;border:1px solid var(--border);border-radius:12px;padding:13px;color:white;outline:none;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}
.btn-blue{background:var(--blue);color:white}.btn-dark{background:#1b2947;color:white}
.error{color:#ff6b6b;font-size:12px;min-height:18px;text-align:center;margin:8px 0}
</style>
</head>
<body>
<div class="card">
 <div class="logo">JASON <b>FACE</b></div>
 <div class="sub">Crée ton compte Biso — rapide et gratuit</div>
 <div class="row"><input id="nom" class="input" placeholder="Nom complet"><input id="prenom" class="input" placeholder="Prénom"></div>
 <input id="phone" class="input" type="tel" placeholder="Numéro WhatsApp (082...)">
 <input id="password" class="input" type="password" placeholder="Mot de passe (min 6)">
 <input id="confirm" class="input" type="password" placeholder="Confirmer mot de passe">
 <div id="error" class="error"></div>
 <button class="btn btn-blue" id="regBtn">S'inscrire</button>
 <div style="height:12px"></div>
 <button class="btn btn-dark" onclick="location.href='/login.html'">Déjà un compte? Se connecter</button>
 <div style="margin-top:14px;font-size:11px;color:var(--muted);text-align:center">En créant ton compte, ton profil sera créé dans Firebase : jasonBusiness/users/{ton numéro} avec solde 0 FC</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

$("regBtn").onclick=async()=>{
  const nom=$("nom").value.trim(); const prenom=$("prenom").value.trim(); const phone=$("phone").value.trim();
  const pass=$("password").value.trim(); const conf=$("confirm").value.trim(); const err=$("error");
  if(!nom||!phone||!pass){ err.textContent="Remplis tout"; return; }
  if(pass.length<6){ err.textContent="Mot de passe min 6 caractères"; return; }
  if(pass!==conf){ err.textContent="Mots de passe différents"; return; }
  err.textContent="Vérification...";
  try{
    const exists=await get(ref(db, `jasonBusiness/users/${phone}`));
    if(exists.exists()){ err.textContent="❌ Ce numéro existe déjà - Connecte-toi"; return; }
    err.textContent="Création...";
    await set(ref(db, `jasonBusiness/users/${phone}`), {
      nom: nom+" "+prenom, name: nom+" "+prenom, telephone: phone, phone: phone,
      mot_de_passe: pass, password: pass,
      solde_principal: 0, solde:0, balance:0,
      vip:false, vipLevel:"Aucun", vipStatus:"Inactif",
      createdAt: Date.now(), date: new Date().toLocaleString("fr-FR"),
      source:"jasonFace"
    });
    localStorage.setItem("jasonBusinessUserPhone", phone);
    localStorage.setItem("userPhone", phone);
    localStorage.setItem("jasonBusinessUserName", nom+" "+prenom);
    err.textContent="✅ Compte créé";
    location.href="/";
  }catch(e){ err.textContent="Erreur: "+e.message; }
};
</script>
</body>
</html>
