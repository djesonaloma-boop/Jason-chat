<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Bloqués</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
/* ✅ MÊME SCROLL QUE LE PROFIL */
html{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw}
body{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
img,video{max-width:100%}
/* ✅ MÊMES COULEURS QUE LE PROFIL */
:root{--blue:#7C3AED;--blue2:#A855F7;--or:#FFC107;--bg:#0F0F14;--card:#1C1C24;--grey:#A1A1AA;--line:#2A2A35}
body{background:var(--bg);color:#fff;min-height:100vh}
header{background:#111;display:flex;align-items:center;gap:12px;padding:12px 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--or)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#fff;font-size:21px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo span{width:34px;height:34px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:var(--or);font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--or));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:650px;margin:16px auto;padding:0 12px 30px}
.wrap h1{font-size:23px;letter-spacing:-.3px;color:#fff}
.wrap .sub{color:var(--grey);margin:4px 0 14px;font-size:14px;line-height:1.5}
.search-box{width:100%;padding:12px 16px;border:none;border-radius:999px;outline:none;font-size:14px;margin-bottom:14px;background:#2A2A35;color:#fff}
.search-box::placeholder{color:#888}
.search-box:focus{box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.b-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.b-card .info{flex:1;min-width:0}.b-card .info b{color:#fff}.b-card .info small{color:var(--grey);font-size:12.5px}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-grey{background:#2A2A35;color:#fff;border:none;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}.empty h3{color:#fff}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>

<!-- ✅ HEADER : JUSTE JASONBOOK, PLUS DE 🔍 🔔 💬 👤 -->
<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
</header>

<div class="wrap">
<h1>Personnes bloquées</h1>
<p class="sub">Les personnes bloquées ne peuvent pas voir ton profil, tes posts, ni t'envoyer de messages.</p>
<input class="search-box" id="searchInput" placeholder="🔍 Rechercher parmi les bloqués..." oninput="rendre()">
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">✅</div><h3>Aucune personne bloquée</h3><p>Tu n'as bloqué personne pour le moment. C'est bien ! 😊</p></div>
</div>

<!-- ✅ PLUS DE BARRE EN BAS : SUPPRIMÉ 🏠 👥 ➕ 🚫 👤 -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const myAv=document.getElementById('myAvatar');
if(myAv) myAv.innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let bloques=[], usersMap={};
async function chargerInfos(){
  const snap=await get(ref(db,'jasonbook/users'));
  usersMap=snap.val()||{}; rendre();
}
function rendre(){
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=bloques.filter(b=>{
    const u=usersMap[b.uidBloque]||{}; const nom=(u.nom||b.nom||"").toLowerCase();
    return nom.includes(q);
  });
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(b=>{
    const u=usersMap[b.uidBloque]||{};
    const nom=u.nom||b.nom||"Utilisateur";
    const photo=u.photo||b.photo||"";
    const div=document.createElement('div'); div.className='b-card';
    div.innerHTML=`
      <div class="avatar" style="width:48px;height:48px">${photo?`<img src="${photo}">`:nom.charAt(0).toUpperCase()}</div>
      <div class="info"><b>${nom}</b><br><small>Bloqué(e) le ${b.date||""}</small></div>
      <button class="btn-blue" onclick="debloquer('${b.uidBloque}','${nom}')">Débloquer</button>`;
    box.appendChild(div);
  });
}
window.debloquer=async (uidBloque, nom)=>{
  if(!confirm("Débloquer "+nom+" ? Il/elle pourra à nouveau voir ton profil et t'écrire.")) return;
  await remove(ref(db,'jasonbook/bloques/'+uid+'/'+uidBloque));
  alert(nom+" débloqué(e) ✅");
};
onValue(ref(db,'jasonbook/bloques/'+uid), s=>{
  const d=s.val();
  bloques=d?Object.entries(d).map(([uidBloque,v])=>({uidBloque,...v})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[];
  chargerInfos();
});
</script>
</body>
</html>
