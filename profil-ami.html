<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Profil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;max-width:100%}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;overflow-x:hidden!important;width:100%;max-width:100vw}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--nuit:#0F0F14;--carte:#1C1C24;--gris:#A1A1AA;--ligne:#2A2A35}
body{background:var(--nuit);color:#fff;min-height:100vh;overflow-x:hidden}
/* HEADER SIMPLE - JUSTE LE LOGO AU CENTRE */
header{background:#111;display:flex;align-items:center;justify-content:center;padding:12px;border-bottom:2px solid var(--or);width:100%}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#fff;font-size:22px;cursor:pointer;white-space:nowrap}
.logo span{width:36px;height:36px;min-width:36px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo i{color:var(--or);font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
/* ✅ COVER + PROFIL CENTRÉ COMME TA PHOTO */
.cover-wrap{background:var(--carte);max-width:1000px;width:calc(100% - 24px);margin:12px auto 0;padding-bottom:18px;border-radius:16px;border:1px solid var(--ligne);overflow:hidden;text-align:center}
.cover{height:200px;background:linear-gradient(135deg,var(--violet),var(--violet2),var(--or));overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;cursor:pointer;position:relative;padding:0 12px;text-align:center}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .hint{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);padding:5px 10px;border-radius:999px;font-size:11px}
/* ✅ TOUT AU CENTRE */
.profile-row{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;margin-top:-60px;width:100%}
.big-avatar{width:130px;height:130px;min-width:130px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));color:#fff;border:5px solid #111;display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:900;overflow:hidden;flex-shrink:0;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{width:100%;word-break:break-word;margin-top:10px;text-align:center}
.profile-info h1{font-size:28px;color:#fff;word-break:break-word;line-height:1.2;text-align:center}
.profile-info p{color:var(--gris);font-size:14px;margin-top:6px;word-break:break-word;line-height:1.4;text-align:center}
.profile-btns{display:flex;gap:10px;justify-content:center;align-items:center;width:100%;margin-top:14px;flex-wrap:wrap}
.profile-btns button{padding:12px 22px;border:none;border-radius:999px;font-weight:800;cursor:pointer;font-size:14px;white-space:nowrap;min-width:130px}
.btn-blue{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff}.btn-grey{background:#2A2A35;color:#fff}.btn-green{background:#22C55E;color:#fff}
.layout{display:flex;gap:15px;max-width:1000px;width:100%;margin:14px auto;padding:0 12px;align-items:flex-start;overflow:hidden}
.left{width:340px;flex-shrink:0}
.right{flex:1;min-width:0}
.card{background:var(--carte);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--ligne);width:100%;overflow:hidden}
.card h3{margin-bottom:10px;color:#fff}
.info-row{display:flex;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--ligne);color:#EDEDEF;word-break:break-word}
.post-head{display:flex;gap:10px;align-items:center}
.post-text{margin:10px 0;font-size:15px;white-space:pre-wrap;line-height:1.5;color:#fff;word-break:break-word}
.post img.main{width:100%;border-radius:10px;max-height:500px;object-fit:cover;cursor:pointer}
.actions{display:flex;justify-content:space-around;border-top:1px solid var(--ligne);padding-top:8px;margin-top:8px}
.actions button{border:none;background:none;font-weight:700;color:var(--gris);cursor:pointer;padding:7px;font-size:13px;flex:1}
.actions button.actif{color:var(--or)}
.comment-box{display:none;margin-top:10px;gap:8px}
.comment-box.show{display:flex}
.comment-box input{flex:1;min-width:0;background:#2A2A35;border:none;padding:10px 12px;border-radius:999px;color:#fff;outline:none;font-size:13px}
.comment-box button{background:var(--violet);border:none;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}
.comment-item{display:flex;gap:8px;margin-top:8px;font-size:13px;align-items:flex-start}
.comment-item b{color:#fff}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:12px}
.viewer-top b{color:#fff}
.viewer-top button{background:#2A2A35;border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.viewer-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 12px}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.viewer-actions{display:flex;justify-content:space-around;padding:14px;border-top:1px solid #333;background:#111}
.viewer-actions button{border:none;background:none;color:#fff;font-weight:800;font-size:14px;cursor:pointer;padding:10px}
.viewer-actions button.actif{color:var(--or)}
.viewer-comments{max-height:180px;overflow-y:auto;padding:0 14px 10px;background:#111}
.viewer-comment-box{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #333}
.viewer-comment-box input{flex:1;min-width:0;background:#2A2A35;border:none;padding:12px;border-radius:999px;color:#fff;outline:none}
.viewer-comment-box button{background:var(--violet);border:none;color:#fff;padding:12px 16px;border-radius:999px;font-weight:800}
@media(max-width:800px){
  .left{display:none}
  .cover{height:170px}
  .big-avatar{width:120px;height:120px;min-width:120px;font-size:50px}
  .profile-row{padding:0 12px;margin-top:-55px}
  .layout{flex-direction:column;padding:0 12px}
  .right{width:100%}
}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
</header>

<!-- ✅ COMME TA PHOTO : COVER, M AU MILIEU, NOM AU MILIEU, BOUTONS AU MILIEU -->
<div class="cover-wrap">
<div class="cover" id="coverDiv" onclick="ouvrirPhoto('cover')">Chargement...</div>
<div class="profile-row">
<div class="big-avatar" id="bigAvatar" onclick="ouvrirPhoto('profil')">?</div>
<div class="profile-info">
<h1 id="nomAffiche">Chargement...</h1>
<p id="bioAffiche"></p>
<p id="metaAffiche"></p>
<p id="amisCount"></p>
</div>
<div class="profile-btns">
<button class="btn-blue" id="btnAmi" onclick="actionAmi()">➕ Ajouter</button>
<button class="btn-grey" id="btnMsg" onclick="allerMessage()">💬 Message</button>
</div>
</div>
</div>

<div class="layout">
<div class="left">
<div class="card"><h3>Intro</h3><div id="introList"></div></div>
<div class="card"><h3>Photos</h3><div id="photosGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div><p id="noPhotos" style="color:#A1A1AA;font-size:13px">Aucune photo</p></div>
</div>
<div class="right">
<div class="card"><p style="font-weight:700;font-size:15px">Publications de <span id="nomPost">cette personne</span></p></div>
<div id="postsList"></div>
<div id="noPosts" class="card" style="display:none"><p style="text-align:center;color:#A1A1AA">Aucune publication pour le moment</p></div>
</div>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-top"><b id="viewerTitre">Photo de profil</b><button onclick="fermerPhoto()">✕</button></div>
  <div class="viewer-img"><img id="viewerImg" src=""></div>
  <div class="viewer-actions">
    <button id="btnViewerLike" onclick="aimerPhotoViewer()">❤️ <span id="viewerLikeCount">0</span></button>
    <button onclick="document.getElementById('viewerInput').focus()">💬 <span id="viewerComCount">0</span></button>
    <button onclick="partagerPhotoViewer()">↗️ <span id="viewerPartageCount">0</span> Partager</button>
  </div>
  <div class="viewer-comments" id="viewerComments"></div>
  <div class="viewer-comment-box"><input id="viewerInput" placeholder="Écris un commentaire..." onkeydown="if(event.key==='Enter') commenterPhotoViewer()"><button onclick="commenterPhotoViewer()">➤</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, remove, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const cibleUid = new URLSearchParams(location.search).get('uid');
if(!cibleUid) location.href='recherche.html';
if(cibleUid===uid) location.href='profil.html';
let profilCible=null, statut="inconnu", vraiUid=cibleUid, photoTypeActuel='profil', photoData={profil:{likes:{},comments:{},partages:0},cover:{likes:{},comments:{},partages:0}};
function majBouton(){
  const b=document.getElementById('btnAmi');
  if(statut==='ami'){ b.innerText="✅ Ami"; b.className="btn-green"; }
  else if(statut==='demande_envoyee'){ b.innerText="En attente..."; b.className="btn-grey"; }
  else if(statut==='demande_recue'){ b.innerText="✅ Accepter"; b.className="btn-green"; }
  else { b.innerText="➕ Ajouter"; b.className="btn-blue"; }
}
window.allerMessage=()=> location.href='messages.html?uid='+cibleUid;
window.actionAmi=async()=>{
  if(statut==='inconnu'){
    await set(ref(db,'jasonbook/demandes/'+cibleUid+'/'+uid), { deUid:uid, deNom:monNom, date:new Date().toLocaleString() });
    await set(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+cibleUid), { versUid:cibleUid, date:new Date().toLocaleString() });
    const nRef=push(ref(db,'jasonbook/notifications/'+cibleUid));
    await set(nRef,{ type:"demande", texte:monNom+" t'a envoyé une demande d'ami", deUid:uid, deNom:monNom, date:new Date().toLocaleString(), timestamp:Date.now(), lu:false });
    statut='demande_envoyee'; majBouton();
  } else if(statut==='demande_envoyee'){
    await remove(ref(db,'jasonbook/demandes/'+cibleUid+'/'+uid));
    await remove(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+cibleUid));
    statut='inconnu'; majBouton();
  } else if(statut==='demande_recue'){
    await set(ref(db,'jasonbook/amis/'+uid+'/'+cibleUid), true);
    await set(ref(db,'jasonbook/amis/'+cibleUid+'/'+uid), true);
    if(vraiUid!==cibleUid){ await set(ref(db,'jasonbook/amis/'+uid+'/'+vraiUid), true); await set(ref(db,'jasonbook/amis/'+vraiUid+'/'+uid), true); }
    await remove(ref(db,'jasonbook/demandes/'+uid+'/'+cibleUid));
    await remove(ref(db,'jasonbook/demandesEnvoyees/'+cibleUid+'/'+uid));
    statut='ami'; majBouton();
  } else if(statut==='ami'){
    if(!confirm("Retirer cet ami ?")) return;
    await remove(ref(db,'jasonbook/amis/'+uid+'/'+cibleUid));
    await remove(ref(db,'jasonbook/amis/'+cibleUid+'/'+uid));
    if(vraiUid!==cibleUid){ await remove(ref(db,'jasonbook/amis/'+uid+'/'+vraiUid)); await remove(ref(db,'jasonbook/amis/'+vraiUid+'/'+uid)); }
    statut='inconnu'; majBouton();
  }
};
function afficherProfil(u){
  profilCible=u;
  const lettre=(u.prenom||u.nomComplet||"?").charAt(0).toUpperCase();
  document.getElementById('bigAvatar').innerHTML = u.photoProfil ? `<img src="${u.photoProfil}">` : lettre;
  document.getElementById('nomAffiche').innerText=u.nomComplet||"";
  document.getElementById('nomPost').innerText=u.nomComplet||"";
  document.getElementById('bioAffiche').innerText=u.bio||"";
  document.getElementById('metaAffiche').innerText=`${u.activite||""} • ${u.ville||""} • ${u.pays||""}`;
  document.getElementById('introList').innerHTML=`
    <div class="info-row">💼 ${u.activite||"Non précisée"}</div>
    <div class="info-row">📍 ${u.ville||""} ${u.pays? "- "+u.pays:""}</div>
    <div class="info-row">📅 Membre depuis ${u.dateInscription||""}</div>`;
  document.getElementById('coverDiv').innerHTML = u.photoCouverture ? `<img src="${u.photoCouverture}"><span class="hint">👆 Appuie pour voir</span>` : (u.nomComplet||"");
  ecouterPhotoStats();
}
async function chargerProfil(){
  let snap = await get(ref(db,'jasonbook/users/'+cibleUid));
  if(snap.val()){ vraiUid=cibleUid; afficherProfil({uid:cibleUid, ...snap.val()}); chargerPosts(); return; }
  const tous = await get(ref(db,'jasonbook/users'));
  const d = tous.val()||{};
  for(const [key,u] of Object.entries(d)){
    if(key===cibleUid || u.uid===cibleUid || u.id===cibleUid){ vraiUid=key; afficherProfil({uid:key, ...u}); chargerPosts(); return; }
  }
  let nomTrouve="";
  const dem = await get(ref(db,'jasonbook/demandes/'+uid+'/'+cibleUid));
  if(dem.val() && dem.val().deNom) nomTrouve=dem.val().deNom;
  if(!nomTrouve){
    const notifs = await get(ref(db,'jasonbook/notifications/'+uid));
    if(notifs.val()){ for(const n of Object.values(notifs.val())){ if(n.deUid===cibleUid && n.deNom){ nomTrouve=n.deNom; break; } } }
  }
  if(nomTrouve){
    for(const [key,u] of Object.entries(d)){
      const nomU = (u.nomComplet||"").toLowerCase().trim();
      if(nomU && nomU===nomTrouve.toLowerCase().trim()){ vraiUid=key; afficherProfil({uid:key, ...u}); chargerPosts(); return; }
    }
  }
  vraiUid=cibleUid;
  afficherProfil({uid:cibleUid, nomComplet: nomTrouve || "Utilisateur JASONBOOK", prenom: nomTrouve ? nomTrouve.split(' ')[0] : "?", photoProfil:"", bio:"Ce compte a été créé 2 fois. Son profil est sous un autre identifiant, mais tu peux lui écrire.", activite:"", ville:"", pays:"", dateInscription:""});
  chargerPosts();
}
chargerProfil();
onValue(ref(db,'jasonbook/amis/'+uid), s=>{ const d=s.val(); if(d && (d[cibleUid] || d[vraiUid])) statut='ami'; else if(statut==='ami') statut='inconnu'; majBouton(); });
onValue(ref(db,'jasonbook/demandesEnvoyees/'+uid), s=>{ const d=s.val(); if(d && d[cibleUid] && statut!=='ami') statut='demande_envoyee'; majBouton(); });
onValue(ref(db,'jasonbook/demandes/'+uid), s=>{ const d=s.val(); if(d && d[cibleUid] && statut!=='ami') statut='demande_recue'; majBouton(); });
onValue(ref(db,'jasonbook/amis/'+cibleUid), s=>{ const d=s.val(); const n=d?Object.keys(d).length:0; if(n) document.getElementById('amisCount').innerText=n+" ami"+(n>1?"s":""); });
function photoPath(type){ return 'jasonbook/photos/'+cibleUid+'_'+type; }
function ecouterPhotoStats(){
  ['profil','cover'].forEach(type=>{
    onValue(ref(db, photoPath(type)), s=>{
      const d=s.val()||{likes:{},comments:{},partages:0};
      photoData[type]=d;
      if(photoTypeActuel===type) majViewer();
    });
  });
}
window.ouvrirPhoto=(type)=>{
  photoTypeActuel=type;
  const img = type==='profil' ? (profilCible?.photoProfil||"") : (profilCible?.photoCouverture||"");
  if(!img){ alert("Elle n'a pas encore mis de photo ici."); return; }
  document.getElementById('viewerTitre').innerText = type==='profil' ? "Photo de profil - "+(profilCible?.nomComplet||"") : "Photo de couverture - "+(profilCible?.nomComplet||"");
  document.getElementById('viewerImg').src=img;
  document.getElementById('viewer').classList.add('open');
  majViewer();
};
window.fermerPhoto=()=> document.getElementById('viewer').classList.remove('open');
function majViewer(){
  const d=photoData[photoTypeActuel]||{likes:{},comments:{},partages:0};
  const nLike=Object.keys(d.likes||{}).length;
  const nCom=Object.keys(d.comments||{}).length;
  document.getElementById('viewerLikeCount').innerText=nLike;
  document.getElementById('viewerComCount').innerText=nCom;
  document.getElementById('viewerPartageCount').innerText=d.partages||0;
  document.getElementById('btnViewerLike').classList.toggle('actif', !!(d.likes && d.likes[uid]));
  const box=document.getElementById('viewerComments'); box.innerHTML="";
  Object.values(d.comments||{}).forEach(c=>{
    const div=document.createElement('div'); div.className='comment-item';
    div.innerHTML=`<div class="avatar" style="width:28px;height:28px;font-size:12px">${(c.nom||"?").charAt(0)}</div><div><b>${c.nom||""}</b> <span style="color:#EDEDEF">${c.texte||""}</span><br><small style="color:#888">${c.date||""}</small></div>`;
    box.appendChild(div);
  });
}
window.aimerPhotoViewer=async ()=>{
  const p=photoPath(photoTypeActuel);
  const snap=await get(ref(db,p+'/likes/'+uid));
  if(snap.val()){ await remove(ref(db,p+'/likes/'+uid)); }
  else { await set(ref(db,p+'/likes/'+uid), {nom:monNom, date:new Date().toLocaleString()}); }
};
window.commenterPhotoViewer=async ()=>{
  const inp=document.getElementById('viewerInput'); const txt=inp.value.trim(); if(!txt) return;
  const r=push(ref(db, photoPath(photoTypeActuel)+'/comments'));
  await set(r, {auteurUid:uid, nom:monNom, texte:txt, date:new Date().toLocaleString()});
  inp.value="";
};
window.partagerPhotoViewer=async ()=>{
  const p=photoPath(photoTypeActuel);
  const snap=await get(ref(db,p+'/partages'));
  await set(ref(db,p+'/partages'), (snap.val()||0)+1);
  const img = photoTypeActuel==='profil' ? profilCible?.photoProfil : profilCible?.photoCouverture;
  const r=push(ref(db,'jasonbook/posts'));
  await set(r, {auteurUid:uid, nomAuteur:monNom, photoAuteur:maPhoto, texte: monNom+" a partagé la photo de "+(profilCible?.nomComplet||""), photoUrl:img, date:new Date().toLocaleString(), timestamp:Date.now(), likesCount:0, commentairesCount:0, partagesCount:0});
  alert("Partagé ✅ Ça s'affiche aussi dans son profil / feed");
  chargerPosts();
};
async function chargerPosts(){
  const box=document.getElementById('postsList'); const grid=document.getElementById('photosGrid'); box.innerHTML=""; grid.innerHTML="";
  const snap=await get(ref(db,'jasonbook/posts'));
  const data=snap.val();
  if(!data){ document.getElementById('noPosts').style.display="block"; return; }
  const siens=Object.entries(data).filter(([id,p])=>p.auteurUid===cibleUid || p.auteurUid===vraiUid).reverse();
  if(!siens.length){ document.getElementById('noPosts').style.display="block"; return; }
  document.getElementById('noPosts').style.display="none";
  siens.forEach(([id,p])=>{
    const div=document.createElement('div'); div.className='card';
    const dejaLike = p.likes && p.likes[uid];
    div.innerHTML=`<div class="post-head"><div class="avatar">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.nomAuteur||"?").charAt(0)}</div><div><b>${p.nomAuteur}</b><br><small style="color:#A1A1AA">${p.date||""}</small></div></div><div class="post-text">${p.texte||""}</div>${p.photoUrl?`<img class="main" src="${p.photoUrl}" onclick="ouvrirPostPhoto('${p.photoUrl}')">`:""}${p.videoUrl?`<video controls style="width:100%;border-radius:10px" src="${p.videoUrl}"></video>`:""}<div class="actions"><button class="${dejaLike?'actif':''}" onclick="aimerPost('${id}', this)">👍 ${p.likesCount||0}</button><button onclick="toggleComPost(this)">💬 ${p.commentairesCount||0}</button><button onclick="partagerPost('${id}')">↗️ ${p.partagesCount||0}</button></div><div class="comment-box"><input placeholder="Écris un commentaire..."><button onclick="envoyerComPost('${id}', this)">➤</button></div><div class="comments-list"></div>`;
    box.appendChild(div);
    if(p.photoUrl) grid.innerHTML+=`<img src="${p.photoUrl}" style="width:100%;height:80px;object-fit:cover;border-radius:8px" onclick="ouvrirPostPhoto('${p.photoUrl}')">`;
  });
  if(!grid.innerHTML) document.getElementById('noPhotos').style.display="block"; else document.getElementById('noPhotos').style.display="none";
}
window.ouvrirPostPhoto=(url)=>{
  photoTypeActuel='profil';
  document.getElementById('viewerTitre').innerText="Photo";
  document.getElementById('viewerImg').src=url;
  document.getElementById('viewer').classList.add('open');
};
window.aimerPost=async (postId, btn)=>{
  const snap=await get(ref(db,'jasonbook/posts/'+postId));
  const p=snap.val()||{}; const likes=p.likes||{};
  if(likes[uid]){ delete likes[uid]; } else { likes[uid]={nom:monNom}; }
  await update(ref(db,'jasonbook/posts/'+postId), {likes:likes, likesCount:Object.keys(likes).length});
  btn.classList.toggle('actif', !!likes[uid]);
  btn.innerText="👍 "+Object.keys(likes).length;
};
window.toggleComPost=(btn)=>{
  const card=btn.closest('.card'); const box=card.querySelector('.comment-box'); box.classList.toggle('show'); box.querySelector('input').focus();
};
window.envoyerComPost=async (postId, btn)=>{
  const box=btn.closest('.comment-box'); const inp=box.querySelector('input'); const txt=inp.value.trim(); if(!txt) return;
  const r=push(ref(db,'jasonbook/posts/'+postId+'/commentaires'));
  await set(r,{auteurUid:uid,nom:monNom,texte:txt,date:new Date().toLocaleString()});
  const snap=await get(ref(db,'jasonbook/posts/'+postId));
  await update(ref(db,'jasonbook/posts/'+postId),{commentairesCount:(snap.val().commentairesCount||0)+1});
  inp.value=""; alert("Commentaire ajouté ✅");
  chargerPosts();
};
window.partagerPost=async (postId)=>{
  const snap=await get(ref(db,'jasonbook/posts/'+postId)); const p=snap.val(); if(!p) return;
  await update(ref(db,'jasonbook/posts/'+postId),{partagesCount:(p.partagesCount||0)+1});
  const r=push(ref(db,'jasonbook/posts'));
  await set(r,{auteurUid:uid,nomAuteur:monNom,photoAuteur:maPhoto,texte:monNom+" a partagé : "+(p.texte||""),photoUrl:p.photoUrl||"",videoUrl:p.videoUrl||"",date:new Date().toLocaleString(),timestamp:Date.now(),likesCount:0,commentairesCount:0,partagesCount:0});
  alert("Partagé ✅");
  chargerPosts();
};
</script>
</body>
