<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Événements</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:20px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:750px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{font-size:24px}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-grey{background:#e4e6eb;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border:none;background:#fff;padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.tabs button.active{background:#1877F2;color:#fff}
.e-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:14px}
.e-card .date-box{background:#f0f2f5;border-radius:10px;padding:10px;width:64px;text-align:center;flex-shrink:0}
.e-card .date-box b{font-size:22px;color:#1877F2}.e-card .date-box small{font-size:12px;color:#65676b}
.e-card .info{flex:1}.e-card .info small{color:#65676b}
.e-card .info p{font-size:13px;color:#555;margin:6px 0;white-space:pre-wrap}
.e-card img{width:100%;border-radius:10px;margin-top:8px;max-height:260px;object-fit:cover}
.e-card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:800}
.badge-interesse{background:#fff3cd;color:#856404}.badge-participe{background:#d4edda;color:#155724}
.empty{text-align:center;color:#65676b;padding:40px 10px;background:#fff;border-radius:12px}
.empty .big{font-size:50px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-top:8px;font-size:14px;outline:none}
.modal-box textarea{min-height:70px;resize:vertical}
.modal-box img{width:100%;border-radius:10px;margin-top:10px;max-height:220px;object-fit:cover}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="Assets/theme.css">
<script src="Assets/theme.js"></script>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="Rechercher un événement..." id="searchInput" oninput="rendre()">
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>🎉 Événements</h1><button class="btn-blue" onclick="ouvrirCreer()">➕ Créer un événement</button></div>
<div class="tabs">
<button id="t-tous" class="active" onclick="showTab('tous')">Tous</button>
<button id="t-miens" onclick="showTab('miens')">Mes événements</button>
<button id="t-participe" onclick="showTab('participe')">Je participe</button>
</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🎉</div><h3>Aucun événement pour le moment</h3><p>Crée le premier événement !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="evenements.html">🎉</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalCreer"><div class="modal-box">
<h2>Créer un événement</h2>
<input id="evTitre" placeholder="Nom de l'événement * (ex: Anniversaire de Marie)">
<input id="evDate" type="date">
<input id="evHeure" type="time">
<input id="evLieu" placeholder="Lieu (ex: Salle des fêtes, Kinshasa)">
<textarea id="evDesc" placeholder="Description de l'événement..."></textarea>
<button class="btn-grey" style="width:100%;margin-top:8px" onclick="document.getElementById('evPhoto').click()">📷 Ajouter une photo (optionnel)</button>
<input type="file" id="evPhoto" accept="image/*" style="display:none">
<img id="evPreview" style="display:none">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="creerEvenement()">Créer l'événement</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerCreer()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tous=[], filtre='tous', mesReponses={}, photoEv="";
window.showTab=(t)=>{ filtre=t; ['tous','miens','participe'].forEach(x=>document.getElementById('t-'+x).classList.toggle('active',x===t)); rendre(); };
window.ouvrirCreer=()=>document.getElementById('modalCreer').classList.add('open');
window.fermerCreer=()=>document.getElementById('modalCreer').classList.remove('open');
document.getElementById('evPhoto').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ photoEv=ev.target.result; document.getElementById('evPreview').src=photoEv; document.getElementById('evPreview').style.display="block"; }; r.readAsDataURL(f); });

function rendre(){
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  let liste=tous.filter(e=> ((e.titre||"")+" "+(e.lieu||"")+" "+(e.description||"")).toLowerCase().includes(q));
  if(filtre==='miens') liste=liste.filter(e=>e.auteurUid===uid);
  if(filtre==='participe') liste=liste.filter(e=>mesReponses[e.id]==='participe' || mesReponses[e.id]==='interesse');
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(e=>{
    const d=new Date(e.dateEvent||Date.now());
    const jour=isNaN(d.getTime())?"?":d.getDate();
    const mois=isNaN(d.getTime())?"":d.toLocaleString('fr-FR',{month:'short'});
    const reponse=mesReponses[e.id]||"";
    const div=document.createElement('div'); div.className='e-card';
    div.innerHTML=`
      <div class="date-box"><b>${jour}</b><br><small>${mois}</small></div>
      <div class="info">
        <b style="font-size:16px">${e.titre||""}</b> ${reponse==='participe'?'<span class="badge badge-participe">✅ Je participe</span>':reponse==='interesse'?'<span class="badge badge-interesse">⭐ Intéressé</span>':''}<br>
        <small>🕐 ${e.dateEvent||""} ${e.heure||""} • 📍 ${e.lieu||""} • 👤 ${e.auteurNom||""}</small>
        <p>${e.description||""}</p>
        ${e.photo?`<img src="${e.photo}">`:""}
        <div class="actions">
          <button class="btn-green" onclick="repondreEvent('${e.id}','participe')">✅ Je participe</button>
          <button class="btn-grey" onclick="repondreEvent('${e.id}','interesse')">⭐ Intéressé</button>
          <button class="btn-grey" onclick="repondreEvent('${e.id}','non')">❌ Pas intéressé</button>
          ${e.auteurUid===uid?`<button class="btn-grey" onclick="supprimerEvent('${e.id}')">🗑️</button>`:""}
        </div>
      </div>`;
    box.appendChild(div);
  });
}
window.repondreEvent=async (id, rep)=>{
  if(rep==='non'){ await remove(ref(db,'jasonbook/eventReponses/'+uid+'/'+id)); return; }
  await set(ref(db,'jasonbook/eventReponses/'+uid+'/'+id), rep);
};
window.supprimerEvent=async (id)=>{ if(!confirm("Supprimer cet événement ?")) return; await remove(ref(db,'jasonbook/evenements/'+id)); };
window.creerEvenement=async()=>{
  const titre=document.getElementById('evTitre').value.trim();
  const dateEvent=document.getElementById('evDate').value;
  if(!titre || !dateEvent){ alert("Titre et date obligatoires"); return; }
  const newRef=push(ref(db,'jasonbook/evenements'));
  await set(newRef,{ id:newRef.key, titre:titre, dateEvent:dateEvent, heure:document.getElementById('evHeure').value, lieu:document.getElementById('evLieu').value, description:document.getElementById('evDesc').value, photo:photoEv||"", auteurUid:uid, auteurNom:monNom, photoAuteur:maPhoto||"", date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerCreer(); photoEv=""; ['evTitre','evDate','evHeure','evLieu','evDesc'].forEach(id=>document.getElementById(id).value=""); document.getElementById('evPreview').style.display="none";
  alert("Événement créé ! 🎉");
};
onValue(ref(db,'jasonbook/eventReponses/'+uid), s=>{ mesReponses=s.val()||{}; rendre(); });
onValue(ref(db,'jasonbook/evenements'), s=>{ const d=s.val(); tous=d?Object.entries(d).map(([id,e])=>({id,...e})).sort((a,b)=> new Date(a.dateEvent||0)-new Date(b.dateEvent||0)):[]; rendre(); });
</script>
</body>
</html>
