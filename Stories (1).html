<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK ✨ - Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0A0A0F;color:#fff;min-height:100vh;padding-bottom:92px;overflow-x:hidden}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--or2:#FF9800;--carte:#16161F;--ligne:#26262F;--gris:#A1A1AA}
/* HEADER PRO */
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);padding:12px 14px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:900;white-space:nowrap}
.logo i{color:var(--or);font-style:normal}
.logo small{display:block;font-size:8px;color:var(--gris);letter-spacing:1.2px}
.search{flex:1;background:#1F1F2E;border:1px solid var(--ligne);border-radius:999px;padding:9px 14px;display:flex;gap:6px;align-items:center;color:var(--gris);font-size:13px;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:900px;margin:14px auto;padding:0 14px}
.head{display:flex;align-items:center;justify-content:space-between}
.head h1{font-size:22px}
.head small{color:var(--gris);font-size:13px;display:block;margin-top:2px}
.btn-add{background:linear-gradient(135deg,var(--or),var(--or2));color:#000;border:none;padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
/* STORIES GRID PRO */
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.s-card{height:215px;border-radius:20px;overflow:hidden;position:relative;cursor:pointer;background:#222;border:1px solid var(--ligne)}
.s-card img,.s-card video{width:100%;height:100%;object-fit:cover}
.s-card .overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.8))}
.s-card .name{position:absolute;bottom:10px;left:9px;right:9px;color:#fff;font-weight:700;font-size:13px;line-height:1.3}
.s-card .av{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;border:3px solid var(--or);background:#111;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden}
.s-card .av img{width:100%;height:100%;object-fit:cover}
.s-card.add{background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(255,193,7,.12));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed rgba(168,85,247,.5)}
.s-card.add .plus{width:54px;height:54px;background:linear-gradient(135deg,var(--violet),var(--or));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 20px rgba(124,58,237,.4)}
.s-card.add p{font-size:13px;font-weight:700}
.s-card.add small{color:var(--gris);font-size:11px}
.empty{text-align:center;color:var(--gris);padding:30px 10px;background:var(--carte);border-radius:20px;margin-top:14px;border:1px solid var(--ligne)}
.empty .big{font-size:44px}
/* VIEWER PLEIN ECRAN PRO */
.viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.viewer.open{display:flex}
.viewer .bars{display:flex;gap:4px;width:100%;max-width:420px;margin-bottom:12px}
.viewer .bars .bar{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.viewer .bars .bar .fill{height:100%;background:#fff;width:0%}
.viewer .bars .bar.done .fill{width:100%}
.viewer img,.viewer video{max-width:100%;max-height:72vh;border-radius:14px;object-fit:contain}
.viewer .topbar{width:100%;max-width:420px;display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px}
.viewer .topbar .info{flex:1}.viewer .topbar small{color:#ccc}
.viewer .caption{color:#fff;margin-top:12px;text-align:center;max-width:420px;line-height:1.5}
.viewer .close{position:absolute;top:14px;right:16px;color:#fff;font-size:22px;background:rgba(255,255,255,.18);border:none;cursor:pointer;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.viewer .prev{left:10px}.viewer .next{right:10px}
.viewer .actions{display:flex;gap:10px;margin-top:14px}
.viewer .actions button{border:none;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer;background:#fff;color:#111}
.viewer .actions button:last-child{background:rgba(255,255,255,.15);color:#fff}
/* MODAL ADD */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:110;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--carte);color:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px;border:1px solid var(--ligne)}
.modal-box h2{text-align:center}
.modal-box textarea{width:100%;padding:12px;border:1.5px solid var(--ligne);border-radius:12px;margin-top:10px;font-size:14px;min-height:70px;outline:none;background:#2A2A35;color:#fff;resize:none}
.modal-box textarea::placeholder{color:#888}
.modal-box img{width:100%;border-radius:12px;margin-top:10px;max-height:240px;object-fit:cover}
/* BOTTOM NAV JASONBOOK */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,10,15,.96);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ligne)}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px;font-weight:700}
.bottom button.active{color:var(--or)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F}
</style>
</head>
<body>

<div class="top">
<div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
<div class="search" onclick="location.href='recherche.html'">🔍 <span>Chercher...</span></div>
<div class="avatar" id="myAvatarTop" onclick="location.href='profil.html'">?</div>
</div>

<div class="wrap">
<div class="head">
<div><h1>Stories ✨</h1><small>Elles disparaissent après 24h</small></div>
<button class="btn-add" onclick="ouvrirAdd()">➕ Ma story</button>
</div>
<div class="row" id="row"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">✨</div><h3 style="color:#fff;margin:8px 0">Aucune story pour le moment</h3><p>Sois le premier à publier une story ! Elle disparaît après 24h.</p></div>
</div>

<div class="bottom">
<button onclick="location.href='feed.html'"><span>🏠</span>Accueil</button>
<button onclick="location.href='amis.html'"><span>👥</span>Amis</button>
<button onclick="location.href='creer-post.html'"><span class="centre">+</span></button>
<button onclick="location.href='messages.html'"><span>💬</span>Messages</button>
<button onclick="location.href='profil.html'"><span>👤</span>Moi</button>
</div>

<div class="viewer" id="viewer">
<button class="close" onclick="fermerViewer()">✕</button>
<button class="nav prev" onclick="storyPrec()">‹</button>
<div class="bars" id="bars"></div>
<div class="topbar"><div class="avatar" id="vAv">?</div><div class="info"><b id="vNom"></b><br><small id="vDate"></small></div></div>
<img id="vImg" style="display:none"><video id="vVideo" controls style="display:none"></video>
<div class="caption" id="vCaption"></div>
<div class="actions"><button onclick="repondreStory()">💬 Répondre</button><button id="btnDelStory" onclick="supprimerStory()">🗑️ Supprimer</button></div>
<button class="nav next" onclick="storySuiv()">›</button>
</div>

<div class="modal" id="modalAdd"><div class="modal-box">
<h2>✨ Nouvelle story</h2>
<button style="width:100%;padding:13px;border:2px dashed #4A4A5A;background:#2A2A35;color:#fff;border-radius:12px;cursor:pointer;margin-top:14px;font-weight:700" onclick="document.getElementById('storyFile').click()">📷 Choisir photo / vidéo</button>
<input type="file" id="storyFile" accept="image/*,video/*" style="display:none">
<img id="storyPreview" style="display:none">
<textarea id="storyText" placeholder="Ajoute un texte à ta story... (optionnel)"></textarea>
<button style="width:100%;padding:13px;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;border:none;border-radius:999px;font-weight:800;cursor:pointer;margin-top:10px" onclick="publierStory()">Publier la story</button>
<button style="width:100%;padding:12px;background:#2A2A35;color:#fff;border:none;border-radius:999px;font-weight:700;cursor:pointer;margin-top:8px" onclick="fermerAdd()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatarTop').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let stories=[], groupe=[], indexGroupe=0, indexStory=0, mediaTemp="", typeMediaTemp="photo", progressInt=null;
function grouper(){
  const parAuteur={};
  stories.forEach(s=>{ if(!parAuteur[s.auteurUid]) parAuteur[s.auteurUid]=[]; parAuteur[s.auteurUid].push(s); });
  groupe=Object.values(parAuteur).sort((a,b)=>(b[0].timestamp||0)-(a[0].timestamp||0));
}
function rendre(){
  grouper(); const row=document.getElementById('row'); row.innerHTML="";
  const add=document.createElement('div'); add.className='s-card add'; add.onclick=ouvrirAdd;
  add.innerHTML=`<div class="plus">+</div><p>Ma story</p><small>Publier en 24h</small>`; row.appendChild(add);
  document.getElementById('emptyBox').style.display=groupe.length?'none':'block';
  groupe.forEach((g,gi)=>{
    const s=g[0]; const div=document.createElement('div'); div.className='s-card'; div.onclick=()=>ouvrirViewer(gi,0);
    const media=s.type==='video' ? `<video src="${s.media}" style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${s.media}">`;
    div.innerHTML=`${media}<div class="overlay"></div><div class="av"><span>${s.photoAuteur?`<img src="${s.photoAuteur}">`:(s.auteurNom||"?").charAt(0)}</span></div><div class="name">${s.auteurNom||""} • ${g.length} story${g.length>1?'s':''}</div>`;
    row.appendChild(div);
  });
}
window.ouvrirAdd=()=>document.getElementById('modalAdd').classList.add('open');
window.fermerAdd=()=>document.getElementById('modalAdd').classList.remove('open');
document.getElementById('storyFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; typeMediaTemp=f.type.startsWith('video')?'video':'photo';
  const r=new FileReader(); r.onload=ev=>{ mediaTemp=ev.target.result; const p=document.getElementById('storyPreview'); p.src=mediaTemp; p.style.display="block"; }; r.readAsDataURL(f);
});
window.publierStory=async()=>{
  if(!mediaTemp){ alert("Choisis une photo ou vidéo"); return; }
  const newRef=push(ref(db,'jasonbook/stories'));
  await set(newRef,{ id:newRef.key, media:mediaTemp, type:typeMediaTemp, texte:document.getElementById('storyText').value, auteurUid:uid, auteurNom:monNom, photoAuteur:maPhoto||"", date:new Date().toLocaleString(), timestamp:Date.now(), expire:Date.now()+24*60*60*1000 });
  fermerAdd(); mediaTemp=""; document.getElementById('storyText').value=""; document.getElementById('storyPreview').style.display="none";
  alert("Story publiée ! ✨ Elle disparaît dans 24h.");
};
function afficherStory(){
  const g=groupe[indexGroupe]; if(!g) return; const s=g[indexStory]; if(!s) return;
  document.getElementById('bars').innerHTML=g.map((_,i)=>`<div class="bar ${i<indexStory?'done':''}"><div class="fill" id="bar-${i}"></div></div>`).join('');
  document.getElementById('vAv').innerHTML=s.photoAuteur?`<img src="${s.photoAuteur}">`:(s.auteurNom||"?").charAt(0);
  document.getElementById('vNom').innerText=s.auteurNom||"";
  document.getElementById('vDate').innerText=s.date||"";
  document.getElementById('vCaption').innerText=s.texte||"";
  document.getElementById('btnDelStory').style.display=s.auteurUid===uid?'inline-block':'none';
  const img=document.getElementById('vImg'), vid=document.getElementById('vVideo');
  if(s.type==='video'){ img.style.display='none'; vid.style.display='block'; vid.src=s.media; vid.play(); }
  else { vid.style.display='none'; vid.pause(); img.style.display='block'; img.src=s.media; }
  clearInterval(progressInt); let w=0;
  progressInt=setInterval(()=>{ w+=2; const b=document.getElementById('bar-'+indexStory); if(b) b.style.width=w+"%"; if(w>=100){ clearInterval(progressInt); storySuiv(); } },100);
}
window.ouvrirViewer=(gi,si)=>{ indexGroupe=gi; indexStory=si; document.getElementById('viewer').classList.add('open'); afficherStory(); };
window.fermerViewer=()=>{ document.getElementById('viewer').classList.remove('open'); clearInterval(progressInt); document.getElementById('vVideo').pause(); };
window.storySuiv=()=>{
  const g=groupe[indexGroupe]; if(!g) return;
  if(indexStory<g.length-1){ indexStory++; afficherStory(); }
  else if(indexGroupe<groupe.length-1){ indexGroupe++; indexStory=0; afficherStory(); }
  else fermerViewer();
};
window.storyPrec=()=>{
  if(indexStory>0){ indexStory--; afficherStory(); }
  else if(indexGroupe>0){ indexGroupe--; indexStory=groupe[indexGroupe].length-1; afficherStory(); }
};
window.repondreStory=()=>{ const s=groupe[indexGroupe][indexStory]; location.href='messages.html?uid='+s.auteurUid; };
window.supprimerStory=async()=>{ const s=groupe[indexGroupe][indexStory]; if(!confirm("Supprimer cette story ?")) return; await remove(ref(db,'jasonbook/stories/'+s.id)); fermerViewer(); };
onValue(ref(db,'jasonbook/stories'), s=>{
  const d=s.val(); const now=Date.now();
  if(!d){ stories=[]; rendre(); return; }
  stories=Object.entries(d).map(([id,x])=>({id,...x})).filter(x=> (x.expire||0) > now).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  rendre();
});
</script>
</body>
</html>
