
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a14">
<title>Mon espace — JASON BUSINESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050a14;color:#f5f7fb;font-family:Arial,sans-serif;padding:22px}
header{display:flex;align-items:center;gap:12px;margin-bottom:25px}
.logo{background:#00d4ff;color:#06111e;border-radius:13px;padding:13px;font-weight:900}
.card{max-width:600px;margin:auto;background:#0c1525;border:1px solid #26364b;border-radius:20px;padding:23px}
p{color:#a7b5c9;overflow-wrap:anywhere}
button{width:100%;padding:14px;background:#d8aa45;border:0;border-radius:10px;font-weight:800;margin-top:15px}
</style>
</head>
<body>
<header>
<div class="logo">JB</div>
<div><strong>JASON BUSINESS</strong><br><small>Mon espace membre</small></div>
</header>
<main class="card">
<h1>Bienvenue !</h1>
<p id="status">Vérification de la session...</p>
<div id="profile" hidden>
<p><strong>Nom :</strong> <span id="name"></span></p>
<p><strong>Gmail :</strong> <span id="email"></span></p>
<p><strong>Téléphone :</strong> <span id="phone"></span></p>
<p><strong>Parrainage :</strong> <span id="referral"></span></p>
<button id="logout">Se déconnecter</button>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async user => {
  const status = document.getElementById("status");
  const profile = document.getElementById("profile");

  if (!user) {
    location.replace("login.html");
    return;
  }

  try {
    const snapshot = await db.ref("users/" + user.uid).once("value");
    const data = snapshot.val() || {};

    document.getElementById("name").textContent =
      data.name || user.displayName || "Membre";
    document.getElementById("email").textContent = user.email || "";
    document.getElementById("phone").textContent = data.phone || "Non renseigné";
    document.getElementById("referral").textContent = data.referral || "Aucun";

    status.hidden = true;
    profile.hidden = false;
  } catch (error) {
    status.textContent = "Impossible de charger le profil. Vérifie les règles Firebase et réessaie.";
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  try {
    await auth.signOut();
    location.replace("login.html");
  } catch (error) {
    document.getElementById("status").textContent = error.message;
  }
});
</script>
</body>
</html>
