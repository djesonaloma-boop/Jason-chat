<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JASON FACE</title>
<meta name="theme-color" content="#050914">
<style>
:root{--bg:#050914;--card:#0f1c32;--card2:#13203c;--border:rgba(255,255,255,.09);--text:#eef3ff;--muted:#8da2bc;--blue:#1877f2;--blue2:#00c8ff;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:radial-gradient(ellipse at top,rgba(0,140,255,.12),transparent 50%),var(--bg);color:var(--text)}
.header{position:sticky;top:0;z-index:20;background:rgba(10,18,37,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:900;font-size:22px}.logo b{color:var(--blue)}.logo span{color:var(--blue2)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-weight:900}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px}
.card{background:linear-gradient(180deg,#101d35,#0c152a);border:1px solid var(--border);border-radius:16px}
.card-pad{padding:14px}
.side{position:sticky;top:66px;height:fit-content}
.menu{padding:11px;border-radius:10px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px;cursor:pointer}
.menu:hover{background:var(--card2)}
.menu.active{background:#1877f21a;border:1px solid #1877f233}
.input{background:var(--card2);border:1px solid var(--border);border-radius:22px;padding:11px 14px;color:white;outline:none;width:100%}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn-blue{background:var(--blue);color:white}
.bal{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bal div{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px}
.bal small{color:var(--muted);font-size:11px}.bal b{font-size:15px;display:block;margin-top:2px}
.post{margin-bottom:12px}
.post-h{display:flex;gap:10px;align-items:center}
.post-text{margin:10px 0;white-space:pre-wrap;line-height:1.5;font-size:14px}
.post-img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--border);margin-top:8px}
.actions{display:flex;border-top:1px solid var(--border);margin-top:10px}
.actions button{flex:1;background:transparent;border:0;color:var(--muted);padding:10px;font-weight:800}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(10,18,37,.98);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:8px 0}
.bottom button{background:transparent;border:0;color:var(--muted);font-size:22px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{display:none}.bottom{display:flex}body{padding-bottom:70px}}
</style>
</head>
<body>

<div class="header">
 <div class="logo">JASON <b>FACE</b> <span style="font-size:10px;background:var(--blue);padding:2px 6px;border-radius:10px;color:white">BISO</span></div>
 <div style="display:flex;gap:8px;align-items:center">
  <button class="btn btn-blue" style="padding:8px 12px;font-size:12px" onclick="location.href='/dashboard.html'">📊 Dashboard</button>
  <div class="avatar" id="topA">J</div>
 </div>
</div>

<div class="wrap">
 <aside class="side">
  <div class="card card-pad">
   <div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="leftA">J</div><div><b id="leftName">...</b><br><small id="leftPhone" style="color:var(--muted)"></small></div></div>
   <div class="bal">
    <div><small>💰 Solde</small><b id="bal">0 FC</b></div>
    <div><small>👑 VIP</small><b id="vip">0%</b></div>
   </div>
   <div style="margin-top:14px">
    <div class="menu active">📰 Fil d'actualité</div>
    <div class="menu" onclick="location.href='/dashboard.html'">📊 Mon Dashboard</div>
    <div class="menu" onclick="location.href='/messager.html'">💬 Messager</div>
    <div class="menu" onclick="location.href='/story.html'">📖 Stories</div>
    <div class="menu" onclick="location.href='/parametres.html'">⚙️ Paramètres</div>
    <div class="menu" onclick="localStorage.clear();location.href='/login.html'">🚪 Déconnexion</div>
   </div>
  </div>
 </aside>

 <main>
  <div class="card card-pad">
   <div style="display:flex;gap:10px"><div class="avatar" id="createA">J</div><input id="postText" class="input" placeholder="Quoi de neuf, boss?"></div>
   <input id="postImg" class="input" placeholder="Lien image https:// (optionnel)" style="margin-top:10px">
   <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-blue" style="flex:1" onclick="createPost()">Publier sur JASON FACE</button></div>
  </div>
  <div id="feed" style="margin-top:14px"></div>
 </main>
</div>

<div class="bottom">
 <button onclick="location.href='/'">📰</button>
 <button onclick="location.href='/dashboard.html'">📊</button>
 <button onclick="location.href='/messager.html'">💬</button>
 <button onclick="location.href='/parametres.html'">⚙️</button>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApps()[0]:initializeApp(cfg);
const db=getDatabase(app);
const phone=localStorage.getItem("jasonBusinessUserPhone")||localStorage.getItem("userPhone")||"";
if(!phone) location.href="/login.html";
const name=localStorage.getItem("jasonBusinessUserName")||phone||"J";
const L=name[0]?.toUpperCase()||"J";
["topA","leftA","createA"].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=L; });
document.getElementById("leftName").textContent=name;
document.getElementById("leftPhone").textContent=phone;

onValue(ref(db,`jasonBusiness/users/${phone}`), s=>{
  const d=s.val()||{}; document.getElementById("bal").textContent=(Number(d.solde_principal||0)).toLocaleString("fr-FR")+" FC"; document.getElementById("vip").textContent=(d.vipDiscount||0)+"%";
});

window.createPost=async()=>{
  const t=document.getElementById("postText").value.trim(); const img=document.getElementById("postImg").value.trim();
  if(!t&&!img) return alert("Écris quelque chose");
  await push(ref(db,`jasonBusiness/facebook_posts`),{telephone:phone,nom:name,text:t,image:img,likes:0,comments:{},createdAt:Date.now(),date:new Date().toLocaleString("fr-FR")});
  document.getElementById("postText").value=""; document.getElementById("postImg").value="";
};

onValue(ref(db,`jasonBusiness/facebook_posts`), snap=>{
  const feed=document.getElementById("feed"); feed.innerHTML="";
  let arr=[]; snap.forEach(c=>arr.push({id:c.key,...c.val()})); arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!arr.length){ feed.innerHTML="<div class='card card-pad' style='text-align:center;color:var(--muted)'>Aucun post - Sois le premier sur JASON FACE 👑</div>"; return; }
  arr.forEach(p=>{
    const el=document.createElement("div"); el.className="card card-pad post";
    const cmts=Object.values(p.comments||{}).slice(-2).map(c=>`<div style="font-size:12px;margin-top:6px;background:var(--card2);padding:6px 10px;border-radius:12px"><b>${c.nom||"User"}:</b> ${String(c.text||"").replace(/</g,"&lt;")}</div>`).join("");
    el.innerHTML=`<div class="post-h"><div class="avatar" style="width:36px;height:36px;font-size:13px">${(p.nom||"J")[0].toUpperCase()}</div><div><b style="font-size:13px">${(p.nom||p.telephone||"User").slice(0,22)}</b><br><small style="color:var(--muted)">${p.date||""}</small></div></div><div class="post-text">${String(p.text||"").replace(/</g,"&lt;")}</div>${p.image?`<img class="post-img" src="${p.image}" onerror="this.style.display='none'">`:""}<div style="font-size:12px;color:var(--muted);margin-top:8px">👍 ${p.likes||0} · ${Object.keys(p.comments||{}).length} commentaires</div><div class="actions"><button onclick="likePost('${p.id}')">👍 J'aime</button><button onclick="focusCmt('${p.id}')">💬 Commenter</button></div>${cmts}<div style="display:flex;gap:8px;margin-top:8px"><input id="c-${p.id}" class="input" placeholder="Commentaire..." style="padding:9px"><button class="btn btn-blue" onclick="commentPost('${p.id}')">➤</button></div>`;
    feed.appendChild(el);
  });
});

window.likePost=async(id)=>{ await runTransaction(ref(db,`jasonBusiness/facebook_posts/${id}/likes`),c=>(Number(c)||0)+1); };
window.commentPost=async(id)=>{ const inp=document.getElementById(`c-${id}`); const t=inp?.value.trim(); if(!t) return; await push(ref(db,`jasonBusiness/facebook_posts/${id}/comments`),{telephone:phone,nom:name,text:t,createdAt:Date.now()}); inp.value=""; };
window.focusCmt=id=>document.getElementById(`c-${id}`)?.focus();
</script>
</body>
</html>
