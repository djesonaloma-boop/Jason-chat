<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Anniversaires</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:650px;margin:16px auto;padding:0 12px}
.wrap h1{font-size:23px;letter-spacing:-.3px}
.wrap .sub{color:var(--grey);margin:4px 0 14px;font-size:14px}
.section-title{background:#fff;padding:12px 14px;border-radius:10px;margin:14px 0 10px;font-weight:800;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line)}
.b-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.b-card .info{flex:1;min-width:0}.b-card .info small{color:var(--grey);font-size:12.5px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-pink{background:#ff4081;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-grey{background:#f0f2f5;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:400px;border-radius:14px;padding:20px}
.modal-box textarea{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:10px;margin-top:10px;min-height:80px;outline:none;resize:vertical;background:#f8f9fa;font-size:14px}
.modal-box textarea:focus{border-color:var(--blue);background:#fff}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<h1>Anniversaires</h1>
<p class="sub">N'oublie plus jamais l'anniversaire de tes amis !</p>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><h3>Aucun anniversaire à venir</h3><p>Tes amis n'ont pas encore renseigné leur date de naissance.</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="anniversaires.html">🎂</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalSouhait"><div class="modal-box">
<h2 id="souhaitTitre">🎂 Souhaiter joyeux anniversaire</h2>
<textarea id="souhaitTexte" placeholder="Écris ton message..."></textarea>
<button class="btn-blue" style="width:100%;margin-top:12px;padding:12px" onclick="envoyerSouhait()">🎉 Envoyer le souhait</button>
<button class="btn-grey" style="margin-top:8px" onclick="fermerSouhait()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let users=[], cibleSouhait=null, cibleNom="";
function joursRestants(dateNaissance){
  if(!dateNaissance) return 999;
  let jour, mois;
  if(dateNaissance.includes('-')){ const p=dateNaissance.split('-'); mois=parseInt(p[1]); jour=parseInt(p[2]); }
  else if(dateNaissance.includes('/')){ const p=dateNaissance.split('/'); jour=parseInt(p[0]); mois=parseInt(p[1]); }
  else return 999;
  const now=new Date(); const annee=now.getFullYear();
  let anniv=new Date(annee, mois-1, jour);
  if(anniv < new Date(now.getFullYear(), now.getMonth(), now.getDate())) anniv=new Date(annee+1, mois-1, jour);
  return Math.ceil((anniv - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / (1000*60*60*24));
}
function ageFutur(dateNaissance){
  if(!dateNaissance || !dateNaissance.includes('-')) return "";
  const anneeNaissance=parseInt(dateNaissance.split('-')[0]);
  return new Date().getFullYear() - anneeNaissance;
}
function rendre(){
  const box=document.getElementById('list'); box.innerHTML="";
  const avecDate=users.filter(u=>u.dateNaissance).map(u=>({...u, jours:joursRestants(u.dateNaissance)})).sort((a,b)=>a.jours-b.jours);
  const aujourdHui=avecDate.filter(u=>u.jours===0);
  const cetteSemaine=avecDate.filter(u=>u.jours>0 && u.jours<=7);
  const ceMois=avecDate.filter(u=>u.jours>7 && u.jours<=30);
  document.getElementById('emptyBox').style.display=avecDate.length?'none':'block';
  if(aujourdHui.length) ajouterSection(box, "🎂 Aujourd'hui !", aujourdHui, true);
  if(cetteSemaine.length) ajouterSection(box, "📅 Cette semaine", cetteSemaine, false);
  if(ceMois.length) ajouterSection(box, "🗓️ Ce mois-ci", ceMois, false);
}
function ajouterSection(box, titre, liste, isToday){
  const t=document.createElement('div'); t.className='section-title'; t.innerText=titre; box.appendChild(t);
  liste.forEach(u=>{
    const div=document.createElement('div'); div.className='b-card';
    const age=ageFutur(u.dateNaissance);
    div.innerHTML=`
      <div class="avatar" style="width:50px;height:50px;font-size:20px">${u.photo?`<img src="${u.photo}">`:(u.nom||"?").charAt(0).toUpperCase()}</div>
      <div class="info"><b>${u.nom||""} ${isToday?"🎉":""}</b><br><small>${isToday?"C'est son anniversaire aujourd'hui !":`Dans ${u.jours} jour${u.jours>1?'s':''} • ${u.dateNaissance}`} ${age?`• Va avoir ${age} ans`:""}</small></div>
      <button class="${isToday?'btn-pink':'btn-blue'}" onclick="ouvrirSouhait('${u.uid}','${(u.nom||"").replace(/'/g,"")}')">${isToday?"🎂 Souhaiter":"💌 Préparer"}</button>`;
    box.appendChild(div);
  });
}
window.ouvrirSouhait=(uidCible, nom)=>{
  cibleSouhait=uidCible; cibleNom=nom;
  document.getElementById('souhaitTitre').innerText="🎂 Souhaiter joyeux anniversaire à "+nom;
  document.getElementById('souhaitTexte').value="Joyeux anniversaire "+nom+" ! 🎂🎉 Que cette année t'apporte bonheur, santé et réussite ! ❤️";
  document.getElementById('modalSouhait').classList.add('open');
};
window.fermerSouhait=()=>document.getElementById('modalSouhait').classList.remove('open');
window.envoyerSouhait=async()=>{
  const texte=document.getElementById('souhaitTexte').value.trim();
  if(!texte){ alert("Écris ton message"); return; }
  const newRef=push(ref(db,'jasonbook/posts'));
  await set(newRef,{ id:newRef.key, texte:texte, auteurUid:uid, auteurNom:monNom, photoAuteur:maPhoto||"", date:new Date().toLocaleString(), timestamp:Date.now(), type:'anniversaire', pourUid:cibleSouhait, pourNom:cibleNom });
  const nRef=push(ref(db,'jasonbook/notifications/'+cibleSouhait));
  await set(nRef,{ type:'anniversaire', deUid:uid, deNom:monNom, dePhoto:maPhoto||"", texte:monNom+" t'a souhaité joyeux anniversaire ! 🎂", date:new Date().toLocaleString(), timestamp:Date.now(), lu:false });
  fermerSouhait(); alert("Souhait envoyé ! 🎉❤️");
};
onValue(ref(db,'jasonbook/users'), s=>{
  const d=s.val(); users=d?Object.entries(d).map(([uid,u])=>({uid,...u})).filter(u=>u.uid!==uid):[];
  rendre();
});
</script>
</body>
</html>
