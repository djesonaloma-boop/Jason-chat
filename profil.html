<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Mon Profil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:20px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar-mini{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;overflow:hidden;flex-shrink:0}
.avatar-mini img{width:100%;height:100%;object-fit:cover}
.cover-wrap{background:#fff;max-width:1000px;margin:0 auto;padding-bottom:14px;border-radius:0 0 12px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.cover{height:280px;background:linear-gradient(135deg,#1877F2,#0F2027);border-radius:0 0 12px 12px;position:relative;overflow:hidden;cursor:pointer}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .change{position:absolute;right:12px;bottom:12px;background:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.profile-row{display:flex;gap:16px;align-items:flex-end;padding:0 20px;margin-top:-40px;flex-wrap:wrap}
.big-avatar{width:150px;height:150px;border-radius:50%;background:#1877F2;color:#fff;border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;cursor:pointer;overflow:hidden;flex-shrink:0;position:relative}
.big-avatar img{width:100%;height:100%;object-fit:cover}
.big-avatar .cam{position:absolute;bottom:8px;right:8px;background:#f0f2f5;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.profile-info{flex:1;min-width:220px;padding-bottom:5px}
.profile-info h1{font-size:28px}
.profile-info p{color:#65676b;font-size:14px;margin-top:4px;line-height:1.4}
.profile-btns{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:5px}
.profile-btns button{padding:10px 18px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn-blue{background:#1877F2;color:#fff}.btn-grey{background:#e4e6eb}
.tabs{display:flex;gap:5px;padding:10px 20px;border-top:1px solid #eee;margin-top:12px;overflow-x:auto}
.tabs button{border:none;background:none;padding:9px 14px;font-weight:700;cursor:pointer;border-radius:8px;white-space:nowrap}
.tabs button.active{background:#e7f3ff;color:#1877F2}
.layout{display:flex;gap:15px;max-width:1000px;margin:14px auto;padding:0 12px;align-items:flex-start}
.left{width:340px;position:sticky;top:65px}
.right{flex:1;min-width:0}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin-bottom:10px}
.info-row{display:flex;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid #f0f2f5}
.info-row span{font-size:18px}
.create{display:flex;gap:10px;align-items:center}
.create input{flex:1;padding:12px 15px;background:#f0f2f5;border:none;border-radius:20px;font-size:15px;outline:none;cursor:pointer}
.post-head{display:flex;gap:10px;align-items:center}
.post-text{margin:10px 0;font-size:15px;white-space:pre-wrap}
.post img.main{width:100%;border-radius:10px;max-height:500px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;padding-top:8px;margin-top:8px}
.actions button{border:none;background:none;font-weight:700;color:#65676b;cursor:pointer;padding:7px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:430px;border-radius:14px;padding:20px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-top:8px;font-size:14px;outline:none}
.modal-box textarea{min-height:70px;resize:vertical}
.bottom-nav{display:none}
@media(max-width:800px){.left{display:none}.layout{padding:0 8px}.cover{height:180px}.big-avatar{width:110px;height:110px;font-size:40px}.profile-row{justify-content:center;text-align:center}.profile-info{text-align:center}.profile-btns{justify-content:center}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}}
</style>
<link rel="stylesheet" href="Assets/theme.css">
<script src="Assets/theme.js"></script>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar-mini" id="headerAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="cover-wrap">
<div class="cover" id="coverDiv" onclick="document.getElementById('fileCover').click()"><span id="coverTxt" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px">📷 Ajouter une photo de couverture</span><button class="change" onclick="event.stopPropagation();document.getElementById('fileCover').click()">✏️ Modifier</button></div>
<input type="file" id="fileCover" accept="image/*" style="display:none">
<input type="file" id="fileAvatar" accept="image/*" style="display:none">
<div class="profile-row">
<div class="big-avatar" id="bigAvatar" onclick="document.getElementById('fileAvatar').click()">?<div class="cam">📷</div></div>
<div class="profile-info">
<h1 id="nomAffiche">Chargement...</h1>
<p id="bioAffiche"></p>
<p id="metaAffiche"></p>
<p id="amisCount">0 ami</p>
</div>
<div class="profile-btns">
<button class="btn-blue" onclick="ouvrirEdit()">✏️ Modifier le profil</button>
<button class="btn-grey" onclick="location.href='creer-post.html'">➕ Publier</button>
<button class="btn-grey" onclick="deconnecter()">🚪 Déconnexion</button>
</div>
</div>
<div class="tabs">
<button class="active" onclick="showTab('posts',this)">Publications</button>
<button onclick="showTab('apropos',this)">À propos</button>
<button onclick="showTab('amis',this)">Amis</button>
<button onclick="showTab('photos',this)">Photos</button>
</div>
</div>

<div class="layout">
<div class="left">
<div class="card" id="tabAproposLeft"><h3>Intro</h3><div id="introList"></div><button style="width:100%;margin-top:10px;padding:10px;border:none;background:#e4e6eb;border-radius:8px;font-weight:700;cursor:pointer" onclick="ouvrirEdit()">Modifier les infos</button></div>
<div class="card"><h3>Photos</h3><div id="photosGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div><p id="noPhotos" style="color:#65676b;font-size:13px">Aucune photo pour le moment</p></div>
<div class="card"><h3>Amis</h3><div id="amisList"></div></div>
</div>

<div class="right" id="tabPosts">
<div class="card"><div class="create"><div class="avatar-mini" id="createAvatar">?</div><input placeholder="Quoi de neuf ?" onclick="location.href='creer-post.html'"></div></div>
<div id="mesPosts"></div>
<div id="noPosts" style="display:none" class="card"><p style="text-align:center;color:#65676b">Aucune publication pour le moment.<br>Publie ta première publication !</p></div>
</div>

<div class="right" id="tabApropos" style="display:none"><div class="card"><h3>À propos</h3><div id="aproposFull"></div></div></div>
<div class="right" id="tabAmis" style="display:none"><div class="card"><h3>Mes amis</h3><div id="amisFull"></div></div></div>
<div class="right" id="tabPhotos" style="display:none"><div class="card"><h3>Mes photos</h3><div id="photosFull" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="notifications.html">🔔</a><a href="profil.html">👤</a></nav>

<!-- MODAL EDIT -->
<div class="modal" id="modalEdit"><div class="modal-box">
<h2>Modifier le profil</h2>
<label style="font-size:12px;font-weight:700">Bio</label><textarea id="editBio" placeholder="Parle de toi..."></textarea>
<label style="font-size:12px;font-weight:700">Activité</label><input id="editActivite" placeholder="Ton activité">
<label style="font-size:12px;font-weight:700">Ville</label><input id="editVille" placeholder="Ta ville">
<label style="font-size:12px;font-weight:700">Pays</label><input id="editPays" placeholder="Ton pays">
<button style="width:100%;margin-top:14px;padding:13px;border:none;background:#1877F2;color:#fff;border-radius:10px;font-weight:800;cursor:pointer" onclick="sauvegarderProfil()">Enregistrer</button>
<button style="width:100%;margin-top:8px;padding:12px;border:none;background:#f0f2f5;border-radius:10px;font-weight:700;cursor:pointer" onclick="fermerEdit()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid');
if(!uid) location.href='index.html';
let monProfil = null;

function avatar(photo, lettre){ return photo ? `<img src="${photo}">` : lettre; }
window.showTab=(id,btn)=>{
  ['tabPosts','tabApropos','tabAmis','tabPhotos'].forEach(t=>document.getElementById(t).style.display='none');
  document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1)).style.display='block';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
};
window.ouvrirEdit=()=>{ if(!monProfil) return; document.getElementById('editBio').value=monProfil.bio||""; document.getElementById('editActivite').value=monProfil.activite||""; document.getElementById('editVille').value=monProfil.ville||""; document.getElementById('editPays').value=monProfil.pays||""; document.getElementById('modalEdit').classList.add('open'); };
window.fermerEdit=()=>document.getElementById('modalEdit').classList.remove('open');
window.sauvegarderProfil=async()=>{
  await update(ref(db,'jasonbook/users/'+uid),{ bio:document.getElementById('editBio').value, activite:document.getElementById('editActivite').value, ville:document.getElementById('editVille').value, pays:document.getElementById('editPays').value });
  fermerEdit();
};
window.deconnecter=()=>{ localStorage.clear(); location.href='index.html'; };

// CHARGER PROFIL
onValue(ref(db,'jasonbook/users/'+uid), (snap)=>{
  const u=snap.val(); if(!u) return; monProfil=u;
  const lettre=(u.prenom||u.nom||"?").charAt(0).toUpperCase();
  document.getElementById('bigAvatar').innerHTML = avatar(u.photoProfil, lettre)+'<div class="cam">📷</div>';
  document.getElementById('headerAvatar').innerHTML = avatar(u.photoProfil, lettre);
  document.getElementById('createAvatar').innerHTML = avatar(u.photoProfil, lettre);
  document.getElementById('nomAffiche').innerText = u.nomComplet||"";
  document.getElementById('bioAffiche').innerText = u.bio||"";
  document.getElementById('metaAffiche').innerText = `${u.activite||""} • ${u.ville||""} • ${u.pays||""}`;
  document.getElementById('introList').innerHTML = `
    <div class="info-row"><span>💼</span> ${u.activite||"Activité non précisée"}</div>
    <div class="info-row"><span>📍</span> ${u.ville||""} ${u.pays? "- "+u.pays:""}</div>
    <div class="info-row"><span>📞</span> ${u.phone||""}</div>
    <div class="info-row"><span>✉️</span> ${u.email||""}</div>
    <div class="info-row"><span>📅</span> Membre depuis ${u.dateInscription||""}</div>`;
  document.getElementById('aproposFull').innerHTML = document.getElementById('introList').innerHTML;
  if(u.photoCouverture){ document.getElementById('coverDiv').innerHTML=`<img src="${u.photoCouverture}"><button class="change" onclick="event.stopPropagation();document.getElementById('fileCover').click()">✏️ Modifier</button>`; }
});

// CHANGER PHOTO PROFIL / COUVERTURE
document.getElementById('fileAvatar').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async ev=>{ await update(ref(db,'jasonbook/users/'+uid),{photoProfil:ev.target.result}); localStorage.setItem('jasonbook_photo',ev.target.result); }; r.readAsDataURL(f);
});
document.getElementById('fileCover').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async ev=>{ await update(ref(db,'jasonbook/users/'+uid),{photoCouverture:ev.target.result}); }; r.readAsDataURL(f);
});

// MES POSTS
onValue(ref(db,'jasonbook/posts'), (snap)=>{
  const data=snap.val(); const box=document.getElementById('mesPosts'); const grid=document.getElementById('photosGrid'); const full=document.getElementById('photosFull'); box.innerHTML=""; grid.innerHTML=""; full.innerHTML="";
  if(!data){ document.getElementById('noPosts').style.display="block"; return; }
  const miens=Object.entries(data).filter(([id,p])=>p.auteurUid===uid).reverse();
  if(!miens.length){ document.getElementById('noPosts').style.display="block"; return; }
  document.getElementById('noPosts').style.display="none";
  miens.forEach(([id,p])=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<div class="post-head"><div class="avatar-mini">${avatar(monProfil?.photoProfil,(monProfil?.prenom||"?").charAt(0))}</div><div><b>${p.nomAuteur}</b><br><small>${p.date||""}</small></div></div><div class="post-text">${p.texte||""}</div>${p.photoUrl?`<img class="main" src="${p.photoUrl}">`:""}<div class="actions"><button>👍 ${p.likesCount||0}</button><button>💬 ${p.commentairesCount||0}</button><button>↗️ ${p.partagesCount||0}</button></div>`;
    box.appendChild(div);
    if(p.photoUrl){ grid.innerHTML+=`<img src="${p.photoUrl}" style="width:100%;height:80px;object-fit:cover;border-radius:8px">`; full.innerHTML+=`<img src="${p.photoUrl}" style="width:100%;border-radius:10px">`; }
  });
  if(!grid.innerHTML) document.getElementById('noPhotos').style.display="block"; else document.getElementById('noPhotos').style.display="none";
});

// AMIS
onValue(ref(db,'jasonbook/amis/'+uid), async (snap)=>{
  const data=snap.val(); const box=document.getElementById('amisList'); const full=document.getElementById('amisFull'); box.innerHTML=""; full.innerHTML="";
  if(!data){ box.innerHTML='<p style="color:#65676b;font-size:13px">Aucun ami pour le moment</p>'; full.innerHTML=box.innerHTML; document.getElementById('amisCount').innerText="0 ami"; return; }
  const ids=Object.keys(data); document.getElementById('amisCount').innerText=ids.length+" ami"+(ids.length>1?"s":"");
  for(const fid of ids){
    const s=await get(ref(db,'jasonbook/users/'+fid)); const u=s.val(); if(!u) continue;
    const html=`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer" onclick="location.href='profil-ami.html?uid=${fid}'"><div class="avatar-mini">${avatar(u.photoProfil,(u.prenom||"?").charAt(0))}</div><div style="font-size:14px;font-weight:600">${u.nomComplet||""}</div></div>`;
    box.innerHTML+=html; full.innerHTML+=html;
  }
});
</script>
</body>
</html>
