<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Notifications</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0F0F14;color:#fff;min-height:100vh}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--carte:#1C1C24;--gris:#A1A1AA;--ligne:#2A2A35}
header{background:#111;position:sticky;top:0;z-index:30;border-bottom:2px solid var(--or)}
.top-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;font-size:22px;cursor:pointer;flex:1;white-space:nowrap}
.logo span{width:36px;height:36px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo i{color:var(--or);font-style:normal}
.icon-top{width:40px;height:40px;background:#2A2A35;border:none;border-radius:50%;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.icon-top.menu{background:linear-gradient(135deg,var(--violet),var(--violet2))}
.nav-top{display:flex;justify-content:space-between;padding:2px 6px 6px}
.nav-top a{flex:1;text-decoration:none;color:#A1A1AA;display:flex;align-items:center;justify-content:center;padding:8px 2px;position:relative;font-size:24px;border-bottom:3px solid transparent}
.nav-top a.active{color:var(--or);border-bottom:3px solid var(--or)}
.nav-top a .badge{position:absolute;top:1px;right:50%;transform:translateX(18px);background:#E0245E;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;min-width:20px;text-align:center;border:2px solid #111;display:none}
.nav-top a .badge.or{background:var(--or);color:#111}
.wrap{max-width:700px;margin:14px auto;padding:0 10px 40px}
.head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.head h1{font-size:26px}
.btn-lu{background:#2A2A35;color:#fff;border:none;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:var(--carte);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid var(--ligne);font-size:13px;flex-shrink:0}
.tabs button.active{background:linear-gradient(135deg,var(--violet),var(--violet2))}
.list{display:flex;flex-direction:column;gap:10px}
.notif{display:flex;gap:12px;background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:12px;align-items:flex-start}
.notif.nonlue{border-color:var(--violet);background:#221A35}
.notif .avatar{width:48px;height:48px;min-width:48px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;cursor:pointer;flex-shrink:0}
.notif .avatar img{width:100%;height:100%;object-fit:cover}
.notif .info{flex:1;min-width:0}
.notif .info b{font-size:14.5px;display:block;cursor:pointer}
.notif .info p{font-size:13.5px;color:#EDEDEF;line-height:1.4;margin:2px 0}
.notif .info small{font-size:11px;color:var(--gris)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{border:none;padding:7px 12px;border-radius:999px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
.btn-accepter{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff}
.btn-refuser{background:#2A2A35;color:#fff}
.btn-profil{background:#2A2A35;color:#fff;border:1px solid var(--ligne)}
.btn-msg{background:linear-gradient(135deg,var(--or),#FF9800);color:#111}
.btn-voir{background:#2A2A35;color:#fff}
.empty{text-align:center;color:var(--gris);padding:40px 10px;background:var(--carte);border-radius:16px}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>
<header>
  <div class="top-bar"><div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div><button class="icon-top" onclick="location.href='recherche.html'">🔍</button><button class="icon-top menu" onclick="location.href='feed.html'">☰</button></div>
  <nav class="nav-top">
    <a href="feed.html">🏠<span class="badge or" id="badgeFeed"></span></a>
    <a href="amis.html">👥<span class="badge" id="badgeAmis"></span></a>
    <a href="messages.html">💬<span class="badge" id="badgeMsg"></span></a>
    <a href="videos.html">🎥<span class="badge or" id="badgeVideos"></span></a>
    <a href="notifications.html" class="active">🔔<span class="badge" id="badgeNotif"></span></a>
    <a href="marketplace.html">🛒<span class="badge" id="badgeMarket"></span></a>
  </nav>
</header>
<div class="wrap">
<div class="head"><h1>Notifications</h1><button class="btn-lu" onclick="toutLire()">Tout marquer comme lu</button></div>
<div class="tabs">
<button id="tab-toutes" class="active" onclick="showTab('toutes')">Toutes</button>
<button id="tab-nonlues" onclick="showTab('nonlues')">Non lues</button>
<button id="tab-demandes" onclick="showTab('demandes')">Demandes d'ami</button>
<button id="tab-messages" onclick="showTab('messages')">Messages</button>
</div>
<div class="list" id="notifList"></div>
<div class="empty" id="emptyNotif" style="display:none"><div style="font-size:40px">🔔</div><p>Aucune notification</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, remove, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
let toutesNotifs=[], tabActuel='toutes', usersCache={};
function setBadge(id,n){ const e=document.getElementById(id); if(!e) return; if(!n||n<=0){ e.style.display='none'; e.innerText=''; } else { e.style.display='block'; e.innerText = n>99 ? "99+" : n; } }
window.showTab=(t)=>{
  tabActuel=t;
  ['toutes','nonlues','demandes','messages'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active', x===t));
  rendre();
};
function avatarPour(n){
  const u = usersCache[n.deUid]||{};
  if(u.photoProfil) return `<img src="${u.photoProfil}">`;
  const lettre = (n.deNom||"?").charAt(0).toUpperCase();
  return lettre;
}
function rendre(){
  let list = [...toutesNotifs].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  if(tabActuel==='nonlues') list = list.filter(n=>!n.lu);
  if(tabActuel==='demandes') list = list.filter(n=>n.type==='demande');
  if(tabActuel==='messages') list = list.filter(n=>n.type==='message');
  const box=document.getElementById('notifList'); box.innerHTML="";
  document.getElementById('emptyNotif').style.display = list.length ? 'none' : 'block';
  list.forEach(n=>{
    const div=document.createElement('div');
    div.className='notif '+(n.lu?'':'nonlue');
    let btns="";
    // ✅ DEMANDE D'AMI : on utilise deUid, JAMAIS le nom
    if(n.type==='demande' && n.deUid){
      btns=`<div class="btns">
        <button class="btn-accepter" onclick="event.stopPropagation();accepterDemande('${n.deUid}','${n.id}')">✅ Accepter</button>
        <button class="btn-refuser" onclick="event.stopPropagation();refuserDemande('${n.deUid}','${n.id}')">Refuser</button>
        <button class="btn-profil" onclick="event.stopPropagation();voirProfil('${n.deUid}')">👤 Voir le profil</button>
        <button class="btn-msg" onclick="event.stopPropagation();ecrireMessage('${n.deUid}')">💬 Message</button>
      </div>`;
    } else if(n.type==='message' && n.deUid){
      btns=`<div class="btns"><button class="btn-msg" onclick="event.stopPropagation();ecrireMessage('${n.deUid}')">💬 Répondre</button><button class="btn-profil" onclick="event.stopPropagation();voirProfil('${n.deUid}')">👤 Voir le profil</button></div>`;
    } else if(n.deUid){
      btns=`<div class="btns"><button class="btn-profil" onclick="event.stopPropagation();voirProfil('${n.deUid}')">👤 Voir le profil</button></div>`;
    }
    div.innerHTML=`<div class="avatar" onclick="voirProfil('${n.deUid||''}')">${avatarPour(n)}</div><div class="info"><b onclick="voirProfil('${n.deUid||''}')">${n.deNom||"JASONBOOK"}</b><p>${n.texte||""}</p><small>${n.date||""}</small>${btns}</div>`;
    div.onclick=()=>{ if(n.deUid) voirProfil(n.deUid); };
    box.appendChild(div);
  });
  const nonLus = toutesNotifs.filter(n=>!n.lu).length;
  setBadge('badgeNotif', nonLus);
}
window.voirProfil=(targetUid)=>{
  if(!targetUid || targetUid==='undefined' || targetUid==='null'){ alert("Profil introuvable, réessaie."); return; }
  location.href='profil-ami.html?uid='+targetUid;
};
window.ecrireMessage=(targetUid)=>{
  if(!targetUid){ alert("Impossible d'écrire, profil introuvable."); return; }
  location.href='messages.html?uid='+targetUid;
};
// ✅ ACCEPTER - AVEC LE VRAI deUid
window.accepterDemande=async (fromUid, notifId)=>{
  if(!fromUid || fromUid==='undefined'){ alert("Erreur : on ne trouve pas qui a envoyé. Va dans Amis > Demandes reçues."); return; }
  try{
    // 1. On devient amis dans les 2 sens
    await set(ref(db,'jasonbook/amis/'+uid+'/'+fromUid), true);
    await set(ref(db,'jasonbook/amis/'+fromUid+'/'+uid), true);
    // 2. On supprime la demande - dans les 2 sens, même si la clé est différente
    await remove(ref(db,'jasonbook/demandes/'+uid+'/'+fromUid));
    await remove(ref(db,'jasonbook/demandesEnvoyees/'+fromUid+'/'+uid));
    // 3. On marque la notif comme lue + on dit que c'est accepté
    if(notifId) await update(ref(db,'jasonbook/notifications/'+uid+'/'+notifId),{lu:true});
    // 4. On prévient l'autre
    const nRef=push(ref(db,'jasonbook/notifications/'+fromUid));
    await set(nRef,{ type:"ami", texte:monNom+" a accepté ta demande d'ami", deUid:uid, deNom:monNom, date:new Date().toLocaleString(), timestamp:Date.now(), lu:false });
    alert("Vous êtes maintenant amis avec "+(usersCache[fromUid]?.nomComplet||"cette personne")+" ✅");
    // On va sur son profil pour lui écrire
    location.href='profil-ami.html?uid='+fromUid;
  }catch(e){ alert("Erreur : "+e.message); }
};
window.refuserDemande=async (fromUid, notifId)=>{
  if(!fromUid) return;
  if(!confirm("Refuser cette demande ?")) return;
  await remove(ref(db,'jasonbook/demandes/'+uid+'/'+fromUid));
  await remove(ref(db,'jasonbook/demandesEnvoyees/'+fromUid+'/'+uid));
  if(notifId) await update(ref(db,'jasonbook/notifications/'+uid+'/'+notifId),{lu:true});
};
window.toutLire=async ()=>{
  for(const n of toutesNotifs){ await update(ref(db,'jasonbook/notifications/'+uid+'/'+n.id),{lu:true}); }
};
onValue(ref(db,'jasonbook/users'), s=>{
  const d=s.val()||{}; usersCache=d; rendre();
});
onValue(ref(db,'jasonbook/notifications/'+uid), s=>{
  const d=s.val()||{};
  toutesNotifs = Object.entries(d).map(([id,n])=>({id, timestamp: n.timestamp||0, ...n}));
  rendre();
});
onValue(ref(db,'jasonbook/demandes/'+uid), s=>{ const d=s.val(); setBadge('badgeAmis', d?Object.keys(d).length:0); });
onValue(ref(db,'jasonbook/messages'), s=>{
  const d=s.val(); let n=0;
  if(d) Object.values(d).forEach(chat=>{
    if(chat && typeof chat==='object') Object.values(chat).forEach(m=>{
      if(m && m.destinataireUid===uid && !m.lu) n++;
      if(m && m.pour===uid && !m.lu) n++;
    });
  });
  setBadge('badgeMsg', n);
});
setBadge('badgeMarket', 0); setBadge('badgeFeed', 0); setBadge('badgeVideos', 0);
</script>
</body>
</html>
