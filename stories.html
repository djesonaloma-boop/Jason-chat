<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JASONBOOK ✨ - Statuts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#000;color:#fff;min-height:100vh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:10px 12px;background:linear-gradient(to bottom, rgba(0,0,0,.8), transparent);display:flex;flex-direction:column;gap:8px}
.progress{display:flex;gap:4px}
.progress div{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.progress div i{display:block;height:100%;background:#FFC107;width:0%}
.head{display:flex;gap:10px;align-items:center}
.head .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#FFC107);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;overflow:hidden;flex-shrink:0}
.head .ava img{width:100%;height:100%;object-fit:cover}
.head b{font-size:15px}
.head small{color:#ccc;font-size:11px;display:block}
.head button{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
.viewer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.viewer img, .viewer video{width:100%;height:100%;object-fit:contain;max-height:100vh}
.viewer .texte{position:absolute;bottom:100px;left:16px;right:16px;text-align:center;font-size:18px;text-shadow:0 2px 8px #000;line-height:1.4}
.zone-gauche,.zone-droite{position:fixed;top:0;bottom:80px;width:35%;z-index:10}
.zone-gauche{left:0}
.zone-droite{right:0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:12px;background:linear-gradient(to top, rgba(0,0,0,.8), transparent);display:flex;gap:8px;align-items:center}
.bottom input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:11px 14px;color:#fff;outline:none}
.bottom button{background:#FFC107;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:800;color:#111}
.liste{position:fixed;inset:0;background:#0A0A0F;z-index:30;overflow-y:auto;padding:14px;display:none}
.liste.open{display:block}
.liste h2{font-size:20px;margin-bottom:12px}
.user-row{display:flex;gap:10px;align-items:center;background:#16161F;border:1px solid #26262F;border-radius:14px;padding:10px;margin-bottom:8px}
.user-row .ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#FFC107);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;flex-shrink:0}
.user-row .ava img{width:100%;height:100%;object-fit:cover}
.user-row b{font-size:14px}
.user-row small{color:#A1A1AA;font-size:11px;display:block}
</style>
</head>
<body>

<div class="viewer" id="viewer">
  <div style="text-align:center;color:#888">⏳ Chargement du statut...</div>
</div>

<div class="top">
  <div class="progress" id="progress"></div>
  <div class="head">
    <div class="ava" id="ava">?</div>
    <div style="flex:1"><b id="nom">...</b><small id="temps">...</small></div>
    <button onclick="location.href='feed.html'">✕</button>
  </div>
</div>

<div class="zone-gauche" onclick="precedent()"></div>
<div class="zone-droite" onclick="suivant()"></div>

<div class="bottom">
  <input id="reponse" placeholder="Répondre à ce statut..." onkeydown="if(event.key==='Enter')repondre()">
  <button onclick="repondre()">❤️</button>
</div>

<!-- Liste si on arrive sans auteur précis -->
<div class="liste" id="liste">
  <h2>📸 Statuts</h2>
  <div id="listeUsers"></div>
  <button onclick="location.href='feed.html'" style="width:100%;background:#26262F;border:none;color:#fff;padding:12px;border-radius:12px;margin-top:10px">← Retour</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,get,push,set} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const db=getDatabase(initializeApp(cfg));
const uid=localStorage.getItem("jasonbook_uid");
const monNom=localStorage.getItem("jasonbook_nom")||"Moi";
const maPhoto=localStorage.getItem("jasonbook_photo")||"";
const params=new URLSearchParams(location.search);
let auteurDemande=params.get('uid')||params.get('auteur')||"";
let groupes=[]; // [{auteurUid, nom, photo, stories:[]}]
let indexGroupe=0, indexStory=0;
let usersCache={};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tempsDepuis(ts){ if(!ts) return ""; const d=Date.now()-ts; if(d<60000) return "À l'instant"; if(d<3600000) return Math.floor(d/60000)+" min"; if(d<86400000) return Math.floor(d/3600000)+" h"; return Math.floor(d/86400000)+" j"; }

async function charger(){
  const snap=await get(ref(db,'jasonbook/stories'));
  const data=snap.val()||{};
  const now=Date.now();
  const parAuteur={};
  // ✅ On récupère aussi la photo du profil si le statut n'en a pas
  const snapUsers=await get(ref(db,'jasonbook/users'));
  usersCache=snapUsers.val()||{};

  Object.entries(data).forEach(([id,s])=>{
    if(!s || (s.expire||0) <= now) return;
    if(!parAuteur[s.auteurUid]) parAuteur[s.auteurUid]=[];
    parAuteur[s.auteurUid].push({id,...s});
  });

  groupes=Object.entries(parAuteur).map(([auteurUid, list])=>{
    list.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const premier=list[0];
    // ✅ LA CORRECTION : si photoAuteur est vide, on prend la photo du profil de l'utilisateur
    const profil=usersCache[auteurUid]||{};
    const photo = premier.photoAuteur || premier.photo || profil.photo || profil.photoUrl || "";
    const nom = premier.auteurNom || premier.nom || profil.nom || "Utilisateur";
    return {auteurUid, nom, photo, stories:list};
  });

  // Si on a cliqué sur bety, on commence par elle
  if(auteurDemande){
    const idx=groupes.findIndex(g=>g.auteurUid===auteurDemande);
    if(idx>=0) indexGroupe=idx;
  }

  if(!groupes.length){
    document.getElementById('viewer').innerHTML='<div style="text-align:center;color:#888">Aucun statut pour le moment.<br><br><button onclick="location.href=\'feed.html\'" style="background:#FFC107;border:none;padding:12px 20px;border-radius:999px;font-weight:800">Retour</button></div>';
    return;
  }

  // Si on arrive sans auteur, on montre la liste pour choisir
  if(!auteurDemande){
    afficherListe();
  } else {
    afficher();
  }
}

function afficherListe(){
  const liste=document.getElementById('liste');
  liste.classList.add('open');
  const box=document.getElementById('listeUsers');
  box.innerHTML="";
  groupes.forEach((g,i)=>{
    const div=document.createElement('div');
    div.className='user-row';
    div.innerHTML=`<div class="ava">${g.photo?`<img src="${esc(g.photo)}">`:esc(g.nom.charAt(0))}</div><div style="flex:1"><b>${esc(g.nom)}</b><small>${g.stories.length} statut(s) • ${tempsDepuis(g.stories[0].timestamp)}</small></div><span>›</span>`;
    div.onclick=()=>{ auteurDemande=g.auteurUid; indexGroupe=i; indexStory=0; liste.classList.remove('open'); afficher(); };
    box.appendChild(div);
  });
}

function afficher(){
  const g=groupes[indexGroupe];
  if(!g) return;
  const s=g.stories[indexStory];
  if(!s) return;
  // Barre de progression
  const prog=document.getElementById('progress');
  prog.innerHTML=g.stories.map((_,i)=>`<div><i style="width:${i<indexStory?100:i===indexStory?100:0}%"></i></div>`).join("");
  document.getElementById('ava').innerHTML = g.photo ? `<img src="${esc(g.photo)}">` : esc(g.nom.charAt(0));
  document.getElementById('nom').innerText=g.nom;
  document.getElementById('temps').innerText=tempsDepuis(s.timestamp);
  const viewer=document.getElementById('viewer');
  // ✅ C'EST ICI QU'ON VOIT LA PHOTO EN GRAND
  const mediaUrl = s.photoUrl || s.image || s.photo || s.videoUrl || "";
  if(s.videoUrl || s.video){
    viewer.innerHTML=`<video src="${esc(mediaUrl)}" autoplay controls playsinline></video><div class="texte">${esc(s.texte||"")}</div>`;
  } else if(mediaUrl){
    viewer.innerHTML=`<img src="${esc(mediaUrl)}"><div class="texte">${esc(s.texte||"")}</div>`;
  } else {
    viewer.innerHTML=`<div style="padding:20px;text-align:center;font-size:22px">${esc(s.texte||"Aucune photo")}</div>`;
  }
}

window.suivant=()=>{
  const g=groupes[indexGroupe];
  if(indexStory < g.stories.length-1){ indexStory++; afficher(); }
  else if(indexGroupe < groupes.length-1){ indexGroupe++; indexStory=0; afficher(); }
  else { location.href='feed.html'; }
};
window.precedent=()=>{
  if(indexStory>0){ indexStory--; afficher(); }
  else if(indexGroupe>0){ indexGroupe--; indexStory=groupes[indexGroupe].stories.length-1; afficher(); }
};
window.repondre=async ()=>{
  const txt=document.getElementById('reponse').value.trim();
  const g=groupes[indexGroupe];
  if(!g) return;
  if(g.auteurUid===uid){ alert("C'est ton propre statut"); return; }
  const n=push(ref(db,'jasonbook/notifications/'+g.auteurUid));
  await set(n,{type:"statut", texte:monNom+" a réagi à ton statut : "+(txt||"❤️"), deUid:uid, deNom:monNom, date:new Date().toLocaleString(), timestamp:Date.now(), lu:false});
  document.getElementById('reponse').value="";
  alert("Réponse envoyée à "+g.nom+" ❤️");
};
charger();
</script>
</body>
</html>
