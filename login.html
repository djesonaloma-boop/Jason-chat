<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JASON FACE - Connexion</title>
<style>
:root{--bg:#050914;--card:#0f1c32;--border:rgba(255,255,255,.09);--text:#eef3ff;--muted:#8da2bc;--blue:#1877f2;--blue2:#00c8ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at top,rgba(0,140,255,.15),transparent 55%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.wrap{width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:center}
.left h1{font-size:54px;font-weight:900;line-height:.9}.left h1 b{color:var(--blue)}.left h1 span{color:var(--blue2)}
.left p{margin-top:18px;color:var(--muted);font-size:18px;line-height:1.5;max-width:420px}
.card{background:linear-gradient(180deg,#101d35,#0c152a);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 20px 80px #0006}
.input{width:100%;background:#13203c;border:1px solid var(--border);border-radius:12px;padding:14px 14px;color:white;outline:none;margin-bottom:12px;font-size:15px}
.input:focus{border-color:var(--blue)}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:15px;cursor:pointer}
.btn-blue{background:var(--blue);color:white}.btn-green{background:#23c55e;color:white;margin-top:16px}
.divider{height:1px;background:var(--border);margin:18px 0}
.small{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin-top:12px}
.error{color:#ff6b6b;font-size:12px;min-height:18px;text-align:center;margin-top:8px}
.logo{font-weight:900;font-size:26px;margin-bottom:20px}.logo b{color:var(--blue)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.left h1{font-size:40px}.left{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="left">
  <h1>JASON <b>FACE</b><br><span>Biso</span></h1>
  <p>Avec JASON FACE, restez en contact avec vos proches, partagez vos moments et découvrez ce qui se passe à Kinshasa.</p>
 </div>
 <div class="card">
  <div class="logo">JASON <b>FACE</b></div>
  <input id="phone" class="input" type="tel" placeholder="Numéro de téléphone (ex: 082...)" autocomplete="tel">
  <input id="password" class="input" type="password" placeholder="Mot de passe">
  <button class="btn btn-blue" id="loginBtn">Se connecter</button>
  <div id="error" class="error"></div>
  <div style="text-align:center;margin-top:12px"><a href="#" style="color:var(--blue2);font-size:13px;text-decoration:none">Mot de passe oublié?</a></div>
  <div class="divider"></div>
  <button class="btn btn-green" onclick="location.href='/register.html'">Créer nouveau compte</button>
  <div class="small">En te connectant, tu acceptes que tes données soient stockées dans Firebase jasonBusiness/users/{telephone}<br><b>Code admin: 10092007</b></div>
 </div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

async function doLogin(){
  const phone=$("phone").value.trim(); const pass=$("password").value.trim(); const err=$("error");
  if(!phone||!pass){ err.textContent="Remplis téléphone et mot de passe"; return; }
  err.textContent="Connexion...";
  try{
    const snap=await get(ref(db, `jasonBusiness/users/${phone}`));
    if(!snap.exists()){ err.textContent="❌ Numéro non trouvé - Crée un compte"; return; }
    const data=snap.val()||{};
    const realPass=String(data.mot_de_passe||data.password||data.pass||"");
    if(realPass && realPass!==pass){ err.textContent="❌ Mot de passe incorrect"; return; }
    // OK
    localStorage.setItem("jasonBusinessUserPhone", phone);
    localStorage.setItem("userPhone", phone);
    localStorage.setItem("telephone", phone);
    localStorage.setItem("jasonBusinessUserName", data.nom||data.name||phone);
    localStorage.setItem("nom", data.nom||data.name||phone);
    err.textContent="✅ Connecté";
    location.href="/";
  }catch(e){ err.textContent="Erreur: "+e.message; }
}
$("loginBtn").onclick=doLogin;
$("password").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
