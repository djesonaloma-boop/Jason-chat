
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a14">
<title>Connexion — JASON BUSINESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#102644,#050a14 65%);color:#f5f7fb;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:#0c1525;border:1px solid #26364b;border-radius:22px;padding:25px}
.logo{width:54px;height:54px;display:grid;place-items:center;background:#00d4ff;color:#06111e;border-radius:16px;font-size:24px;font-weight:900}
h1{font-size:25px;margin-bottom:8px}
p{color:#9aa8bd;line-height:1.5}
input{width:100%;padding:14px;margin:8px 0;background:#07101e;border:1px solid #2b3a50;border-radius:11px;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(90deg,#00d4ff,#58a9ff);font-weight:800}
a{color:#d8aa45}
#message{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<main class="card">
<div class="logo">JB</div>
<h1>Connexion</h1>
<p>Connecte-toi à ton espace JASON BUSINESS.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Adresse Gmail" autocomplete="email" required>
<input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Se connecter</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="#" id="reset">Mot de passe oublié ?</a></p>
<p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const btn = document.getElementById("loginBtn");

function showMessage(text, ok=false) {
  message.textContent = text;
  message.style.color = ok ? "#4ade80" : "#ff8d8d";
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = "Connexion...";
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value.trim().toLowerCase(),
      document.getElementById("password").value
    );
    showMessage("Connexion réussie !", true);
    location.replace("dashboard.html");
  } catch (error) {
    const errors = {
      "auth/invalid-credential": "Adresse Gmail ou mot de passe incorrect.",
      "auth/user-not-found": "Aucun compte trouvé pour cette adresse.",
      "auth/wrong-password": "Mot de passe incorrect.",
      "auth/invalid-email": "Adresse Gmail invalide.",
      "auth/too-many-requests": "Trop de tentatives. Réessaie plus tard.",
      "auth/network-request-failed": "Vérifie ta connexion Internet."
    };
    showMessage(errors[error.code] || error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Se connecter";
  }
});

document.getElementById("reset").addEventListener("click", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim().toLowerCase();
  if (!email) return showMessage("Entre ton adresse Gmail d'abord.");
  try {
    await auth.sendPasswordResetEmail(email);
    showMessage("Si l'adresse est valide, les instructions seront envoyées par e-mail.", true);
  } catch (error) {
    showMessage(error.message);
  }
});
</script>
</body>
</html>
