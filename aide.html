<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Aide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
/* ✅ MÊME SCROLL QUE LE PROFIL */
html{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw}
body{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
img,video{max-width:100%}
/* ✅ MÊMES COULEURS QUE LE PROFIL */
:root{--blue:#7C3AED;--blue2:#A855F7;--or:#FFC107;--bg:#0F0F14;--card:#1C1C24;--grey:#A1A1AA;--line:#2A2A35}
body{background:var(--bg);color:#fff;min-height:100vh}
header{background:#111;display:flex;align-items:center;gap:12px;padding:12px 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--or)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#fff;font-size:21px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo span{width:34px;height:34px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:var(--or);font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--or));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:700px;margin:16px auto;padding:0 12px 30px}
.wrap h1{font-size:23px;letter-spacing:-.3px;color:#fff}
.wrap .sub{color:var(--grey);margin:4px 0 14px;font-size:14px}
.search-help{width:100%;padding:13px 16px;border:none;border-radius:999px;outline:none;font-size:15px;margin-bottom:14px;background:#2A2A35;color:#fff}
.search-help::placeholder{color:#888}
.search-help:focus{box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:none;background:#2A2A35;color:#fff;padding:10px 15px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px}
.cats button.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.faq{background:var(--card);border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer}
.faq.open{border-color:var(--blue)}
.faq b{font-size:15px;line-height:1.4;display:block;padding-right:28px;color:#fff}
.faq p{font-size:14px;color:#EDEDEF;margin-top:10px;display:none;white-space:pre-wrap;line-height:1.6;background:#2A2A35;padding:11px 12px;border-radius:10px}
.faq.open p{display:block}
.faq .arrow{float:right;color:var(--grey);font-size:12px;width:26px;height:26px;background:#2A2A35;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px}
.faq.open .arrow{transform:rotate(180deg);background:var(--blue);color:#fff}
.contact-box{background:var(--card);border-radius:14px;padding:20px;margin-top:16px;border:1px solid var(--line)}
.contact-box h3{margin-bottom:6px;color:#fff}
.contact-box p{font-size:14px;color:var(--grey)}
.contact-box textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;font-size:14px;min-height:80px;outline:none;resize:vertical;background:#2A2A35;color:#fff}
.contact-box textarea::placeholder{color:#888}
.contact-box textarea:focus{border-color:var(--blue);background:#2A2A35}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;padding:12px;border-radius:999px;font-weight:800;cursor:pointer;width:100%}
.empty{text-align:center;color:var(--grey);padding:30px 10px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>

<!-- ✅ HEADER : JUSTE JASONBOOK, PLUS DE 🔍 🔔 💬 👤 -->
<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
</header>

<div class="wrap">
<h1>Centre d'aide</h1>
<p class="sub">Comment pouvons-nous t'aider ?</p>
<input class="search-help" id="searchHelp" placeholder="🔍 Rechercher dans l'aide... (ex: mot de passe, bloquer...)" oninput="rendre()">
<div class="cats">
<button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button>
<button id="cat-Compte" onclick="setCat('Compte')">👤 Compte</button>
<button id="cat-Publication" onclick="setCat('Publication')">📝 Publication</button>
<button id="cat-Amis" onclick="setCat('Amis')">👥 Amis</button>
<button id="cat-Confidentialité" onclick="setCat('Confidentialité')">🔒 Confidentialité</button>
<button id="cat-Technique" onclick="setCat('Technique')">🔧 Technique</button>
</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><h3>Aucun résultat</h3><p>Essaie un autre mot-clé ou contacte-nous ci-dessous.</p></div>

<div class="contact-box">
<h3>💬 Nous contacter</h3>
<p>Tu n'as pas trouvé ta réponse ? Envoie-nous un message.</p>
<textarea id="msgContact" placeholder="Décris ton problème..."></textarea>
<button class="btn-blue" style="margin-top:10px" onclick="envoyerContact()">Envoyer le message</button>
</div>
</div>

<!-- ✅ PLUS DE BARRE EN BAS : SUPPRIMÉ 🏠 👥 ➕ ❓ 👤 -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const myAv=document.getElementById('myAvatar');
if(myAv) myAv.innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
const FAQS=[
{cat:'Compte',q:"Comment changer mon nom ?",r:"Va dans Paramètres ⚙️ > Mon compte > Nom complet, modifie ton nom puis clique sur Enregistrer."},
{cat:'Compte',q:"J'ai oublié mon mot de passe, que faire ?",r:"Sur la page de connexion, clique sur 'Mot de passe oublié ?'. Si tu t'es inscrit avec ton téléphone, reconnecte-toi avec ton numéro."},
{cat:'Compte',q:"Comment supprimer mon compte ?",r:"Va dans Paramètres ⚙️ > Zone dangereuse > Supprimer mon compte. Attention : cette action est définitive !"},
{cat:'Compte',q:"Comment changer ma photo de profil ?",r:"Va sur ton Profil > clique sur ta photo > choisis une nouvelle photo."},
{cat:'Publication',q:"Comment publier un post ?",r:"Clique sur le bouton ➕ en bas ou sur 'Créer un post' dans le fil d'actualité. Écris ton texte, ajoute une photo si tu veux, puis Publier."},
{cat:'Publication',q:"Comment supprimer un post ?",r:"Sur ton post, clique sur les 3 points ⋯ puis Supprimer. Seul l'auteur peut supprimer son post."},
{cat:'Publication',q:"Comment publier une story ?",r:"Va dans Stories ✨ > Ma story > choisis une photo ou vidéo. Ta story disparaît après 24h."},
{cat:'Amis',q:"Comment ajouter un ami ?",r:"Va dans Recherche 🔍 ou Amis 👥, trouve la personne et clique sur 'Ajouter'."},
{cat:'Amis',q:"Comment bloquer quelqu'un ?",r:"Va sur le profil de la personne > clique sur Bloquer. La personne ne pourra plus voir tes posts ni t'écrire."},
{cat:'Amis',q:"Comment voir les demandes d'amis ?",r:"Va dans Amis 👥 > onglet Demandes reçues."},
{cat:'Confidentialité',q:"Comment rendre mon profil privé ?",r:"Va dans Paramètres ⚙️ > Confidentialité > désactive 'Profil public'."},
{cat:'Confidentialité',q:"Qui peut voir mes posts ?",r:"Par défaut tout le monde. Tu peux rendre ton profil privé dans Paramètres pour limiter la visibilité à tes amis."},
{cat:'Confidentialité',q:"Comment signaler un contenu ?",r:"Clique sur Signaler sur le post ou le profil. Notre équipe va examiner le signalement."},
{cat:'Technique',q:"L'application est lente, que faire ?",r:"Vérifie ta connexion internet, ferme et rouvre l'app, vide le cache de ton navigateur."},
{cat:'Technique',q:"Mes notifications ne marchent pas",r:"Va dans Paramètres ⚙️ > Notifications et vérifie que les interrupteurs sont activés."},
{cat:'Technique',q:"Je ne peux pas envoyer de message",r:"Vérifie que tu es ami avec la personne ou que ses paramètres autorisent les messages de tout le monde."},
];
let cat='Tout';
window.setCat=(c)=>{ cat=c; ['Tout','Compte','Publication','Amis','Confidentialité','Technique'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
function rendre(){
  const q=(document.getElementById('searchHelp').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=FAQS.filter(f=> (cat==='Tout'||f.cat===cat) && (f.q+" "+f.r).toLowerCase().includes(q));
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach((f,i)=>{
    const div=document.createElement('div'); div.className='faq';
    div.innerHTML=`<b>${f.q}</b><span class="arrow">▼</span><p>${f.r}</p>`;
    div.onclick=()=>div.classList.toggle('open');
    box.appendChild(div);
  });
}
rendre();
window.envoyerContact=async()=>{
  const msg=document.getElementById('msgContact').value.trim();
  if(!msg){ alert("Écris ton message d'abord"); return; }
  const newRef=push(ref(db,'jasonbook/aideMessages'));
  await set(newRef,{ id:newRef.key, auteurUid:uid, auteurNom:monNom, message:msg, date:new Date().toLocaleString(), timestamp:Date.now(), statut:'nouveau' });
  document.getElementById('msgContact').value="";
  alert("Message envoyé ! ✅ On te répondra très vite.");
};
</script>
</body>
</html>
