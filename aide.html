<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Aide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--blue:#1877F2;--blue2:#0d5fd6;--bg:#eef2f7;--grey:#65676b}
body{background:var(--bg);min-height:100vh}
header{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 10px rgba(0,0,0,.07)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.5px}
.logo span{width:34px;height:34px;background:linear-gradient(135deg,#1877F2,#0d5fd6);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(24,119,242,.35)}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
header .search:focus{background:#fff;box-shadow:0 0 0 3px rgba(24,119,242,.12)}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px;transition:.2s}
.icons a:hover{background:#e4e6eb}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1877F2,#7a3cff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:700px;margin:16px auto;padding:0 12px}
.wrap h1{font-size:24px;margin-bottom:4px;letter-spacing:-.5px}
.wrap .sub{color:var(--grey);margin-bottom:14px;font-size:14px}
.search-help{width:100%;padding:13px 16px;border:1px solid #eef0f3;border-radius:999px;outline:none;font-size:15px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);background:#fff}
.search-help:focus{box-shadow:0 0 0 3px rgba(24,119,242,.12);border-color:var(--blue)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:none;background:#fff;padding:10px 15px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:.2s}
.cats button:hover{background:#e7f0ff}
.cats button.active{background:linear-gradient(135deg,#1877F2,#0d5fd6);color:#fff;box-shadow:0 4px 12px rgba(24,119,242,.3)}
.faq{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid #eef0f3;cursor:pointer;transition:.2s}
.faq:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.faq.open{border-color:#cfe0ff;box-shadow:0 4px 14px rgba(24,119,242,.08)}
.faq b{font-size:15px;line-height:1.4;display:block;padding-right:24px}
.faq p{font-size:14px;color:#555;margin-top:10px;display:none;white-space:pre-wrap;line-height:1.6;background:#f8f9fa;padding:11px 12px;border-radius:10px}
.faq.open p{display:block}
.faq .arrow{float:right;color:var(--grey);font-size:12px;transition:.25s;width:26px;height:26px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px}
.faq.open .arrow{transform:rotate(180deg);background:#e7f0ff;color:var(--blue)}
.contact-box{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid #eef0f3}
.contact-box h3{margin-bottom:6px}
.contact-box p{font-size:14px;color:var(--grey)}
.contact-box textarea{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:12px;margin-top:10px;font-size:14px;min-height:80px;outline:none;resize:vertical;background:#f8f9fa}
.contact-box textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(24,119,242,.10)}
.btn-blue{background:linear-gradient(135deg,#1877F2,#0d5fd6);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer;width:100%;box-shadow:0 6px 16px rgba(24,119,242,.25);transition:.2s}
.btn-blue:hover{transform:translateY(-1px)}
.empty{text-align:center;color:var(--grey);padding:30px 10px;background:#fff;border-radius:14px;border:1px solid #eef0f3}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);justify-content:space-around;padding:12px;box-shadow:0 -1px 10px rgba(0,0,0,.08);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<h1>❓ Centre d'aide</h1>
<p class="sub">Comment pouvons-nous t'aider ?</p>
<input class="search-help" id="searchHelp" placeholder="🔍 Rechercher dans l'aide... (ex: mot de passe, bloquer...)" oninput="rendre()">
<div class="cats">
<button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button>
<button id="cat-Compte" onclick="setCat('Compte')">👤 Compte</button>
<button id="cat-Publication" onclick="setCat('Publication')">📝 Publication</button>
<button id="cat-Amis" onclick="setCat('Amis')">👥 Amis</button>
<button id="cat-Confidentialité" onclick="setCat('Confidentialité')">🔒 Confidentialité</button>
<button id="cat-Technique" onclick="setCat('Technique')">🔧 Technique</button>
</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><h3>Aucun résultat</h3><p>Essaie un autre mot-clé ou contacte-nous ci-dessous.</p></div>

<div class="contact-box">
<h3>💬 Nous contacter</h3>
<p>Tu n'as pas trouvé ta réponse ? Envoie-nous un message.</p>
<textarea id="msgContact" placeholder="Décris ton problème..."></textarea>
<button class="btn-blue" style="margin-top:10px" onclick="envoyerContact()">Envoyer le message</button>
</div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="aide.html">❓</a><a href="profil.html">👤</a></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
const FAQS=[
{cat:'Compte',q:"Comment changer mon nom ?",r:"Va dans Paramètres ⚙️ > Mon compte > Nom complet, modifie ton nom puis clique sur Enregistrer."},
{cat:'Compte',q:"J'ai oublié mon mot de passe, que faire ?",r:"Sur la page de connexion, clique sur 'Mot de passe oublié ?'. Si tu t'es inscrit avec ton téléphone, reconnecte-toi avec ton numéro."},
{cat:'Compte',q:"Comment supprimer mon compte ?",r:"Va dans Paramètres ⚙️ > Zone dangereuse > Supprimer mon compte. Attention : cette action est définitive !"},
{cat:'Compte',q:"Comment changer ma photo de profil ?",r:"Va sur ton Profil > clique sur ta photo > choisis une nouvelle photo."},
{cat:'Publication',q:"Comment publier un post ?",r:"Clique sur le bouton ➕ en bas ou sur 'Créer un post' dans le fil d'actualité. Écris ton texte, ajoute une photo si tu veux, puis Publier."},
{cat:'Publication',q:"Comment supprimer un post ?",r:"Sur ton post, clique sur les 3 points ⋯ puis Supprimer. Seul l'auteur peut supprimer son post."},
{cat:'Publication',q:"Comment publier une story ?",r:"Va dans Stories ✨ > Ma story > choisis une photo ou vidéo. Ta story disparaît après 24h."},
{cat:'Amis',q:"Comment ajouter un ami ?",r:"Va dans Recherche 🔍 ou Amis 👥, trouve la personne et clique sur 'Ajouter'."},
{cat:'Amis',q:"Comment bloquer quelqu'un ?",r:"Va sur le profil de la personne > clique sur Bloquer. La personne ne pourra plus voir tes posts ni t'écrire."},
{cat:'Amis',q:"Comment voir les demandes d'amis ?",r:"Va dans Amis 👥 > onglet Demandes reçues."},
{cat:'Confidentialité',q:"Comment rendre mon profil privé ?",r:"Va dans Paramètres ⚙️ > Confidentialité > désactive 'Profil public'."},
{cat:'Confidentialité',q:"Qui peut voir mes posts ?",r:"Par défaut tout le monde. Tu peux rendre ton profil privé dans Paramètres pour limiter la visibilité à tes amis."},
{cat:'Confidentialité',q:"Comment signaler un contenu ?",r:"Clique sur Signaler sur le post ou le profil. Notre équipe va examiner le signalement."},
{cat:'Technique',q:"L'application est lente, que faire ?",r:"Vérifie ta connexion internet, ferme et rouvre l'app, vide le cache de ton navigateur."},
{cat:'Technique',q:"Mes notifications ne marchent pas",r:"Va dans Paramètres ⚙️ > Notifications et vérifie que les interrupteurs sont activés."},
{cat:'Technique',q:"Je ne peux pas envoyer de message",r:"Vérifie que tu es ami avec la personne ou que ses paramètres autorisent les messages de tout le monde."},
];
let cat='Tout';
window.setCat=(c)=>{ cat=c; ['Tout','Compte','Publication','Amis','Confidentialité','Technique'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
function rendre(){
  const q=(document.getElementById('searchHelp').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=FAQS.filter(f=> (cat==='Tout'||f.cat===cat) && (f.q+" "+f.r).toLowerCase().includes(q));
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach((f,i)=>{
    const div=document.createElement('div'); div.className='faq';
    div.innerHTML=`<b>${f.q}</b><span class="arrow">▼</span><p>${f.r}</p>`;
    div.onclick=()=>div.classList.toggle('open');
    box.appendChild(div);
  });
}
rendre();
window.envoyerContact=async()=>{
  const msg=document.getElementById('msgContact').value.trim();
  if(!msg){ alert("Écris ton message d'abord"); return; }
  const newRef=push(ref(db,'jasonbook/aideMessages'));
  await set(newRef,{ id:newRef.key, auteurUid:uid, auteurNom:monNom, message:msg, date:new Date().toLocaleString(), timestamp:Date.now(), statut:'nouveau' });
  document.getElementById('msgContact').value="";
  alert("Message envoyé ! ✅ On te répondra très vite.");
};
</script>
</body>
</html>
