<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK ✨ - Messages</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0A0A0F;color:#fff;overflow:hidden}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--carte:#16161F;--ligne:#26262F;--gris:#A1A1AA}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);padding:12px 14px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:900;white-space:nowrap}
.logo i{color:var(--or);font-style:normal}
.logo small{display:block;font-size:8px;color:var(--gris);letter-spacing:1.2px}
.top .spacer{flex:1}
.top button{width:40px;height:40px;border-radius:50%;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;font-size:18px;cursor:pointer}
.top .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;cursor:pointer}
.top .avatar img{width:100%;height:100%;object-fit:cover}
.layout{display:flex;height:calc(100dvh - 65px - 68px);min-height:0}
.list{width:360px;background:#0A0A0F;border-right:1px solid var(--ligne);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.list-head{padding:12px 14px 6px;display:flex;align-items:center;gap:10px}
.list-head h2{font-size:20px}
.list-head small{color:var(--gris)}
.list-head .btn-param-msg{width:42px;height:42px;min-width:42px;border-radius:50%;background:#1F1F2E;border:1px solid var(--ligne);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.search{margin:10px 14px;background:#1F1F2E;border:1px solid var(--ligne);border-radius:999px;padding:10px 14px;display:flex;gap:8px;align-items:center}
.search input{background:none;border:none;outline:none;color:#fff;width:100%;font-size:14px}
.search input::placeholder{color:#777}
.conv-list{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.conv{display:flex;gap:11px;padding:12px 14px;cursor:pointer;align-items:center;border-bottom:1px solid #1A1A22}
.conv:active,.conv.active{background:#1F1F2E}
.conv .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;position:relative}
.conv .avatar img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;bottom:0;right:0;width:13px;height:13px;background:#22C55E;border:2px solid #0A0A0F;border-radius:50%}
.conv b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{color:var(--gris);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.conv .right{margin-left:auto;text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:52px}
.conv .time{font-size:11px;color:#888;display:block;white-space:nowrap}
.unread{background:var(--or);color:#000;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:2px}
.chat{flex:1;display:flex;flex-direction:column;background:#0A0A0F;min-width:0;min-height:0;height:calc(100dvh - 65px - 68px)}
#chatContent{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-head{display:flex;gap:8px;align-items:center;padding:10px 10px;border-bottom:1px solid var(--ligne);background:#12121A;width:100%;flex-shrink:0}
.chat-head .back{font-size:22px;cursor:pointer;flex-shrink:0;padding:4px}
.chat-head .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0}
.chat-head .avatar img{width:100%;height:100%;object-fit:cover}
.chat-head .info{flex:1;min-width:0}
.chat-head b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head small{color:#22C55E;font-size:12px}
.chat-head .dots{width:44px;height:44px;min-width:44px;border-radius:50%;background:#2A2A35;border:2px solid #fff;color:#fff;font-size:26px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px #000;margin-left:auto}
.chat-head .dots:active{background:var(--violet)}
.chat-body{flex:1;min-height:0;overflow-y:auto !important;overflow-x:hidden;padding:16px 16px 90px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y !important;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg{max-width:82%;padding:10px 12px 6px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word;position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.msg.mine{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.other{background:#1F1F2E;color:#fff;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--ligne)}
.msg .txt{display:block}
.msg img{max-width:100%;border-radius:10px;margin-top:4px}
.msg .meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:4px;font-size:11px;opacity:.85}
.msg.mine .meta{color:#E9D5FF}
.msg.other .meta{color:#888}
.msg .tick{font-size:13px;font-weight:700;letter-spacing:-1px}
.msg .tick.lu{color:#FFC107}
.msg .msg-dots{display:none!important}
.msg .reply-box{background:rgba(0,0,0,.25);border-left:3px solid var(--or);padding:6px 8px;border-radius:8px;font-size:12px;margin-bottom:6px}
.msg .reply-box b{font-size:11px;color:var(--or)}
.msg .react-row{display:flex;gap:3px;margin-top:4px}
.msg .react-row span{background:#0008;padding:2px 6px;border-radius:999px;font-size:13px}
.voice{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:190px}
.voice button{width:38px;height:38px;min-width:38px;border-radius:50%;border:0;background:#fff;color:#111;font-size:15px;cursor:pointer;flex-shrink:0}
.msg.other .voice button{background:var(--or)}
.wave{display:flex;align-items:center;gap:2px;flex:1;height:32px;cursor:pointer}
.wave i{display:block;width:3px;border-radius:99px;background:rgba(255,255,255,.45);transition:height .15s, background .15s}
.msg.other .wave i{background:rgba(255,255,255,.35)}
.wave i.played{background:#FFC107!important}
.msg.other .wave i.played{background:#fff!important}
.wave.playing i{animation:zikzak .6s ease-in-out infinite alternate}
@keyframes zikzak{from{transform:scaleY(.7)}to{transform:scaleY(1.25)}}
.voice small{font-size:11px;white-space:nowrap}
.menu-top-chat{position:fixed;top:118px;right:10px;background:#1F1F2E;border:1px solid var(--ligne);border-radius:16px;width:260px;z-index:500;display:none;overflow:hidden;box-shadow:0 10px 30px #000}
.menu-top-chat.open{display:block}
.menu-top-chat button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#fff;text-align:left;padding:13px 14px;font-size:14px;cursor:pointer}
.menu-top-chat button:active{background:#2A2A35}
.menu-top-chat button.danger{color:#FF8A9A}
.menu-top-chat hr{border:0;height:1px;background:var(--ligne)}
.overlay-menu{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none}
.overlay-menu.open{display:block}
.menu-msg{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1F1F2E;border:1px solid var(--ligne);border-radius:18px;z-index:600;display:none;width:calc(100% - 24px);max-width:360px;padding:8px;box-shadow:0 10px 40px #000}
.menu-msg.open{display:block}
.menu-msg .reacts{display:flex;justify-content:space-around;padding:8px 4px;font-size:26px}
.menu-msg .reacts span{cursor:pointer;padding:6px}
.menu-msg button{display:flex;gap:10px;width:100%;background:none;border:0;color:#fff;text-align:left;padding:12px;font-size:14px;cursor:pointer;border-radius:12px}
.menu-msg button:active{background:#2A2A35}
.menu-msg button.danger{color:#FF8A9A}
.menu-msg button.retirer{background:#E0245E;color:#fff;font-weight:800;margin:6px 0}
.menu-msg button.retirer:active{background:#B91C47}
.reply-preview{display:none;gap:8px;align-items:center;background:#1F1F2E;border-left:3px solid var(--or);padding:8px 12px;margin:0 12px 6px;border-radius:0 10px 10px 0}
.reply-preview.show{display:flex}
.reply-preview b{font-size:12px;color:var(--or)}
.reply-preview small{display:block;color:#ccc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.reply-preview button{margin-left:auto;background:none;border:0;color:#fff;font-size:16px}
.rec-bar{display:none;gap:8px;align-items:center;background:#2A0A0A;border:1px solid #E0245E;padding:10px 12px;margin:0 12px 6px;border-radius:14px}
.rec-bar.show{display:flex}
.rec-bar .dot-rec{width:12px;height:12px;background:#E0245E;border-radius:50%;animation:pulse 1s infinite}
.rec-bar b{flex:1;font-size:13px}
.rec-bar button{border:0;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer}
.chat-input-wrap{position:fixed;bottom:0;left:0;right:0;z-index:99;padding:0 0 calc(0px + env(safe-area-inset-bottom));background:#12121A;border-top:1px solid var(--ligne)}
.chat-input{display:flex;gap:8px;align-items:center;padding:10px 12px}
.chat-input button{width:42px;height:42px;border:none;background:#2A2A35;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;color:#fff}
.chat-input button.send{background:linear-gradient(135deg,var(--violet),var(--or));color:#fff}
.chat-input input{flex:1;min-width:0;padding:12px 14px;background:#2A2A35;border:none;border-radius:999px;outline:none;font-size:15px;color:#fff}
.chat-input input::placeholder{color:#888}
.chat-input .rec.on{background:#E0245E;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gris);gap:10px;text-align:center;padding:20px}
.empty-chat .big{font-size:60px}
/* ✅ BOUTON FLOTTANT BOT EN BAS A DROITE */
.fab-bot{position:fixed;bottom:100px;right:16px;z-index:999;width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#7C3AED,#FFC107);color:#fff;font-size:30px;box-shadow:0 8px 25px rgba(124,58,237,.6);display:flex;align-items:center;justify-content:center}
.fab-bot:active{transform:scale(.92)}
.fab-bot .badge-bot{position:absolute;top:-2px;right:-2px;background:#E0245E;color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0A0A0F}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,10,15,.96);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ligne)}
body.chat-open .bottom{display:none!important}
body.chat-open .layout{height:100dvh;min-height:0}
body.chat-open .chat{height:100dvh;min-height:0}
body.chat-open .top{display:none}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px;font-weight:700}
.bottom button.active{color:var(--or)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--or));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F}
@media(max-width:800px){.list{width:100%}.list.hide-mob{display:none}.chat{display:none}.chat.show-mob{display:flex}.layout{height:calc(100dvh - 65px - 68px);min-height:0}body.chat-open .chat.show-mob{height:100dvh}}
</style>
</head>
<body>
<div class="top">
<div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
<div class="spacer"></div>
<button onclick="location.href='notifications.html'">🔔</button>
<div class="avatar" id="myAvatarTop" onclick="location.href='profil.html'">?</div>
</div>
<div class="layout">
<div class="list" id="listPanel">
<div class="list-head"><div style="flex:1;min-width:0"><h2>Messages 💬</h2><small>Discute avec tes amis</small></div><button class="btn-param-msg" onclick="location.href='parametres-messages.html'" title="Paramètres de messages">⚙️</button></div>
<div class="search">🔍 <input id="searchUser" placeholder="Rechercher un ami..." oninput="filtrer()"></div>
<div class="conv-list" id="convList"></div>
<div id="noConv" style="padding:20px;text-align:center;color:#A1A1AA;font-size:13px;display:none">Aucune conversation.<br>Cherche une personne et dis bonjour 👋</div>
</div>
<div class="chat" id="chatPanel">
<div class="empty-chat" id="emptyChat"><div class="big">💬</div><h3>Choisis une conversation</h3><p>Sélectionne un ami à gauche pour discuter.<br>Texte, photo et vocal.</p></div>
<div id="chatContent" style="display:none;flex:1;flex-direction:column">
<div class="chat-head"><span class="back" onclick="retourListe()">←</span><div class="avatar" id="chatAvatar">?</div><div class="info"><b id="chatNom"></b><br><small id="chatStatut">En ligne</small></div><button class="dots" onclick="ouvrirMenuTopChat(event)">⋮</button></div>
<div class="chat-body" id="chatBody"></div>
<div class="chat-input-wrap">
<div class="reply-preview" id="replyPreview"><div style="flex:1;min-width:0"><b id="replyNom"></b><small id="replyTxt"></small></div><button onclick="annulerReponse()">✕</button></div>
<div class="rec-bar" id="recBar"><div class="dot-rec"></div><b id="recTimer">Enregistrement... 0s</b><button onclick="annulerEnregistrement()" style="background:#333;color:#fff">🗑️ Annuler</button><button onclick="arreterEtEnvoyerVocal()" style="background:var(--or);color:#000">Envoyer ➤</button></div>
<div class="chat-input"><button onclick="document.getElementById('fileImg').click()">📷</button><input type="file" id="fileImg" accept="image/*" style="display:none"><button id="btnRec" onclick="toggleRec()">🎤</button><input id="msgInput" placeholder="Écris un message..." onkeydown="if(event.key==='Enter') envoyerMsg()"><button class="send" onclick="envoyerMsg()">➤</button></div>
</div>
</div>
</div>
</div>
<div class="overlay-menu" id="overlayMenu" onclick="fermerMenuTopChat()"></div>
<div class="menu-top-chat" id="menuTopChat"><button onclick="voirProfilChat()">👤 Voir le profil</button><button onclick="toggleDisparition()">⏰ <span id="txtDisparition">Activer messages 24h</span></button><button onclick="couperNotifChat()">🔇 Couper les notifications</button><button onclick="effacerConversation()">🗑️ Effacer la conversation</button><hr><button onclick="signalerChat()">🚩 Signaler</button><button class="danger" onclick="bloquerChat()">🚫 Bloquer l'utilisateur</button></div>
<div class="menu-msg" id="menuMsg"><div class="reacts"><span onclick="reagirMsg('❤️')">❤️</span><span onclick="reagirMsg('😂')">😂</span><span onclick="reagirMsg('😮')">😮</span><span onclick="reagirMsg('😢')">😢</span><span onclick="reagirMsg('😡')">😡</span><span onclick="reagirMsg('👍')">👍</span></div><hr style="border:0;height:1px;background:#26262F"><button onclick="repondreMsg()">↩️ Répondre</button><button onclick="copierMsg()">📋 Copier le message</button><button class="retirer" id="btnRetirer" onclick="retirerMessage()" style="display:none">🚫 Retirer le message</button><button class="danger" onclick="supprimerPourMoi()">🗑️ Supprimer pour moi</button><button onclick="fermerMenuMsg()">✕ Fermer</button></div>

<!-- ✅ BOUTON FLOTTANT BOT -->
<button class="fab-bot" onclick="location.href='assistant.html'">🤖<span class="badge-bot">1</span></button>

<div class="bottom" id="bottomNav"><button onclick="location.href='feed.html'"><span>🏠</span>Accueil</button><button onclick="location.href='amis.html'"><span>👥</span>Amis</button><button onclick="location.href='creer-post.html'"><span class="centre">+</span></button><button class="active" onclick="location.href='messages.html'"><span>💬</span>Messages</button><button onclick="location.href='profil.html'"><span>👤</span>Moi</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatarTop').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tousUsers=[], convActuelle=null, destinataire=null, mediaRecorder=null, audioChunks=[];
let cacheMessages={}, msgSelectionneId=null, reponseA=null, disparition24h=false;
let audioObj=null, audioIdEnCours=null, recStart=0, recTimerInt=null;
const params=new URLSearchParams(location.search); const uidCible=params.get('uid');
function avatarHTML(photo, lettre){ return photo ? `<img src="${photo}">` : lettre; }
function esc(t){ return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
window.retourListe=()=>{ document.getElementById('chatPanel').classList.remove('show-mob'); document.getElementById('listPanel').classList.remove('hide-mob'); document.body.classList.remove('chat-open'); };
window.filtrer=()=>{ const q=document.getElementById('searchUser').value.toLowerCase(); document.querySelectorAll('.conv').forEach(c=>{ c.style.display = c.dataset.nom.toLowerCase().includes(q) ? 'flex' : 'none'; }); };
window.ouvrirMenuTopChat=(e)=>{ e.stopPropagation(); document.getElementById('menuTopChat').classList.add('open'); document.getElementById('overlayMenu').classList.add('open'); };
window.fermerMenuTopChat=()=>{ document.getElementById('menuTopChat').classList.remove('open'); document.getElementById('overlayMenu').classList.remove('open'); };
window.voirProfilChat=()=>{ fermerMenuTopChat(); if(destinataire) location.href='profil-ami.html?uid='+destinataire.uid; };
window.toggleDisparition=async ()=>{ disparition24h=!disparition24h; await set(ref(db,'jasonbook/messages_settings/'+convActuelle+'/disparition24h'), disparition24h); document.getElementById('txtDisparition').innerText = disparition24h ? "Désactiver messages 24h ✅" : "Activer messages 24h"; fermerMenuTopChat(); alert(disparition24h ? "⏰ Messages 24h activé" : "⏰ Messages 24h désactivé"); };
window.couperNotifChat=async ()=>{ await set(ref(db,'jasonbook/messages_settings/'+convActuelle+'/mute_'+uid), true); fermerMenuTopChat(); alert("🔇 Notifications coupées"); };
window.effacerConversation=async ()=>{ if(!confirm("Effacer toute la conversation pour toi ?")) return; fermerMenuTopChat(); const snap=await get(ref(db,'jasonbook/messages/'+convActuelle)); const d=snap.val()||{}; for(const [mid,m] of Object.entries(d)){ await update(ref(db,'jasonbook/messages/'+convActuelle+'/'+mid),{['deletedFor_'+uid]:true}); } };
window.signalerChat=()=>{ fermerMenuTopChat(); alert("🚩 Signalé, merci."); };
window.bloquerChat=async ()=>{ if(!destinataire) return; if(!confirm("Bloquer "+(destinataire.nomComplet||"cet utilisateur")+" ?")) return; fermerMenuTopChat(); await set(ref(db,'jasonbook/bloques/'+uid+'/'+destinataire.uid),{uid:destinataire.uid,nom:destinataire.nomComplet||"",photo:destinataire.photoProfil||"",date:new Date().toLocaleString(),timestamp:Date.now()}); alert("🚫 Utilisateur bloqué"); retourListe(); };
window.ouvrirMenuMsg=(id)=>{ msgSelectionneId=id; const m=cacheMessages[id]; const btnRetirer=document.getElementById('btnRetirer'); if(m && m.auteurUid===uid){ btnRetirer.style.display="flex"; } else { btnRetirer.style.display="none"; } document.getElementById('menuMsg').classList.add('open'); };
window.fermerMenuMsg=()=>{ document.getElementById('menuMsg').classList.remove('open'); };
window.reagirMsg=async (emoji)=>{ if(!msgSelectionneId) return; await set(ref(db,'jasonbook/messages/'+convActuelle+'/'+msgSelectionneId+'/reactions/'+uid), emoji); fermerMenuMsg(); };
window.repondreMsg=()=>{ const m=cacheMessages[msgSelectionneId]; if(!m) return; reponseA={nom: m.auteurUid===uid ? "Toi" : (m.nomAuteur||"Ami"), texte: m.texte || (m.photoUrl?"📷 Photo": m.audioUrl?"🎤 Vocal":"")}; document.getElementById('replyNom').innerText="Réponse à "+reponseA.nom; document.getElementById('replyTxt').innerText=reponseA.texte; document.getElementById('replyPreview').classList.add('show'); document.getElementById('msgInput').focus(); fermerMenuMsg(); };
window.annulerReponse=()=>{ reponseA=null; document.getElementById('replyPreview').classList.remove('show'); };
window.copierMsg=async ()=>{ const m=cacheMessages[msgSelectionneId]; try{ await navigator.clipboard.writeText(m?.texte||"Vocal"); alert("Copié ✅"); }catch(e){ prompt("Copie :", m?.texte||""); } fermerMenuMsg(); };
window.supprimerPourMoi=async ()=>{ if(!msgSelectionneId) return; const id=msgSelectionneId; fermerMenuMsg(); delete cacheMessages[id]; const el=document.getElementById('msg_'+id); if(el) el.remove(); try{ const obj={}; obj['deletedFor_'+uid]=true; await update(ref(db,'jasonbook/messages/'+convActuelle+'/'+id), obj); }catch(e){ alert("Erreur : "+e.message); } };
window.retirerMessage=async ()=>{ if(!msgSelectionneId) return; const id=msgSelectionneId; if(!confirm("Retirer ce message pour tout le monde ?")) return; fermerMenuMsg(); delete cacheMessages[id]; const el=document.getElementById('msg_'+id); if(el) el.remove(); try{ await remove(ref(db,'jasonbook/messages/'+convActuelle+'/'+id)); }catch(e){ alert("Erreur : "+e.message); } };
function creerZigzag(mid){ let seed=0; for(let c of String(mid)) seed+=c.charCodeAt(0); let html=""; for(let i=0;i<28;i++){ const h=8+Math.abs(Math.sin(seed+i*0.7))*22; html+=`<i style="height:${h}px"></i>`; } return `<div class="wave" id="wave_${mid}" onclick="lireVocal(event,'${mid}')">${html}</div>`; }
window.lireVocal=(e,mid)=>{ e.stopPropagation(); const m=cacheMessages[mid]; if(!m?.audioUrl) return; const wave=document.getElementById('wave_'+mid); const btn=document.getElementById('btnVoice_'+mid); const timeEl=document.getElementById('timeVoice_'+mid); if(audioIdEnCours===mid && audioObj && !audioObj.paused){ audioObj.pause(); btn.innerText="▶️"; wave.classList.remove('playing'); return; } if(audioObj) audioObj.pause(); document.querySelectorAll('.wave').forEach(w=>w.classList.remove('playing')); document.querySelectorAll('[id^="btnVoice_"]').forEach(b=>b.innerText="▶️"); if(!audioObj || audioObj.src!==m.audioUrl){ audioObj=new Audio(m.audioUrl); } audioObj.play().catch(()=>alert("Impossible de lire ce vocal")); audioIdEnCours=mid; btn.innerText="⏸️"; wave.classList.add('playing'); audioObj.onloadedmetadata=()=>{ if(timeEl) timeEl.innerText="0s / "+Math.floor(audioObj.duration)+"s"; }; audioObj.ontimeupdate=()=>{ if(!audioObj.duration) return; const pct=audioObj.currentTime/audioObj.duration; wave.querySelectorAll('i').forEach((bar,idx)=>{ if(idx/28<=pct) bar.classList.add('played'); else bar.classList.remove('played'); }); if(timeEl) timeEl.innerText=Math.floor(audioObj.currentTime)+"s / "+Math.floor(audioObj.duration)+"s"; }; audioObj.onended=()=>{ btn.innerText="▶️"; wave.classList.remove('playing'); audioIdEnCours=null; if(timeEl) timeEl.innerText="0s / "+Math.floor(audioObj.duration||0)+"s"; }; };
async function chargerListe(){ const snap = await get(ref(db,'jasonbook/users')); const data=snap.val(); if(!data) return; tousUsers=Object.values(data).filter(u=>u.uid!==uid); let items=[]; for(const u of tousUsers){ const chatId = [uid, u.uid].sort().join('_'); const s=await get(ref(db,'jasonbook/messages/'+chatId)); const msgs=s.val(); let last="Dis bonjour...", lastTime="", nonLu=0, lastTs=0; if(msgs){ const arr=Object.entries(msgs).filter(([k,m])=>!m['deletedFor_'+uid] && !(m.expireAt && Date.now()>m.expireAt)); const d=arr[arr.length-1]?.[1]; if(d){ last=d.texte|| (d.photoUrl?"📷 Photo": d.audioUrl?"🎤 Vocal":""); lastTime=d.heure||""; lastTs=d.timestamp||0; nonLu=arr.filter(([k,m])=>m.auteurUid!==uid && !m.lu).length; } } items.push({u, chatId, last, lastTime, nonLu, lastTs}); } items.sort((a,b)=>(b.lastTs||0)-(a.lastTs||0)); const box=document.getElementById('convList'); box.innerHTML=""; if(!items.length){ document.getElementById('noConv').style.display="block"; return; } items.forEach(({u, chatId, last, lastTime, nonLu})=>{ const div=document.createElement('div'); div.className='conv'; div.dataset.nom=u.nomComplet||""; div.innerHTML=`<div class="avatar">${avatarHTML(u.photoProfil,(u.prenom||"?").charAt(0))}<div class="dot"></div></div><div style="flex:1;min-width:0"><b>${u.nomComplet||""}</b><small>${last}</small></div><div class="right"><span class="time">${lastTime}</span>${nonLu?`<span class="unread">${nonLu}</span>`:""}</div>`; div.onclick=()=>ouvrirChat(u, chatId); box.appendChild(div); }); if(uidCible){ const cible=tousUsers.find(u=>u.uid===uidCible); if(cible) ouvrirChat(cible, [uid, uidCible].sort().join('_')); } }
chargerListe(); onValue(ref(db,'jasonbook/messages'), ()=>{ chargerListe(); });
window.ouvrirChat=async (u, chatId)=>{ destinataire=u; convActuelle=chatId; const bSnap=await get(ref(db,'jasonbook/bloques/'+uid+'/'+u.uid)); if(bSnap.exists()){ if(!confirm("Cet utilisateur est bloqué. Débloquer ?")) return; await remove(ref(db,'jasonbook/bloques/'+uid+'/'+u.uid)); } const setSnap=await get(ref(db,'jasonbook/messages_settings/'+chatId+'/disparition24h')); disparition24h=setSnap.val()===true; document.getElementById('txtDisparition').innerText = disparition24h ? "Désactiver messages 24h ✅" : "Activer messages 24h"; document.getElementById('emptyChat').style.display="none"; document.getElementById('chatContent').style.display="flex"; document.getElementById('chatPanel').classList.add('show-mob'); document.getElementById('listPanel').classList.add('hide-mob'); document.body.classList.add('chat-open'); document.getElementById('chatAvatar').innerHTML=avatarHTML(u.photoProfil,(u.prenom||"?").charAt(0)); document.getElementById('chatNom').innerText=u.nomComplet||""; document.getElementById('chatStatut').innerText="En ligne • "+(u.pays||""); const snap=await get(ref(db,'jasonbook/messages/'+chatId)); const msgs=snap.val(); if(msgs){ for(const [mid,m] of Object.entries(msgs)){ if(m.auteurUid!==uid && !m.lu) await update(ref(db,'jasonbook/messages/'+chatId+'/'+mid),{lu:true}); } } onValue(ref(db,'jasonbook/messages/'+chatId), (s)=>{ const d=s.val(); const body=document.getElementById('chatBody'); const etaitEnBas = body.scrollHeight - body.scrollTop - body.clientHeight < 120; body.innerHTML=""; cacheMessages=d||{}; if(!d){ body.innerHTML='<p style="text-align:center;color:#888;font-size:13px;margin-top:30px">Aucun message. Dis bonjour ! 👋</p>'; return; } Object.entries(d).forEach(([mid,m])=>{ if(m['deletedFor_'+uid]) return; if(m.expireAt && Date.now()>m.expireAt) return; const div=document.createElement('div'); div.className='msg '+(m.auteurUid===uid?'mine':'other'); div.id='msg_'+mid; let timer=null; div.addEventListener('touchstart',()=>{ timer=setTimeout(()=>ouvrirMenuMsg(mid),550); }); div.addEventListener('touchend',()=>clearTimeout(timer)); div.addEventListener('touchmove',()=>clearTimeout(timer)); div.addEventListener('contextmenu',e=>{ e.preventDefault(); ouvrirMenuMsg(mid); }); let contenu=""; if(m.replyTo) contenu+=`<div class="reply-box"><b>${esc(m.replyTo.nom)}</b><br>${esc(m.replyTo.texte)}</div>`; if(m.texte) contenu+=`<span class="txt">${esc(m.texte)}</span>`; if(m.photoUrl) contenu+=`<br><img src="${m.photoUrl}">`; if(m.audioUrl){ contenu+=`<div class="voice"><button id="btnVoice_${mid}" onclick="lireVocal(event,'${mid}')">▶️</button>${creerZigzag(mid)}<small id="timeVoice_${mid}">🎤 Vocal</small></div>`; } if(m.reactions){ const ems=Object.values(m.reactions); if(ems.length) contenu+=`<div class="react-row">${ems.map(e=>`<span>${e}</span>`).join('')}</div>`; } let meta=""; if(m.auteurUid===uid){ if(m.lu) meta=`<div class="meta"><span>${m.heure||""}</span><span class="tick lu">✓✓ Lu</span></div>`; else { const age = Date.now() - (m.timestamp||0); if(age < 3000) meta=`<div class="meta"><span>${m.heure||""}</span><span class="tick">✓</span></div>`; else meta=`<div class="meta"><span>${m.heure||""}</span><span class="tick recu">✓✓</span></div>`; } } else meta=`<div class="meta"><span>${m.heure||""}</span>${m.expireAt?" • ⏰ 24h":""}</div>`; div.innerHTML=contenu+meta; body.appendChild(div); }); if(etaitEnBas || Object.keys(d).length < 20){ requestAnimationFrame(()=>{ body.scrollTop=body.scrollHeight; }); } }); };
window.envoyerMsg=async (photoUrl="", audioUrl="")=>{ const inp=document.getElementById('msgInput'); const txt=inp.value.trim(); if(!destinataire || (!txt && !photoUrl && !audioUrl)) return; const bSnap=await get(ref(db,'jasonbook/bloques/'+destinataire.uid+'/'+uid)); if(bSnap.exists()){ alert("🚫 Tu es bloqué par cet utilisateur"); return; } const newRef=push(ref(db,'jasonbook/messages/'+convActuelle)); await set(newRef,{ auteurUid:uid, nomAuteur:monNom, destinataireUid:destinataire.uid, texte:txt, photoUrl:photoUrl||"", audioUrl:audioUrl||"", heure:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), timestamp:Date.now(), lu:false, expireAt: disparition24h ? Date.now()+24*60*60*1000 : 0, replyTo: reponseA||null }); inp.value=""; annulerReponse(); const nRef=push(ref(db,'jasonbook/notifications/'+destinataire.uid)); await set(nRef,{ type:"message", texte:monNom+" t'a envoyé un message", deUid:uid, deNom:monNom, date:new Date().toLocaleString(), lu:false }); setTimeout(()=>chargerListe(), 500); };
document.getElementById('fileImg').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>envoyerMsg(ev.target.result,""); r.readAsDataURL(f); });
window.toggleRec=async ()=>{ if(mediaRecorder && mediaRecorder.state==="recording"){ arreterEtEnvoyerVocal(); return; } try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; mediaRecorder.ondataavailable=e=>audioChunks.push(e.data); mediaRecorder.onstop=async ()=>{ if(mediaRecorder._annule) return; const blob=new Blob(audioChunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=ev=>envoyerMsg("",ev.target.result); r.readAsDataURL(blob); }; mediaRecorder.start(); document.getElementById('btnRec').classList.add('on'); document.getElementById('btnRec').innerText="⏹️"; document.getElementById('recBar').classList.add('show'); recStart=Date.now(); recTimerInt=setInterval(()=>{ document.getElementById('recTimer').innerText="Enregistrement... "+Math.floor((Date.now()-recStart)/1000)+"s"; },500); }catch(e){ alert("Micro non autorisé"); } };
window.annulerEnregistrement=()=>{ if(!mediaRecorder) return; mediaRecorder._annule=true; try{ mediaRecorder.stop(); }catch(e){} mediaRecorder.stream?.getTracks().forEach(t=>t.stop()); clearInterval(recTimerInt); document.getElementById('recBar').classList.remove('show'); document.getElementById('btnRec').classList.remove('on'); document.getElementById('btnRec').innerText="🎤"; alert("Vocal annulé 🗑️"); };
window.arreterEtEnvoyerVocal=()=>{ if(!mediaRecorder) return; mediaRecorder._annule=false; try{ mediaRecorder.stop(); }catch(e){} mediaRecorder.stream?.getTracks().forEach(t=>t.stop()); clearInterval(recTimerInt); document.getElementById('recBar').classList.remove('show'); document.getElementById('btnRec').classList.remove('on'); document.getElementById('btnRec').innerText="🎤"; };
</script>
</body>
</html>
