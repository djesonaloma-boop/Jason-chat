<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Annonces</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:20px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:800px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.top h1{font-size:24px}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-grey{background:#e4e6eb;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.filters button{border:none;background:#fff;padding:10px 14px;border-radius:20px;font-weight:700;cursor:pointer;white-space:nowrap}
.filters button.active{background:#1877F2;color:#fff}
.filters input{border:none;background:#fff;padding:10px 14px;border-radius:20px;font-weight:600;outline:none;min-width:140px}
.a-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.a-head{display:flex;gap:10px;align-items:center}
.a-head .info{flex:1}.a-head small{color:#65676b}
.a-card .type{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:800;margin-bottom:8px}
.type-offre{background:#d4edda;color:#155724}.type-demande{background:#cce5ff;color:#004085}.type-emploi{background:#fff3cd;color:#856404}.type-location{background:#e2d9f3;color:#5b2ea6}.type-service{background:#f8d7da;color:#721c24}
.a-card p{font-size:14px;color:#333;white-space:pre-wrap;margin:6px 0}
.a-card .a-img{width:100%;border-radius:10px;margin-top:8px;max-height:320px;object-fit:cover}
.a-card .foot{display:flex;gap:8px;margin-top:10px}
.a-card .foot button{flex:1}
.empty{text-align:center;color:#65676b;padding:40px 10px;background:#fff;border-radius:12px}
.empty .big{font-size:50px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-top:8px;font-size:14px;outline:none}
.modal-box textarea{min-height:70px;resize:vertical}
.modal-box img{width:100%;border-radius:10px;margin-top:10px;max-height:240px;object-fit:cover}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="Assets/theme.css">
<script src="Assets/theme.js"></script>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="Rechercher une annonce..." id="searchInput" oninput="rendre()">
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>📢 Annonces</h1><button class="btn-blue" onclick="ouvrirPublier()">➕ Publier une annonce</button></div>
<div class="filters">
<button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button>
<button id="cat-Offre" onclick="setCat('Offre')">🟢 Offre</button>
<button id="cat-Demande" onclick="setCat('Demande')">🔵 Demande</button>
<button id="cat-Emploi" onclick="setCat('Emploi')">💼 Emploi</button>
<button id="cat-Location" onclick="setCat('Location')">🏠 Location</button>
<button id="cat-Service" onclick="setCat('Service')">🔧 Service</button>
<input id="villeFilter" placeholder="Filtrer par ville..." oninput="rendre()">
</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">📢</div><h3>Aucune annonce pour le moment</h3><p>Publie la première annonce !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="annonces.html">📢</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalPublier"><div class="modal-box">
<h2>Publier une annonce</h2>
<input id="anTitre" placeholder="Titre * (ex: Je cherche un chauffeur)">
<select id="anType"><option>Offre</option><option>Demande</option><option>Emploi</option><option>Location</option><option>Service</option></select>
<input id="anVille" placeholder="Ville">
<input id="anContact" placeholder="Contact (téléphone / WhatsApp)">
<textarea id="anDesc" placeholder="Décris ton annonce en détail..."></textarea>
<button class="btn-grey" style="width:100%;margin-top:8px" onclick="document.getElementById('anPhoto').click()">📷 Ajouter une photo (optionnel)</button>
<input type="file" id="anPhoto" accept="image/*" style="display:none">
<img id="anPreview" style="display:none">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="publierAnnonce()">Publier</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerPublier()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const maVille = localStorage.getItem('jasonbook_ville')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let toutes=[], cat='Tout', photoAnnonce="";
document.getElementById('anVille').value=maVille;

window.setCat=(c)=>{ cat=c; ['Tout','Offre','Demande','Emploi','Location','Service'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
window.ouvrirPublier=()=>document.getElementById('modalPublier').classList.add('open');
window.fermerPublier=()=>document.getElementById('modalPublier').classList.remove('open');
document.getElementById('anPhoto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=ev=>{ photoAnnonce=ev.target.result; document.getElementById('anPreview').src=photoAnnonce; document.getElementById('anPreview').style.display="block"; };
  r.readAsDataURL(f);
});
function classType(t){
  if(t==='Offre') return 'type-offre'; if(t==='Demande') return 'type-demande'; if(t==='Emploi') return 'type-emploi';
  if(t==='Location') return 'type-location'; return 'type-service';
}
function emojiType(t){ if(t==='Offre') return '🟢'; if(t==='Demande') return '🔵'; if(t==='Emploi') return '💼'; if(t==='Location') return '🏠'; return '🔧'; }
window.rendre=()=>{
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const ville=(document.getElementById('villeFilter').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=toutes.filter(a=>{
    const txt=((a.titre||"")+" "+(a.description||"")+" "+(a.type||"")).toLowerCase();
    return txt.includes(q) && (cat==='Tout' || a.type===cat) && (!ville || (a.ville||"").toLowerCase().includes(ville));
  });
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(a=>{
    const div=document.createElement('div'); div.className='a-card';
    div.innerHTML=`
      <div class="a-head">
        <div class="avatar" onclick="location.href='profil-ami.html?uid=${a.auteurUid}'">${a.photoAuteur?`<img src="${a.photoAuteur}">`:(a.auteurNom||"?").charAt(0)}</div>
        <div class="info"><b style="cursor:pointer" onclick="location.href='profil-ami.html?uid=${a.auteurUid}'">${a.auteurNom||""}</b><br><small>${a.ville||""} • ${a.date||""}</small></div>
        ${a.auteurUid===uid?`<button class="btn-grey" onclick="supprimerAnnonce('${a.id}')">🗑️</button>`:""}
      </div>
      <span class="type ${classType(a.type)}">${emojiType(a.type)} ${a.type||""}</span>
      <h3>${a.titre||""}</h3>
      <p>${a.description||""}</p>
      ${a.contact?`<p style="font-weight:700">📞 Contact : ${a.contact}</p>`:""}
      ${a.photo?`<img class="a-img" src="${a.photo}">`:""}
      <div class="foot"><button class="btn-blue" onclick="location.href='messages.html?uid=${a.auteurUid}'">💬 Contacter</button><button class="btn-grey" onclick="partagerAnnonce('${a.titre||""}')">↗️ Partager</button></div>`;
    box.appendChild(div);
  });
};
window.supprimerAnnonce=async (id)=>{ if(!confirm("Supprimer cette annonce ?")) return; await remove(ref(db,'jasonbook/annonces/'+id)); };
window.partagerAnnonce=(titre)=>{ alert("Annonce : "+titre+"\n\nPartage-la avec tes amis ! 📤"); };
window.publierAnnonce=async()=>{
  const titre=document.getElementById('anTitre').value.trim();
  const desc=document.getElementById('anDesc').value.trim();
  if(!titre || !desc){ alert("Titre et description obligatoires"); return; }
  const newRef=push(ref(db,'jasonbook/annonces'));
  await set(newRef,{ id:newRef.key, titre:titre, type:document.getElementById('anType').value, ville:document.getElementById('anVille').value, contact:document.getElementById('anContact').value, description:desc, photo:photoAnnonce||"", auteurUid:uid, auteurNom:monNom, photoAuteur:maPhoto||"", date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerPublier(); photoAnnonce=""; document.getElementById('anTitre').value=""; document.getElementById('anDesc').value=""; document.getElementById('anContact').value=""; document.getElementById('anPreview').style.display="none";
  alert("Annonce publiée ! 📢");
};
onValue(ref(db,'jasonbook/annonces'), s=>{ const d=s.val(); toutes=d?Object.entries(d).map(([id,a])=>({id,...a})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
</script>
</body>
</html>
