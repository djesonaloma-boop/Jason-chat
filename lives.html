<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Lives</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:750px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{font-size:23px;letter-spacing:-.3px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-grey{background:#f0f2f5;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.btn-red{background:#e0245e;color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.live-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);cursor:pointer}
.live-card .head{display:flex;gap:10px;align-items:center}
.live-card .head .info{flex:1}.live-card .head small{color:var(--grey);font-size:12.5px}
.live-badge{background:#e0245e;color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;animation:blink 1.2s infinite;white-space:nowrap}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.live-card .thumb{width:100%;border-radius:10px;margin-top:10px;max-height:320px;object-fit:cover;background:#000}
.live-card .actions{display:flex;gap:8px;margin-top:10px}
.live-card .actions button{flex:1}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}
.live-room{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;color:#fff}
.live-room.open{display:flex}
.live-room video{flex:1;width:100%;object-fit:cover;background:#111}
.live-room .room-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.live-room .room-top .info{flex:1}
.live-room .room-top button{background:rgba(0,0,0,.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.live-room .chat{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.85));max-height:45%}
.live-room .chat-msgs{max-height:140px;overflow-y:auto;margin-bottom:8px}
.live-room .chat-msgs p{font-size:13px;margin:4px 0}
.live-room .chat-msgs b{color:#FFD700}
.live-room .chat-input{display:flex;gap:8px}
.live-room .chat-input input{flex:1;padding:11px;border:none;border-radius:999px;outline:none;font-size:14px}
.live-room .chat-input button{border:none;padding:11px 16px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
.live-room .reactions{display:flex;gap:8px;margin-bottom:8px}
.live-room .reactions button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:110;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:20px}
.modal-box input,.modal-box textarea{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:10px;margin-top:8px;font-size:14px;outline:none;background:#f8f9fa}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--blue);background:#fff}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher un live..." id="searchInput" oninput="rendre()">
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>🔴 Lives</h1><button class="btn-red" onclick="ouvrirGoLive()">🔴 Lancer un Live</button></div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🔴</div><h3>Aucun live pour le moment</h3><p>Sois le premier à lancer un live !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="lives.html">🔴</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalLive"><div class="modal-box">
<h2>🔴 Lancer un Live</h2>
<input id="liveTitre" placeholder="Titre du live * (ex: Concert en direct)">
<textarea id="liveDesc" placeholder="De quoi vas-tu parler ?"></textarea>
<button class="btn-red" style="width:100%;margin-top:14px;padding:13px" onclick="lancerLive()">🔴 Passer en direct</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerGoLive()">Annuler</button>
</div></div>

<div class="live-room" id="liveRoom">
<video id="liveVideo" autoplay playsinline muted></video>
<div class="room-top"><div class="avatar" id="roomAv">?</div><div class="info"><b id="roomNom"></b><br><small><span class="live-badge">● LIVE</span> <span id="roomViewers">👁️ 1 spectateur</span></small></div><button onclick="quitterLive()">✕</button></div>
<div class="chat"><div class="reactions"><button onclick="envoyerReaction('❤️')">❤️</button><button onclick="envoyerReaction('🔥')">🔥</button><button onclick="envoyerReaction('👏')">👏</button><button onclick="envoyerReaction('😂')">😂</button><button onclick="envoyerReaction('😮')">😮</button></div><div class="chat-msgs" id="chatMsgs"></div><div class="chat-input"><input id="chatInput" placeholder="Dis quelque chose..."><button onclick="envoyerChat()">Envoyer</button></div><button id="btnTerminer" class="btn-red" style="width:100%;margin-top:8px;padding:11px;display:none" onclick="terminerLive()">⏹️ Terminer le live</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let lives=[], liveActuelId=null, stream=null, estAnimateur=false;
window.ouvrirGoLive=()=>document.getElementById('modalLive').classList.add('open');
window.fermerGoLive=()=>document.getElementById('modalLive').classList.remove('open');
function rendre(){
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=lives.filter(l=> ((l.titre||"")+" "+(l.auteurNom||"")).toLowerCase().includes(q));
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(l=>{
    const div=document.createElement('div'); div.className='live-card'; div.onclick=()=>rejoindreLive(l.id);
    div.innerHTML=`
      <div class="head">
        <div class="avatar">${l.photoAuteur?`<img src="${l.photoAuteur}">`:(l.auteurNom||"?").charAt(0)}</div>
        <div class="info"><b>${l.auteurNom||""}</b><br><small>${l.date||""} • 👁️ ${l.viewers||1} spectateur(s)</small></div>
        <span class="live-badge">● LIVE</span>
      </div>
      <b style="display:block;margin-top:10px">${l.titre||""}</b>
      <p style="font-size:13px;color:#555;margin-top:4px">${l.description||""}</p>
      <div class="actions"><button class="btn-red" onclick="event.stopPropagation();rejoindreLive('${l.id}')">▶️ Regarder</button>${l.auteurUid===uid?`<button class="btn-grey" onclick="event.stopPropagation();terminerLiveParId('${l.id}')">⏹️ Terminer</button>`:""}</div>`;
    box.appendChild(div);
  });
}
window.lancerLive=async()=>{
  const titre=document.getElementById('liveTitre').value.trim();
  if(!titre){ alert("Titre obligatoire"); return; }
  const newRef=push(ref(db,'jasonbook/lives'));
  await set(newRef,{ id:newRef.key, titre:titre, description:document.getElementById('liveDesc').value, auteurUid:uid, auteurNom:monNom, photoAuteur:maPhoto||"", viewers:1, date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerGoLive(); document.getElementById('liveTitre').value=""; document.getElementById('liveDesc').value="";
  rejoindreLive(newRef.key, true);
};
window.rejoindreLive=async (id, animateur=false)=>{
  const l=lives.find(x=>x.id===id); if(!l) return;
  liveActuelId=id; estAnimateur=animateur || l.auteurUid===uid;
  document.getElementById('roomAv').innerHTML=l.photoAuteur?`<img src="${l.photoAuteur}">`:(l.auteurNom||"?").charAt(0);
  document.getElementById('roomNom').innerText=l.titre||"";
  document.getElementById('roomViewers').innerText="👁️ "+(l.viewers||1)+" spectateur(s)";
  document.getElementById('btnTerminer').style.display=estAnimateur?'block':'none';
  document.getElementById('liveRoom').classList.add('open');
  if(estAnimateur){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('liveVideo').srcObject=stream; }
    catch(e){ document.getElementById('liveVideo').style.display='none'; }
  }
  await set(ref(db,'jasonbook/lives/'+id+'/viewers'), (l.viewers||0)+1);
  const mRef=push(ref(db,'jasonbook/liveChat/'+id));
  await set(mRef,{ nom:monNom, texte:monNom+" a rejoint le live 👋", timestamp:Date.now() });
  ecouterChat(id);
};
function ecouterChat(id){
  onValue(ref(db,'jasonbook/liveChat/'+id), s=>{
    const d=s.val(); const box=document.getElementById('chatMsgs');
    if(!d){ box.innerHTML=""; return; }
    const msgs=Object.entries(d).map(([k,m])=>m).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).slice(-30);
    box.innerHTML=msgs.map(m=>`<p><b>${m.nom||""} :</b> ${m.texte||""}</p>`).join('');
    box.scrollTop=box.scrollHeight;
  });
}
window.envoyerChat=async()=>{
  const input=document.getElementById('chatInput'); const txt=input.value.trim(); if(!txt || !liveActuelId) return;
  const mRef=push(ref(db,'jasonbook/liveChat/'+liveActuelId));
  await set(mRef,{ nom:monNom, texte:txt, timestamp:Date.now() });
  input.value="";
};
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') envoyerChat(); });
window.envoyerReaction=async (emoji)=>{
  if(!liveActuelId) return;
  const mRef=push(ref(db,'jasonbook/liveChat/'+liveActuelId));
  await set(mRef,{ nom:monNom, texte:emoji+" a réagi "+emoji, timestamp:Date.now() });
};
window.quitterLive=async()=>{
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('liveRoom').classList.remove('open');
  document.getElementById('liveVideo').srcObject=null; document.getElementById('liveVideo').style.display='block';
  liveActuelId=null; estAnimateur=false;
};
window.terminerLive=async()=>{ if(!liveActuelId) return; await remove(ref(db,'jasonbook/lives/'+liveActuelId)); await remove(ref(db,'jasonbook/liveChat/'+liveActuelId)); quitterLive(); };
window.terminerLiveParId=async (id)=>{ if(!confirm("Terminer ce live ?")) return; await remove(ref(db,'jasonbook/lives/'+id)); await remove(ref(db,'jasonbook/liveChat/'+id)); };
onValue(ref(db,'jasonbook/lives'), s=>{ const d=s.val(); lives=d?Object.entries(d).map(([id,l])=>({id,...l})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
</script>
</body>
</html>
