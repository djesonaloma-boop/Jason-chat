<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Vidéos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw}
body{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:#0F0F14;min-height:100vh;color:#fff}
img,video,iframe{max-width:100%}
:root{--violet:#7C3AED;--violet2:#A855F7;--or:#FFC107;--carte:#1C1C24;--gris:#A1A1AA;--ligne:#2A2A35}
header{background:#111;display:flex;align-items:center;gap:12px;padding:12px 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--or)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#fff;font-size:21px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo span{width:34px;height:34px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:var(--or);font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--or));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:700px;margin:16px auto;padding:0 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{font-size:23px;letter-spacing:-.3px;color:#fff}
.btn-blue{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border:none;padding:11px 16px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13.5px}
.v-card{background:var(--carte);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--ligne)}
.v-head{display:flex;gap:10px;align-items:center}
.v-head .info{flex:1}.v-head small{color:var(--gris)}
.v-head b{color:#fff}
.v-text{margin:10px 0;font-size:15px;white-space:pre-wrap;line-height:1.5;color:#EDEDEF}
.v-card video{width:100%;border-radius:10px;max-height:500px;background:#000}
.v-card iframe{width:100%;height:580px;border:none;border-radius:10px;background:#000}
.v-actions{display:flex;justify-content:space-around;border-top:1px solid var(--ligne);padding-top:8px;margin-top:8px}
.v-actions button{border:none;background:none;font-weight:700;color:var(--gris);cursor:pointer;padding:8px;font-size:13.5px}
.v-actions button.liked{color:var(--or)}
.empty{text-align:center;color:var(--gris);padding:36px 10px;background:var(--carte);border-radius:12px;border:1px solid var(--ligne)}
.empty h3{color:#fff}
.empty .big{font-size:44px}
.section-titre{font-size:15px;font-weight:800;color:var(--or);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>

<!-- ✅ HEADER : JUSTE JASONBOOK -->
<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
</header>

<div class="wrap">
<div class="top"><h1>🎥 Vidéos</h1><button class="btn-blue" onclick="location.href='creer-post.html'">➕ Publier une vidéo</button></div>

<!-- ✅ TES 3 VIDÉOS TIKTOK - ELLES JOUENT DIRECT DANS JASONBOOK -->
<div class="section-titre">🔥 À la une - TikTok</div>

<div class="v-card">
<div class="v-head"><div class="avatar">N</div><div class="info"><b>@narria_stories</b><br><small>TikTok • Vidéo à la une</small></div></div>
<div class="v-text">Regardez ça 🔥</div>
<iframe src="https://www.tiktok.com/embed/v2/7701397556701433120" allowfullscreen scrolling="no" allow="encrypted-media; picture-in-picture"></iframe>
</div>

<div class="v-card">
<div class="v-head"><div class="avatar">W</div><div class="info"><b>@wildlols2</b><br><small>TikTok • Vidéo à la une</small></div></div>
<div class="v-text">😂 Trop drôle</div>
<iframe src="https://www.tiktok.com/embed/v2/7706453589807484182" allowfullscreen scrolling="no" allow="encrypted-media; picture-in-picture"></iframe>
</div>

<div class="v-card">
<div class="v-head"><div class="avatar">F</div><div class="info"><b>@famille.adams6</b><br><small>TikTok • Vidéo à la une</small></div></div>
<div class="v-text">❤️ Famille Adams</div>
<iframe src="https://www.tiktok.com/embed/v2/7700655013655366933" allowfullscreen scrolling="no" allow="encrypted-media; picture-in-picture"></iframe>
</div>

<div class="section-titre">📺 Toutes les vidéos publiées</div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🎥</div><h3>Aucune vidéo pour le moment</h3><p>Publie la première vidéo !</p></div>
</div>

<!-- ✅ PLUS DE BARRE EN BAS -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const myAv=document.getElementById('myAvatar'); if(myAv) myAv.innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let mesLikes=new Set();
function mediaHtml(p){
  if(p.tiktokId) return `<iframe src="https://www.tiktok.com/embed/v2/${p.tiktokId}" allowfullscreen scrolling="no" allow="encrypted-media; picture-in-picture"></iframe>`;
  if(p.videoUrl) return `<video controls preload="metadata" src="${p.videoUrl}"></video>`;
  if(p.tiktokUrl) return `<a href="${p.tiktokUrl}" target="_blank" style="color:#FFC107;font-weight:700">▶️ Voir la vidéo TikTok</a>`;
  return "";
}
function afficherVideos(videos){
  const box=document.getElementById('list'); box.innerHTML="";
  if(!videos.length){ document.getElementById('emptyBox').style.display="block"; return; }
  document.getElementById('emptyBox').style.display="none";
  videos.forEach(p=>{
    const div=document.createElement('div'); div.className='v-card';
    const liked=mesLikes.has(p.id);
    div.innerHTML=`
      <div class="v-head">
        <div class="avatar" onclick="location.href='profil-ami.html?uid=${p.auteurUid}'">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.nomAuteur||"?").charAt(0)}</div>
        <div class="info"><b style="cursor:pointer" onclick="location.href='profil-ami.html?uid=${p.auteurUid}'">${p.nomAuteur||""}</b><br><small>${p.ville||""} • ${p.date||""} ${p.tiktokId?'• TikTok':''}</small></div>
        ${p.auteurUid===uid?`<button style="border:none;background:none;cursor:pointer;font-size:18px;color:#fff" onclick="supprimerVideo('${p.id}')">🗑️</button>`:""}
      </div>
      <div class="v-text">${p.texte||""}</div>
      ${mediaHtml(p)}
      <div class="v-actions">
        <button class="${liked?'liked':''}" onclick="likerVideo('${p.id}',${p.likesCount||0})">👍 ${p.likesCount||0} J'aime</button>
        <button onclick="location.href='feed.html'">💬 ${p.commentairesCount||0} Commenter</button>
        <button onclick="partagerVideo('${p.id}',${p.partagesCount||0})">↗️ ${p.partagesCount||0} Partager</button>
      </div>`;
    box.appendChild(div);
  });
}
window.likerVideo=async (id, actuel)=>{
  if(mesLikes.has(id)){ await remove(ref(db,'jasonbook/likes/'+uid+'/'+id)); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'), Math.max(0,actuel-1)); }
  else { await set(ref(db,'jasonbook/likes/'+uid+'/'+id), true); await set(ref(db,'jasonbook/posts/'+id+'/likesCount'), actuel+1); }
};
window.partagerVideo=async (id, actuel)=>{
  await set(ref(db,'jasonbook/posts/'+id+'/partagesCount'), actuel+1);
  alert("Lien copié ! Partage cette vidéo avec tes amis 📤");
};
window.supprimerVideo=async (id)=>{ if(!confirm("Supprimer cette vidéo ?")) return; await remove(ref(db,'jasonbook/posts/'+id)); };
onValue(ref(db,'jasonbook/likes/'+uid), s=>{ const d=s.val(); mesLikes=new Set(d?Object.keys(d):[]); });
onValue(ref(db,'jasonbook/posts'), (snap)=>{
  const data=snap.val(); if(!data){ afficherVideos([]); return; }
  // ✅ MAINTENANT : vidéo uploadée OU TikTok
  const videos=Object.entries(data).map(([id,p])=>({id,...p})).filter(p=>p.videoUrl || p.tiktokId || p.tiktokUrl).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  afficherVideos(videos);
});
</script>
</body>
</html>
