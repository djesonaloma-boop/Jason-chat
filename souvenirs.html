<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Souvenirs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:20px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:650px;margin:16px auto;padding:0 12px}
.wrap h1{font-size:24px;margin-bottom:6px}
.wrap .sub{color:#65676b;margin-bottom:14px}
.year-title{background:#1877F2;color:#fff;padding:10px 14px;border-radius:10px;margin:16px 0 10px;font-weight:800;display:flex;justify-content:space-between}
.post{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.post .head{display:flex;gap:10px;align-items:center}
.post .head .info{flex:1}.post .head small{color:#65676b}
.post p{margin:10px 0;white-space:pre-wrap;font-size:15px}
.post img.pimg{width:100%;border-radius:10px;max-height:380px;object-fit:cover;margin-top:6px}
.post .actions{display:flex;gap:8px;margin-top:10px}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;flex:1}
.btn-grey{background:#e4e6eb;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;flex:1}
.empty{text-align:center;color:#65676b;padding:40px 10px;background:#fff;border-radius:12px}
.empty .big{font-size:50px}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="Assets/theme.css">
<script src="Assets/theme.js"></script>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<h1>🕰️ Souvenirs</h1>
<p class="sub">Revivez vos moments d'il y a 1 an, 2 ans, 3 ans... Ce jour-là.</p>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🕰️</div><h3>Aucun souvenir aujourd'hui</h3><p>Tu n'as rien publié ce jour-là les années précédentes.</p><p style="margin-top:8px">Publie aujourd'hui pour créer un souvenir pour l'an prochain !</p><button class="btn-blue" style="flex:none;margin-top:14px;padding:11px 20px" onclick="location.href='creer-post.html'">📝 Publier un souvenir →</button></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="souvenirs.html">🕰️</a><a href="profil.html">👤</a></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();

function estMemeJourMois(timestamp){
  if(!timestamp) return false;
  const d=new Date(timestamp); const now=new Date();
  return d.getDate()===now.getDate() && d.getMonth()===now.getMonth() && d.getFullYear()!==now.getFullYear();
}
function anneesDepuis(timestamp){
  return new Date().getFullYear() - new Date(timestamp).getFullYear();
}
onValue(ref(db,'jasonbook/posts'), s=>{
  const d=s.val(); const box=document.getElementById('list'); box.innerHTML="";
  const liste=d?Object.entries(d).map(([id,p])=>({id,...p})).filter(p=>p.auteurUid===uid && estMemeJourMois(p.timestamp)).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[];
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  // Grouper par années
  const parAnnee={};
  liste.forEach(p=>{ const an=anneesDepuis(p.timestamp); if(!parAnnee[an]) parAnnee[an]=[]; parAnnee[an].push(p); });
  Object.keys(parAnnee).sort((a,b)=>a-b).forEach(an=>{
    const titre=document.createElement('div'); titre.className='year-title';
    titre.innerHTML=`<span>🕰️ Il y a ${an} an${an>1?'s':''}</span><span>${parAnnee[an].length} souvenir${parAnnee[an].length>1?'s':''}</span>`;
    box.appendChild(titre);
    parAnnee[an].forEach(p=>{
      const div=document.createElement('div'); div.className='post';
      div.innerHTML=`
        <div class="head">
          <div class="avatar">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.auteurNom||"?").charAt(0)}</div>
          <div class="info"><b>${p.auteurNom||""}</b><br><small>${p.date||""} • Il y a ${an} an${an>1?'s':''}</small></div>
        </div>
        <p>${p.texte||""}</p>
        ${p.image?`<img class="pimg" src="${p.image}">`:""}
        <div class="actions"><button class="btn-blue" onclick="republier('${p.id}')">🔁 Repartager en souvenir</button><button class="btn-grey" onclick="location.href='feed.html'">Voir dans le fil</button></div>`;
      box.appendChild(div);
    });
  });
});
window.republier=async (postId)=>{
  // On récupère le post original pour le repartager
  // Simplifié : on crée une copie avec la date d'aujourd'hui
  const snap=await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js").then(m=>m.get(ref(db,'jasonbook/posts/'+postId)));
  const p=snap.val(); if(!p) return;
  const newRef=push(ref(db,'jasonbook/posts'));
  await set(newRef,{ ...p, id:newRef.key, texte:"🕰️ Souvenir - Il y a "+anneesDepuis(p.timestamp)+" an(s) :\n\n"+(p.texte||""), date:new Date().toLocaleString(), timestamp:Date.now() });
  alert("Souvenir repartagé ! 🕰️❤️");
};
</script>
</body>
</html>
