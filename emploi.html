<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Emplois</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
/* ✅ MÊME SCROLL QUE LE PROFIL */
html{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw}
body{overflow-x:clip!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
img,video{max-width:100%}
/* ✅ MÊMES COULEURS QUE LE PROFIL */
:root{--blue:#7C3AED;--blue2:#A855F7;--or:#FFC107;--bg:#0F0F14;--card:#1C1C24;--grey:#A1A1AA;--line:#2A2A35}
body{background:var(--bg);color:#fff;min-height:100vh}
header{background:#111;display:flex;align-items:center;gap:12px;padding:12px 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--or)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#fff;font-size:21px;cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.logo span{width:34px;height:34px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:var(--or);font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--or));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:700px;margin:16px auto;padding:0 12px 30px}
.wrap h1{font-size:23px;letter-spacing:-.3px;color:#fff}
.wrap .sub{color:var(--grey);margin:4px 0 12px;font-size:14px;line-height:1.5}
.top-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top-bar input{flex:1;min-width:180px;padding:11px 14px;border:none;border-radius:999px;outline:none;background:#2A2A35;color:#fff;font-size:14px}
.top-bar input::placeholder{color:#888}
.top-bar input:focus{box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;padding:11px 16px;border-radius:999px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-green{background:#22C55E;color:#fff;border:none;padding:11px 16px;border-radius:999px;font-weight:800;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:none;background:#2A2A35;color:#fff;padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;flex:0 0 auto}
.cats button.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.card .head{display:flex;gap:12px}
.card .logo-emp{width:52px;height:52px;border-radius:12px;background:#2A2A35;color:var(--or);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card .info{flex:1;min-width:0}.card .info b{color:#fff}.card .info small{color:var(--grey);font-size:12.5px}
.card .salary{color:#4ADE80;font-weight:800;margin:6px 0;font-size:14px}
.card p{font-size:14px;white-space:pre-wrap;margin:6px 0;line-height:1.5;color:#EDEDEF}
.card .actions{display:flex;gap:8px;margin-top:10px}
.card small{color:var(--grey)}
.btn-grey{background:#2A2A35;color:#fff;border:none;padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer;flex:1;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--card);color:#fff;width:100%;max-width:460px;border-radius:14px;padding:20px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal-box h2{color:#fff}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;outline:none;background:#2A2A35;color:#fff;font-size:14px}
.modal-box input::placeholder,.modal-box textarea::placeholder{color:#888}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:var(--blue);background:#2A2A35}
.modal-box textarea{min-height:70px;resize:vertical}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.empty h3{color:#fff}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>

<!-- ✅ HEADER : JUSTE JASONBOOK, PLUS DE 🔍 🔔 💬 👤 -->
<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
</header>

<div class="wrap">
<h1>Emplois</h1>
<p class="sub">Trouve un emploi, un stage ou une mission à Kinshasa et en RDC.</p>
<div class="top-bar"><input id="searchInput" placeholder="🔍 Poste, entreprise, ville..." oninput="rendre()"><button class="btn-blue" onclick="ouvrirPublier()">+ Publier une offre</button></div>
<div class="cats"><button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button><button id="cat-CDI" onclick="setCat('CDI')">💼 CDI</button><button id="cat-CDD" onclick="setCat('CDD')">📋 CDD</button><button id="cat-Stage" onclick="setCat('Stage')">🎓 Stage</button><button id="cat-Freelance" onclick="setCat('Freelance')">💻 Freelance</button><button id="cat-Temps partiel" onclick="setCat('Temps partiel')">⏰ Temps partiel</button></div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none"><div style="font-size:44px">💼</div><h3>Aucune offre</h3><p>Sois le premier à publier une offre dans cette catégorie !</p></div>
</div>

<!-- ✅ PLUS DE BARRE EN BAS : SUPPRIMÉ 🏠 👥 ➕ 💼 👤 -->

<div class="modal" id="modalPublier"><div class="modal-box">
<h2>💼 Publier une offre d'emploi</h2>
<input id="e-titre" placeholder="Poste : ex. Vendeuse en boutique">
<input id="e-entreprise" placeholder="Entreprise : ex. Shop Kinshasa">
<input id="e-ville" placeholder="Ville : ex. Kinshasa - Gombe">
<input id="e-salaire" placeholder="Salaire : ex. 300 $ / mois">
<select id="e-type"><option>CDI</option><option>CDD</option><option>Stage</option><option>Freelance</option><option>Temps partiel</option></select>
<input id="e-contact" placeholder="Contact WhatsApp / Email">
<textarea id="e-desc" placeholder="Description, missions, profil recherché..."></textarea>
<button class="btn-blue" style="width:100%;margin-top:12px;padding:12px" onclick="publierOffre()">📢 Publier l'offre</button>
<button style="width:100%;margin-top:8px;padding:12px;background:#2A2A35;color:#fff;border:none;border-radius:999px;font-weight:700;cursor:pointer" onclick="fermerPublier()">Annuler</button>
</div></div>

<div class="modal" id="modalPostuler"><div class="modal-box">
<h2 id="postulerTitre">📩 Postuler</h2>
<p id="postulerSous" style="color:#A1A1AA;margin-top:6px"></p>
<textarea id="postulerMsg" placeholder="Présente-toi en quelques lignes : ton expérience, ta motivation..."></textarea>
<button class="btn-green" style="width:100%;margin-top:12px;padding:12px" onclick="envoyerCandidature()">📩 Envoyer ma candidature</button>
<button style="width:100%;margin-top:8px;padding:12px;background:#2A2A35;color:#fff;border:none;border-radius:999px;font-weight:700;cursor:pointer" onclick="fermerPostuler()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const myAv=document.getElementById('myAvatar');
if(myAv) myAv.innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let cat='Tout', offres=[], candidatures=new Set();
window.setCat=(c)=>{ cat=c; ['Tout','CDI','CDD','Stage','Freelance','Temps partiel'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
function rendre(){
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  const liste=offres.filter(o=> (cat==='Tout'||o.type===cat) && ((o.titre||"")+" "+(o.entreprise||"")+" "+(o.ville||"")).toLowerCase().includes(q)).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(o=>{
    const div=document.createElement('div'); div.className='card';
    const estMien=o.auteurUid===uid; const deja=candidatures.has(o.id);
    const nbCand=o.candidatures?Object.keys(o.candidatures).length:0;
    div.innerHTML=`
      <div class="head"><div class="logo-emp">💼</div><div class="info"><b style="font-size:17px">${o.titre||""}</b><br><small>${o.entreprise||""} • 📍 ${o.ville||""} • ${o.date||""}</small></div><span style="background:#2A2A35;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;height:fit-content;white-space:nowrap">${o.type||""}</span></div>
      <div class="salary">💰 ${o.salaire||"Salaire à discuter"}</div>
      <p>${o.description||""}</p>
      <small>👤 Publié par ${o.auteurNom||""} • ${nbCand} candidature${nbCand>1?'s':''}</small>
      <div class="actions">
        ${!estMien?`<button class="btn-blue" style="flex:1" onclick="ouvrirPostuler('${o.id}')" ${deja?'disabled style="opacity:.6"':''}>${deja?'✅ Candidature envoyée':'📩 Postuler'}</button>`:`<button class="btn-grey" onclick="voirCandidatures('${o.id}')">👀 Voir les candidatures (${nbCand})</button>`}
        <button class="btn-grey" onclick="partagerOffre('${o.id}')">↗️ Partager</button>
        ${estMien?`<button class="btn-grey" style="color:#FF6B6B" onclick="supprimerOffre('${o.id}')">🗑️</button>`:""}
      </div>
      <div id="cands-${o.id}" style="display:none;margin-top:10px;background:#2A2A35;padding:10px;border-radius:10px"></div>`;
    box.appendChild(div);
  });
}
window.ouvrirPublier=()=>document.getElementById('modalPublier').classList.add('open');
window.fermerPublier=()=>document.getElementById('modalPublier').classList.remove('open');
let offrePostuler=null;
window.ouvrirPostuler=(id)=>{ offrePostuler=id; const o=offres.find(x=>x.id===id); document.getElementById('postulerTitre').innerText="📩 Postuler : "+(o?o.titre:""); document.getElementById('postulerSous').innerText=(o?o.entreprise+" • "+o.ville:""); document.getElementById('postulerMsg').value="Bonjour, je suis "+monNom+". Je suis très intéressé(e) par ce poste. J'ai de l'expérience et je suis motivé(e). Merci de me contacter !"; document.getElementById('modalPostuler').classList.add('open'); };
window.fermerPostuler=()=>document.getElementById('modalPostuler').classList.remove('open');
window.envoyerCandidature=async()=>{
  const msg=document.getElementById('postulerMsg').value.trim(); if(!msg){ alert("Écris ta présentation"); return; }
  const o=offres.find(x=>x.id===offrePostuler); if(!o) return;
  await set(ref(db,'jasonbook/emplois/'+offrePostuler+'/candidatures/'+uid), { nom:monNom, photo:maPhoto||"", message:msg, date:new Date().toLocaleString(), timestamp:Date.now() });
  const nRef=push(ref(db,'jasonbook/notifications/'+o.auteurUid));
  await set(nRef,{ type:'emploi', deUid:uid, deNom:monNom, dePhoto:maPhoto||"", texte:monNom+" a postulé à ton offre : "+o.titre, date:new Date().toLocaleString(), timestamp:Date.now(), lu:false });
  fermerPostuler(); alert("Candidature envoyée ! 📩✅");
};
window.publierOffre=async()=>{
  const titre=document.getElementById('e-titre').value.trim();
  if(!titre){ alert("Titre obligatoire"); return; }
  const newRef=push(ref(db,'jasonbook/emplois'));
  await set(newRef,{ id:newRef.key, titre, entreprise:document.getElementById('e-entreprise').value.trim(), ville:document.getElementById('e-ville').value.trim(), salaire:document.getElementById('e-salaire').value.trim(), type:document.getElementById('e-type').value, contact:document.getElementById('e-contact').value.trim(), description:document.getElementById('e-desc').value.trim(), auteurUid:uid, auteurNom:monNom, date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerPublier(); alert("Offre publiée ! 💼✅");
  ['e-titre','e-entreprise','e-ville','e-salaire','e-contact','e-desc'].forEach(id=>document.getElementById(id).value="");
};
window.supprimerOffre=async(id)=>{ if(!confirm("Supprimer cette offre ?")) return; await remove(ref(db,'jasonbook/emplois/'+id)); };
window.partagerOffre=(id)=>{
  const o=offres.find(x=>x.id===id);
  const texte="💼 Offre d'emploi sur JASONBOOK : "+(o?o.titre:"")+" chez "+(o?o.entreprise:"")+" à "+(o?o.ville:"")+" - "+(o?o.salaire:"");
  if(navigator.share){ navigator.share({title:"JASONBOOK Emploi", text:texte, url:location.href}).catch(()=>{}); return; }
  navigator.clipboard.writeText(texte); alert("Offre copiée ! 📋");
};
window.voirCandidatures=(id)=>{
  const box=document.getElementById('cands-'+id);
  const o=offres.find(x=>x.id===id); if(!o) return;
  const cands=o.candidatures?Object.entries(o.candidatures).map(([cid,c])=>({cid,...c})):[];
  if(!cands.length){ box.innerHTML="<p>Aucune candidature pour le moment.</p>"; }
  else { box.innerHTML=cands.map(c=>`<div style="display:flex;gap:10px;margin-bottom:10px"><div class="avatar" style="width:36px;height:36px">${c.photo?`<img src="${c.photo}">`:c.nom.charAt(0)}</div><div><b>${c.nom}</b> <small>${c.date}</small><br><span style="font-size:13px">${c.message}</span></div></div>`).join(""); }
  box.style.display=box.style.display==='none'?'block':'none';
};
onValue(ref(db,'jasonbook/emplois'), s=>{ const d=s.val(); offres=d?Object.entries(d).map(([id,v])=>({id,...v})):[];
  const setC=new Set(); offres.forEach(o=>{ if(o.candidatures && o.candidatures[uid]) setC.add(o.id); });
  candidatures=setC; rendre(); });
</script>
</body>
</html>
