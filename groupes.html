<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Groupes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.top h1{font-size:23px;letter-spacing:-.3px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-grey{background:#f0f2f5;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:#fff;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs button.active{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.g-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);cursor:pointer}
.g-card .cover{height:130px;background:#e7f0ff;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.g-card .cover img{width:100%;height:100%;object-fit:cover}
.g-card .body{padding:12px}
.g-card h3{font-size:16px;margin-bottom:4px}.g-card p{font-size:13px;color:var(--grey);line-height:1.4;min-height:36px}
.g-card small{color:#999;font-size:12px}
.g-card .btns{display:flex;gap:7px;margin-top:10px}
.g-card .btns button{flex:1}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line)}
.post-head{display:flex;gap:10px;align-items:center}
.post-text{margin:10px 0;font-size:15px;white-space:pre-wrap;line-height:1.5}
.post img.main{width:100%;border-radius:10px;max-height:420px;object-fit:cover}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:460px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:10px;margin-top:8px;font-size:14px;outline:none;background:#f8f9fa}
.modal-box input:focus,.modal-box textarea:focus,.modal-box select:focus{border-color:var(--blue);background:#fff}
.modal-box textarea{min-height:70px;resize:vertical}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>Groupes</h1><button class="btn-blue" onclick="ouvrirCreate()">➕ Créer un groupe</button></div>
<div class="tabs">
<button id="t-tous" class="active" onclick="showTab('tous')">Tous les groupes</button>
<button id="t-mes" onclick="showTab('mes')">Mes groupes</button>
<button id="t-decouvrir" onclick="showTab('decouvrir')">Découvrir</button>
</div>

<div id="section-tous"><div class="grid" id="gridTous"></div><div class="empty" id="emptyTous" style="display:none"><div class="big">👨‍👩‍👧</div><p>Aucun groupe pour le moment.<br>Crée le premier groupe !</p></div></div>
<div id="section-mes" style="display:none"><div class="grid" id="gridMes"></div><div class="empty" id="emptyMes" style="display:none"><div class="big">👨‍👩‍👧</div><p>Tu n'es dans aucun groupe.</p></div></div>
<div id="section-decouvrir" style="display:none"><div class="grid" id="gridDecouvrir"></div><div class="empty" id="emptyDecouvrir" style="display:none"><div class="big">🌍</div><p>Aucun groupe à découvrir</p></div></div>

<div id="detailGroupe" style="display:none">
<div class="card">
<button class="btn-grey" onclick="fermerDetail()">← Retour aux groupes</button>
<div style="display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap">
<div style="width:80px;height:80px;border-radius:16px;background:#e7f0ff;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden" id="detailCover">👨‍👩‍👧</div>
<div style="flex:1"><h2 id="detailNom"></h2><p id="detailDesc" style="color:#65676b;font-size:14px"></p><small id="detailMeta"></small></div>
<button class="btn-blue" id="btnRejoindreDetail" onclick="toggleMembreDetail()">Rejoindre</button>
</div>
</div>
<div class="card">
<div style="display:flex;gap:8px"><input id="postGroupeTexte" placeholder="Publie dans ce groupe..." style="flex:1;padding:12px;border:1.5px solid #e4e6eb;border-radius:999px;outline:none;background:#f8f9fa"><button class="btn-blue" onclick="publierDansGroupe()">Publier</button></div>
</div>
<div id="postsGroupe"></div>
</div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="groupes.html">👨‍👩‍👧</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalCreate"><div class="modal-box">
<h2>Créer un groupe</h2>
<input id="gNom" placeholder="Nom du groupe *">
<textarea id="gDesc" placeholder="Description du groupe..."></textarea>
<select id="gType"><option value="Public">🌍 Public - Tout le monde peut voir</option><option value="Privé">🔒 Privé - Seulement les membres</option></select>
<input id="gPays" placeholder="Pays (ex: Congo)">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="creerGroupe()">Créer le groupe</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerCreate()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tousGroupes=[], mesGroupes=new Set(), groupeOuvert=null, onglet='tous';
window.showTab=(t)=>{
  onglet=t; fermerDetail();
  ['tous','mes','decouvrir'].forEach(x=>{
    document.getElementById('section-'+x).style.display = x===t ? 'block' : 'none';
    document.getElementById('t-'+x).classList.toggle('active', x===t);
  });
};
window.ouvrirCreate=()=>document.getElementById('modalCreate').classList.add('open');
window.fermerCreate=()=>document.getElementById('modalCreate').classList.remove('open');
window.fermerDetail=()=>{ document.getElementById('detailGroupe').style.display="none"; groupeOuvert=null; };
function carteGroupe(g){
  const estMembre=mesGroupes.has(g.id);
  const btn = estMembre ? `<button class="btn-grey" onclick="event.stopPropagation();quitterGroupe('${g.id}')">Quitter</button><button class="btn-blue" onclick="event.stopPropagation();ouvrirGroupe('${g.id}')">Voir</button>` : `<button class="btn-blue" onclick="event.stopPropagation();rejoindreGroupe('${g.id}')">Rejoindre</button><button class="btn-grey" onclick="event.stopPropagation();ouvrirGroupe('${g.id}')">Voir</button>`;
  return `<div class="g-card" onclick="ouvrirGroupe('${g.id}')"><div class="cover">${g.photo?`<img src="${g.photo}">`:"👨‍👩‍👧"}</div><div class="body"><h3>${g.nom||""}</h3><p>${g.description||""}</p><small>${g.type||"Public"} • ${g.membresCount||1} membre(s) • ${g.pays||""}</small><div class="btns">${btn}</div></div></div>`;
}
function rendre(){
  const gT=document.getElementById('gridTous'); gT.innerHTML=""; document.getElementById('emptyTous').style.display = tousGroupes.length?'none':'block';
  tousGroupes.forEach(g=> gT.innerHTML+=carteGroupe(g));
  const mes=tousGroupes.filter(g=>mesGroupes.has(g.id));
  const gM=document.getElementById('gridMes'); gM.innerHTML=""; document.getElementById('emptyMes').style.display = mes.length?'none':'block';
  mes.forEach(g=> gM.innerHTML+=carteGroupe(g));
  const dec=tousGroupes.filter(g=>!mesGroupes.has(g.id));
  const gD=document.getElementById('gridDecouvrir'); gD.innerHTML=""; document.getElementById('emptyDecouvrir').style.display = dec.length?'none':'block';
  dec.forEach(g=> gD.innerHTML+=carteGroupe(g));
}
window.creerGroupe=async()=>{
  const nom=document.getElementById('gNom').value.trim();
  const desc=document.getElementById('gDesc').value.trim();
  if(!nom){ alert("Donne un nom au groupe"); return; }
  const newRef=push(ref(db,'jasonbook/groupes'));
  await set(newRef,{ id:newRef.key, nom:nom, description:desc, type:document.getElementById('gType').value, pays:document.getElementById('gPays').value, createurUid:uid, createurNom:monNom, membresCount:1, date:new Date().toLocaleString(), timestamp:Date.now() });
  await set(ref(db,'jasonbook/membresGroupe/'+newRef.key+'/'+uid), true);
  await set(ref(db,'jasonbook/groupesUser/'+uid+'/'+newRef.key), true);
  fermerCreate(); alert("Groupe créé ! 🎉");
};
window.rejoindreGroupe=async (gid)=>{
  await set(ref(db,'jasonbook/membresGroupe/'+gid+'/'+uid), true);
  await set(ref(db,'jasonbook/groupesUser/'+uid+'/'+gid), true);
  const s=await get(ref(db,'jasonbook/groupes/'+gid)); const g=s.val()||{};
  await set(ref(db,'jasonbook/groupes/'+gid+'/membresCount'), (g.membresCount||0)+1);
};
window.quitterGroupe=async (gid)=>{
  if(!confirm("Quitter ce groupe ?")) return;
  await remove(ref(db,'jasonbook/membresGroupe/'+gid+'/'+uid));
  await remove(ref(db,'jasonbook/groupesUser/'+uid+'/'+gid));
  const s=await get(ref(db,'jasonbook/groupes/'+gid)); const g=s.val()||{};
  await set(ref(db,'jasonbook/groupes/'+gid+'/membresCount'), Math.max(0,(g.membresCount||1)-1));
};
window.ouvrirGroupe=async (gid)=>{
  groupeOuvert=gid;
  ['tous','mes','decouvrir'].forEach(x=>document.getElementById('section-'+x).style.display='none');
  const g=tousGroupes.find(x=>x.id===gid); if(!g) return;
  document.getElementById('detailGroupe').style.display="block";
  document.getElementById('detailNom').innerText=g.nom||"";
  document.getElementById('detailDesc').innerText=g.description||"";
  document.getElementById('detailMeta').innerText=`${g.type||""} • ${g.membresCount||1} membre(s) • Créé par ${g.createurNom||""}`;
  const btn=document.getElementById('btnRejoindreDetail');
  btn.innerText = mesGroupes.has(gid) ? "Quitter" : "Rejoindre";
  onValue(ref(db,'jasonbook/postsGroupe/'+gid), (snap)=>{
    const d=snap.val(); const box=document.getElementById('postsGroupe'); box.innerHTML="";
    if(!d){ box.innerHTML='<p style="text-align:center;color:#65676b">Aucune publication dans ce groupe</p>'; return; }
    Object.values(d).reverse().forEach(p=>{
      const div=document.createElement('div'); div.className='card';
      div.innerHTML=`<div class="post-head"><div class="avatar">${p.photoAuteur?`<img src="${p.photoAuteur}">`:(p.nomAuteur||"?").charAt(0)}</div><div><b>${p.nomAuteur}</b><br><small style="color:#65676b">${p.date||""}</small></div></div><div class="post-text">${p.texte||""}</div>${p.photoUrl?`<img class="main" src="${p.photoUrl}">`:""}`;
      box.appendChild(div);
    });
  });
};
window.toggleMembreDetail=async()=>{
  if(!groupeOuvert) return;
  if(mesGroupes.has(groupeOuvert)) await quitterGroupe(groupeOuvert); else await rejoindreGroupe(groupeOuvert);
  setTimeout(()=>{ const btn=document.getElementById('btnRejoindreDetail'); btn.innerText = mesGroupes.has(groupeOuvert) ? "Quitter" : "Rejoindre"; },500);
};
window.publierDansGroupe=async()=>{
  const txt=document.getElementById('postGroupeTexte').value.trim(); if(!txt || !groupeOuvert) return;
  if(!mesGroupes.has(groupeOuvert)){ alert("Rejoins d'abord le groupe pour publier"); return; }
  const newRef=push(ref(db,'jasonbook/postsGroupe/'+groupeOuvert));
  await set(newRef,{ auteurUid:uid, nomAuteur:monNom, photoAuteur:maPhoto||"", texte:txt, photoUrl:"", date:new Date().toLocaleString(), timestamp:Date.now() });
  document.getElementById('postGroupeTexte').value="";
};
onValue(ref(db,'jasonbook/groupes'), s=>{ const d=s.val(); tousGroupes=d?Object.entries(d).map(([id,g])=>({id,...g})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
onValue(ref(db,'jasonbook/groupesUser/'+uid), s=>{ const d=s.val(); mesGroupes=new Set(d?Object.keys(d):[]); rendre(); });
</script>
</body>
</html>
