<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Marché</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{font-size:23px;letter-spacing:-.3px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-grey{background:#f0f2f5;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:none;background:#fff;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.filters button.active{background:var(--blue);color:#fff}
.filters input,.filters select{border:none;background:#fff;padding:10px 14px;border-radius:999px;font-weight:600;outline:none;min-width:110px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.p-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);cursor:pointer}
.p-card .img{height:170px;background:#f0f2f5;position:relative}
.p-card .img img{width:100%;height:100%;object-fit:cover}
.p-card .img .prix{position:absolute;bottom:8px;left:8px;background:var(--blue);color:#fff;padding:5px 10px;border-radius:9px;font-weight:800;font-size:14px}
.p-card .img .etat{position:absolute;top:8px;right:8px;background:#fff;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
.p-card .info{padding:12px}
.p-card .info b{font-size:15px}
.p-card .info p{font-size:13px;color:var(--grey);margin:4px 0;line-height:1.4}
.p-card .info .actions{display:flex;gap:6px;margin-top:8px}
.p-card .info .actions button{flex:1}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:10px;margin-top:8px;font-size:14px;outline:none;background:#f8f9fa}
.modal-box input:focus,.modal-box textarea:focus,.modal-box select:focus{border-color:var(--blue);background:#fff}
.modal-box textarea{min-height:70px;resize:vertical}
.modal-box img{width:100%;border-radius:10px;margin-top:10px;max-height:220px;object-fit:cover}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher un produit..." id="searchInput" oninput="rendre()">
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>🛒 Marché</h1><button class="btn-blue" onclick="ouvrirVendre()">➕ Vendre un article</button></div>
<div class="filters">
<button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button>
<button id="cat-Téléphones" onclick="setCat('Téléphones')">📱 Téléphones</button>
<button id="cat-Vêtements" onclick="setCat('Vêtements')">👕 Vêtements</button>
<button id="cat-Maison" onclick="setCat('Maison')">🏠 Maison</button>
<button id="cat-Véhicules" onclick="setCat('Véhicules')">🚗 Véhicules</button>
<button id="cat-Autre" onclick="setCat('Autre')">📦 Autre</button>
<input id="prixMax" type="number" placeholder="Prix max" oninput="rendre()">
<input id="villeFilter" placeholder="Ville..." oninput="rendre()">
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🛒</div><h3>Aucun article pour le moment</h3><p>Sois le premier à vendre quelque chose !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="marche.html">🛒</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalVendre"><div class="modal-box">
<h2>Vendre un article</h2>
<input id="pNom" placeholder="Nom de l'article * (ex: iPhone 12)">
<input id="pPrix" type="number" placeholder="Prix * (en CDF ou $)">
<select id="pCat"><option>Téléphones</option><option>Vêtements</option><option>Maison</option><option>Véhicules</option><option>Autre</option></select>
<select id="pEtat"><option>Neuf</option><option>Très bon état</option><option>Bon état</option><option>Occasion</option></select>
<input id="pVille" placeholder="Ville">
<input id="pContact" placeholder="Contact (téléphone / WhatsApp)">
<textarea id="pDesc" placeholder="Description de l'article..."></textarea>
<button class="btn-grey" style="width:100%;margin-top:8px" onclick="document.getElementById('pPhoto').click()">📷 Ajouter une photo</button>
<input type="file" id="pPhoto" accept="image/*" style="display:none">
<img id="pPreview" style="display:none">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="publierProduit()">Publier l'article</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerVendre()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const maVille = localStorage.getItem('jasonbook_ville')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tous=[], cat='Tout', photoProd="";
document.getElementById('pVille').value=maVille;
window.setCat=(c)=>{ cat=c; ['Tout','Téléphones','Vêtements','Maison','Véhicules','Autre'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
window.ouvrirVendre=()=>document.getElementById('modalVendre').classList.add('open');
window.fermerVendre=()=>document.getElementById('modalVendre').classList.remove('open');
document.getElementById('pPhoto').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ photoProd=ev.target.result; document.getElementById('pPreview').src=photoProd; document.getElementById('pPreview').style.display="block"; }; r.readAsDataURL(f); });
function rendre(){
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const ville=(document.getElementById('villeFilter').value||"").toLowerCase();
  const prixMax=parseFloat(document.getElementById('prixMax').value)||Infinity;
  const box=document.getElementById('grid'); box.innerHTML="";
  const liste=tous.filter(p=>{
    const txt=((p.nom||"")+" "+(p.description||"")+" "+(p.categorie||"")).toLowerCase();
    return txt.includes(q) && (cat==='Tout'||p.categorie===cat) && (!ville||(p.ville||"").toLowerCase().includes(ville)) && (parseFloat(p.prix)||0) <= prixMax;
  });
  document.getElementById('emptyBox').style.display=liste.length?'none':'block';
  liste.forEach(p=>{
    const div=document.createElement('div'); div.className='p-card';
    div.innerHTML=`
      <div class="img">${p.photo?`<img src="${p.photo}">`:`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:50px">🛒</div>`}<span class="prix">${p.prix||""} CDF</span><span class="etat">${p.etat||""}</span></div>
      <div class="info"><b>${p.nom||""}</b><p>📍 ${p.ville||""} • 👤 ${p.vendeurNom||""}</p><p>${(p.description||"").substring(0,80)}${(p.description||"").length>80?'...':''}</p>
      <div class="actions"><button class="btn-blue" onclick="location.href='messages.html?uid=${p.vendeurUid}'">💬 Contacter</button>${p.vendeurUid===uid?`<button class="btn-grey" onclick="supprimerProduit('${p.id}')">🗑️</button>`:""}</div></div>`;
    box.appendChild(div);
  });
}
window.supprimerProduit=async (id)=>{ if(!confirm("Supprimer cet article ?")) return; await remove(ref(db,'jasonbook/marche/'+id)); };
window.publierProduit=async()=>{
  const nom=document.getElementById('pNom').value.trim();
  const prix=document.getElementById('pPrix').value.trim();
  if(!nom || !prix){ alert("Nom et prix obligatoires"); return; }
  const newRef=push(ref(db,'jasonbook/marche'));
  await set(newRef,{ id:newRef.key, nom:nom, prix:prix, categorie:document.getElementById('pCat').value, etat:document.getElementById('pEtat').value, ville:document.getElementById('pVille').value, contact:document.getElementById('pContact').value, description:document.getElementById('pDesc').value, photo:photoProd||"", vendeurUid:uid, vendeurNom:monNom, vendeurPhoto:maPhoto||"", date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerVendre(); photoProd=""; ['pNom','pPrix','pContact','pDesc'].forEach(id=>document.getElementById(id).value=""); document.getElementById('pPreview').style.display="none";
  alert("Article publié ! 🛒");
};
onValue(ref(db,'jasonbook/marche'), s=>{ const d=s.val(); tous=d?Object.entries(d).map(([id,p])=>({id,...p})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
</script>
</body>
</html>
