<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--blue:#1877F2;--bg:#f0f2f5;--grey:#65676b;--line:#eef0f3}
body{background:var(--bg);min-height:100vh}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--blue);font-size:21px;cursor:pointer;letter-spacing:-.3px}
.logo span{width:34px;height:34px;background:var(--blue);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 14px;border-radius:999px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:38px;height:38px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.top h1{font-size:23px;letter-spacing:-.3px}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn-grey{background:#f0f2f5;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:none;background:#fff;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.filters button.active{background:var(--blue);color:#fff}
.filters input{border:none;background:#fff;padding:10px 14px;border-radius:999px;font-weight:600;outline:none;min-width:160px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.a-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);cursor:pointer}
.a-card .img{height:170px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.a-card .img img{width:100%;height:100%;object-fit:cover}
.a-card .body{padding:11px}
.a-card h3{font-size:15px;margin-bottom:2px}.a-card .prix{color:var(--blue);font-weight:900;font-size:16px}
.a-card small{color:var(--grey);font-size:12px;display:block;margin-top:3px}
.a-card .btns{display:flex;gap:6px;margin-top:9px}
.a-card .btns button{flex:1}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line)}
.empty{text-align:center;color:var(--grey);padding:36px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.empty .big{font-size:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #e4e6eb;border-radius:10px;margin-top:8px;font-size:14px;outline:none;background:#f8f9fa}
.modal-box input:focus,.modal-box textarea:focus,.modal-box select:focus{border-color:var(--blue);background:#fff}
.modal-box textarea{min-height:60px;resize:vertical}
.modal-box img{width:100%;border-radius:10px;margin-top:10px;max-height:240px;object-fit:cover}
.detail-img{width:100%;max-height:380px;object-fit:cover;border-radius:12px}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:11px;box-shadow:0 -1px 8px rgba(0,0,0,.07);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="🔍 Rechercher un article..." id="searchInput" oninput="rendre()">
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>🛒 Marketplace</h1><button class="btn-blue" onclick="ouvrirVendre()">➕ Vendre un article</button></div>
<div class="filters">
<button id="cat-Tout" class="active" onclick="setCat('Tout')">Tout</button>
<button id="cat-Vêtements" onclick="setCat('Vêtements')">👕 Vêtements</button>
<button id="cat-Électronique" onclick="setCat('Électronique')">📱 Électronique</button>
<button id="cat-Véhicules" onclick="setCat('Véhicules')">🚗 Véhicules</button>
<button id="cat-Maison" onclick="setCat('Maison')">🏠 Maison</button>
<button id="cat-Beauté" onclick="setCat('Beauté')">💄 Beauté</button>
<button id="cat-Nourriture" onclick="setCat('Nourriture')">🍔 Nourriture</button>
<button id="cat-Autre" onclick="setCat('Autre')">📦 Autre</button>
<input id="villeFilter" placeholder="Filtrer par ville..." oninput="rendre()">
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyBox" style="display:none"><div class="big">🛒</div><h3>Aucun article pour le moment</h3><p>Sois le premier à vendre quelque chose !</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="marketplace.html">🛒</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalVendre"><div class="modal-box">
<h2>Vendre un article</h2>
<input id="aTitre" placeholder="Titre (ex: iPhone 12)">
<input id="aPrix" placeholder="Prix (ex: 150$ ou 150000 FC)">
<select id="aCat"><option>Vêtements</option><option>Électronique</option><option>Véhicules</option><option>Maison</option><option>Beauté</option><option>Nourriture</option><option>Autre</option></select>
<input id="aVille" placeholder="Ville">
<textarea id="aDesc" placeholder="Description, état, livraison..."></textarea>
<button class="btn-grey" style="width:100%;margin-top:10px" onclick="document.getElementById('aPhoto').click()">📷 Ajouter une photo</button>
<input type="file" id="aPhoto" accept="image/*" style="display:none">
<img id="aPreview" style="display:none">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="publierArticle()">Publier l'article</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerVendre()">Annuler</button>
</div></div>

<div class="modal" id="modalDetail"><div class="modal-box">
<button class="btn-grey" style="float:right" onclick="fermerDetail()">✕</button>
<img id="dImg" class="detail-img" style="display:none">
<h2 id="dTitre"></h2>
<p id="dPrix" style="color:#1877F2;font-weight:900;font-size:20px"></p>
<p id="dDesc" style="color:#333;margin:10px 0;white-space:pre-wrap"></p>
<p id="dMeta" style="color:#65676b;font-size:13px"></p>
<div style="display:flex;gap:8px;margin-top:14px">
<button class="btn-blue" style="flex:1;padding:12px" onclick="contacterVendeur()">💬 Contacter le vendeur</button>
<button class="btn-grey" id="btnSupp" style="display:none" onclick="supprimerArticle()">🗑️ Supprimer</button>
</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const maVille = localStorage.getItem('jasonbook_ville')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tous=[], cat='Tout', photoArticle="", articleOuvert=null;
document.getElementById('aVille').value=maVille;
window.setCat=(c)=>{ cat=c; ['Tout','Vêtements','Électronique','Véhicules','Maison','Beauté','Nourriture','Autre'].forEach(x=>document.getElementById('cat-'+x).classList.toggle('active',x===c)); rendre(); };
window.ouvrirVendre=()=>document.getElementById('modalVendre').classList.add('open');
window.fermerVendre=()=>document.getElementById('modalVendre').classList.remove('open');
window.fermerDetail=()=>document.getElementById('modalDetail').classList.remove('open');
document.getElementById('aPhoto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=ev=>{ photoArticle=ev.target.result; document.getElementById('aPreview').src=photoArticle; document.getElementById('aPreview').style.display="block"; };
  r.readAsDataURL(f);
});
function emojiCat(c){
  if(c==='Vêtements') return '👕'; if(c==='Électronique') return '📱'; if(c==='Véhicules') return '🚗';
  if(c==='Maison') return '🏠'; if(c==='Beauté') return '💄'; if(c==='Nourriture') return '🍔'; return '📦';
}
window.rendre=()=>{
  const q=(document.getElementById('searchInput').value||"").toLowerCase();
  const ville=(document.getElementById('villeFilter').value||"").toLowerCase();
  const grid=document.getElementById('grid'); grid.innerHTML="";
  const liste=tous.filter(a=>{
    const txt=((a.titre||"")+" "+(a.description||"")+" "+(a.categorie||"")).toLowerCase();
    return txt.includes(q) && (cat==='Tout' || a.categorie===cat) && (!ville || (a.ville||"").toLowerCase().includes(ville));
  });
  document.getElementById('emptyBox').style.display = liste.length?'none':'block';
  liste.forEach(a=>{
    const div=document.createElement('div'); div.className='a-card'; div.onclick=()=>ouvrirDetail(a);
    div.innerHTML=`<div class="img">${a.photo?`<img src="${a.photo}">`:emojiCat(a.categorie)}</div><div class="body"><h3>${a.titre||""}</h3><div class="prix">${a.prix||""}</div><small>${a.categorie||""} • ${a.ville||""} • ${a.vendeurNom||""}</small><div class="btns"><button class="btn-blue" onclick="event.stopPropagation();contacterDepuisCarte('${a.vendeurUid}')">💬 Contacter</button>${a.vendeurUid===uid?`<button class="btn-grey" onclick="event.stopPropagation();supprimerArticleId('${a.id}')">🗑️</button>`:""}</div></div>`;
    grid.appendChild(div);
  });
};
window.ouvrirDetail=(a)=>{
  articleOuvert=a; document.getElementById('modalDetail').classList.add('open');
  document.getElementById('dTitre').innerText=a.titre||"";
  document.getElementById('dPrix').innerText=a.prix||"";
  document.getElementById('dDesc').innerText=a.description||"";
  document.getElementById('dMeta').innerText=`${a.categorie||""} • ${a.ville||""} • Vendeur : ${a.vendeurNom||""} • ${a.date||""}`;
  const img=document.getElementById('dImg'); if(a.photo){ img.src=a.photo; img.style.display="block"; } else img.style.display="none";
  document.getElementById('btnSupp').style.display = a.vendeurUid===uid ? "block" : "none";
};
window.contacterVendeur=()=>{ if(articleOuvert) location.href='messages.html?uid='+articleOuvert.vendeurUid; };
window.contacterDepuisCarte=(vendeurUid)=>{ location.href='messages.html?uid='+vendeurUid; };
window.supprimerArticle=async()=>{ if(!articleOuvert) return; if(!confirm("Supprimer cet article ?")) return; await remove(ref(db,'jasonbook/marketplace/'+articleOuvert.id)); fermerDetail(); };
window.supprimerArticleId=async (id)=>{ if(!confirm("Supprimer cet article ?")) return; await remove(ref(db,'jasonbook/marketplace/'+id)); };
window.publierArticle=async()=>{
  const titre=document.getElementById('aTitre').value.trim();
  const prix=document.getElementById('aPrix').value.trim();
  if(!titre || !prix){ alert("Titre et prix obligatoires"); return; }
  const newRef=push(ref(db,'jasonbook/marketplace'));
  await set(newRef,{ id:newRef.key, titre:titre, prix:prix, categorie:document.getElementById('aCat').value, ville:document.getElementById('aVille').value, description:document.getElementById('aDesc').value, photo:photoArticle||"", vendeurUid:uid, vendeurNom:monNom, date:new Date().toLocaleString(), timestamp:Date.now() });
  fermerVendre(); photoArticle=""; document.getElementById('aTitre').value=""; document.getElementById('aPrix').value=""; document.getElementById('aDesc').value=""; document.getElementById('aPreview').style.display="none";
  alert("Article publié ! 🎉");
};
onValue(ref(db,'jasonbook/marketplace'), s=>{ const d=s.val(); tous=d?Object.entries(d).map(([id,a])=>({id,...a})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
</script>
</body>
</html>
