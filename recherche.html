<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Recherche</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:56px;height:56px;font-size:20px}
.wrap{max-width:800px;margin:16px auto;padding:0 12px}
.search-box{display:flex;gap:8px;background:#fff;padding:12px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search-box input{flex:1;border:none;background:#f0f2f5;padding:13px 15px;border-radius:20px;outline:none;font-size:15px}
.search-box button{border:none;background:#1877F2;color:#fff;padding:12px 20px;border-radius:20px;font-weight:800;cursor:pointer}
.filters{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:4px}
.filters button{border:none;background:#fff;padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.filters button.active{background:#1877F2;color:#fff}
.filters select{border:none;background:#fff;padding:10px 14px;border-radius:20px;font-weight:700;cursor:pointer;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.user-row{display:flex;gap:12px;align-items:center}
.user-row .info{flex:1;min-width:0}
.user-row b{font-size:15px}.user-row p{font-size:13px;color:#65676b}
.user-row .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-grey{background:#e4e6eb;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.post-head{display:flex;gap:10px;align-items:center}
.post-text{margin:10px 0;font-size:15px;white-space:pre-wrap}
.post img.main{width:100%;border-radius:10px;max-height:420px;object-fit:cover}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{border:none;background:#f0f2f5;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.empty{text-align:center;color:#65676b;padding:40px 10px;background:#fff;border-radius:12px}
.empty .big{font-size:50px}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
<link rel="stylesheet" href="Assets/theme.css">
<script src="Assets/theme.js"></script>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<div class="icons"><a href="feed.html">🏠</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="search-box">
<input id="query" placeholder="Rechercher une personne, une publication..." oninput="rechercher()" onkeydown="if(event.key==='Enter') rechercher()">
<button onclick="rechercher()">🔍</button>
</div>

<div class="filters">
<button id="f-tout" class="active" onclick="setFiltre('tout')">Tout</button>
<button id="f-personnes" onclick="setFiltre('personnes')">Personnes</button>
<button id="f-posts" onclick="setFiltre('posts')">Publications</button>
<button id="f-groupes" onclick="setFiltre('groupes')">Groupes</button>
<select id="filtrePays" onchange="rechercher()">
<option value="">🌍 Tous les pays</option>
<option value="Congo">🇨🇩 Congo</option>
<option value="France">🇫🇷 France</option>
<option value="Belgique">🇧🇪 Belgique</option>
<option value="Suisse">🇨🇭 Suisse</option>
<option value="Canada">🇨🇦 Canada</option>
<option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
<option value="Sénégal">🇸🇳 Sénégal</option>
<option value="Cameroun">🇨🇲 Cameroun</option>
<option value="USA">🇺🇸 USA</option>
<option value="Angleterre">🇬🇧 Angleterre</option>
<option value="Maroc">🇲🇦 Maroc</option>
<option value="Algérie">🇩🇿 Algérie</option>
<option value="Tunisie">🇹🇳 Tunisie</option>
<option value="Bénin">🇧🇯 Bénin</option>
<option value="Togo">🇹🇬 Togo</option>
<option value="Gabon">🇬🇦 Gabon</option>
<option value="Mali">🇲🇱 Mali</option>
<option value="Guinée">🇬🇳 Guinée</option>
</select>
</div>

<div id="results"></div>
<div class="empty" id="emptyBox"><div class="big">🔍</div><h3>Recherche sur JASONBOOK</h3><p>Tape un nom, une ville, une activité ou un mot d'une publication.</p></div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="messages.html">💬</a><a href="profil.html">👤</a></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();

let tousUsers=[], tousPosts=[], tousGroupes=[], mesAmis=new Set(), demandesEnvoyees=new Set(), filtre='tout';
onValue(ref(db,'jasonbook/users'), s=>{ const d=s.val(); tousUsers=d?Object.values(d).filter(u=>u.uid!==uid):[]; rechercher(); });
onValue(ref(db,'jasonbook/posts'), s=>{ const d=s.val(); tousPosts=d?Object.entries(d).map(([id,p])=>({id,...p})).reverse():[]; rechercher(); });
onValue(ref(db,'jasonbook/groupes'), s=>{ const d=s.val(); tousGroupes=d?Object.entries(d).map(([id,g])=>({id,...g})):[]; rechercher(); });
onValue(ref(db,'jasonbook/amis/'+uid), s=>{ const d=s.val(); mesAmis=new Set(d?Object.keys(d):[]); rechercher(); });
onValue(ref(db,'jasonbook/demandesEnvoyees/'+uid), s=>{ const d=s.val(); demandesEnvoyees=new Set(d?Object.keys(d):[]); rechercher(); });

window.setFiltre=(f)=>{ filtre=f; ['tout','personnes','posts','groupes'].forEach(x=>document.getElementById('f-'+x).classList.toggle('active',x===f)); rechercher(); };
function avatar(photo, lettre){ return photo ? `<img src="${photo}">` : lettre; }

window.rechercher=()=>{
  const q=document.getElementById('query').value.trim().toLowerCase();
  const pays=document.getElementById('filtrePays').value.toLowerCase();
  const box=document.getElementById('results'); box.innerHTML="";
  const vide = !q && !pays;
  document.getElementById('emptyBox').style.display = vide ? 'block' : 'none';
  if(vide){
    // Si rien tapé : montrer les personnes populaires
    if(filtre==='tout' || filtre==='personnes'){
      box.innerHTML+='<h3 style="margin:12px 0 8px">Personnes à découvrir 🌍</h3>';
      tousUsers.slice(0,10).forEach(u=> box.innerHTML+=carteUser(u));
    }
    return;
  }
  let trouve=false;
  // PERSONNES
  if(filtre==='tout' || filtre==='personnes'){
    const users=tousUsers.filter(u=>{
      const txt=((u.nomComplet||"")+" "+(u.ville||"")+" "+(u.pays||"")+" "+(u.activite||"")).toLowerCase();
      return txt.includes(q) && (!pays || (u.pays||"").toLowerCase().includes(pays));
    });
    if(users.length){ trouve=true; if(filtre==='tout') box.innerHTML+='<h3 style="margin:12px 0 8px">Personnes</h3>'; users.slice(0,30).forEach(u=> box.innerHTML+=carteUser(u)); }
  }
  // POSTS
  if(filtre==='tout' || filtre==='posts'){
    const posts=tousPosts.filter(p=>{
      const txt=((p.texte||"")+" "+(p.nomAuteur||"")+" "+(p.ville||"")+" "+(p.pays||"")).toLowerCase();
      return txt.includes(q) && (!pays || (p.pays||"").toLowerCase().includes(pays));
    });
    if(posts.length){ trouve=true; if(filtre==='tout') box.innerHTML+='<h3 style="margin:12px 0 8px">Publications</h3>'; posts.slice(0,20).forEach(p=> box.innerHTML+=cartePost(p)); }
  }
  // GROUPES
  if(filtre==='tout' || filtre==='groupes'){
    const groupes=tousGroupes.filter(g=>{
      const txt=((g.nom||"")+" "+(g.description||"")).toLowerCase();
      return txt.includes(q);
    });
    if(groupes.length){ trouve=true; if(filtre==='tout') box.innerHTML+='<h3 style="margin:12px 0 8px">Groupes</h3>'; groupes.forEach(g=> box.innerHTML+=`<div class="card"><div class="user-row"><div class="avatar big">👨‍👩‍👧</div><div class="info"><b>${g.nom||""}</b><p>${g.description||""}</p></div><button class="btn-blue" onclick="location.href='groupes.html'">Voir</button></div></div>`); }
  }
  if(!trouve && (q||pays)){
    box.innerHTML=`<div class="empty"><div class="big">😔</div><h3>Aucun résultat</h3><p>Essaie un autre nom ou un autre mot.</p></div>`;
  }
};

function carteUser(u){
  const lettre=(u.prenom||"?").charAt(0).toUpperCase();
  let btn="";
  if(mesAmis.has(u.uid)) btn=`<button class="btn-grey" onclick="location.href='messages.html?uid=${u.uid}'">💬 Message</button>`;
  else if(demandesEnvoyees.has(u.uid)) btn=`<button class="btn-grey" disabled>En attente...</button>`;
  else btn=`<button class="btn-blue" onclick="envoyerDemande('${u.uid}')">➕ Ajouter</button>`;
  return `<div class="card"><div class="user-row"><div class="avatar big" onclick="location.href='profil-ami.html?uid=${u.uid}'">${avatar(u.photoProfil, lettre)}</div><div class="info"><b style="cursor:pointer" onclick="location.href='profil-ami.html?uid=${u.uid}'">${u.nomComplet||""}</b><p>${u.activite||""} • ${u.ville||""} • ${u.pays||""}</p></div><div class="btns">${btn}<button class="btn-grey" onclick="location.href='profil-ami.html?uid=${u.uid}'">Voir</button></div></div></div>`;
}
function cartePost(p){
  return `<div class="card"><div class="post-head"><div class="avatar">${avatar(p.photoAuteur,(p.nomAuteur||"?").charAt(0))}</div><div><b>${p.nomAuteur||""}</b><br><small style="color:#65676b">${p.ville||""} • ${p.date||""}</small></div></div><div class="post-text">${p.texte||""}</div>${p.photoUrl?`<img class="main" src="${p.photoUrl}">`:""}<div class="actions"><button onclick="likerPost('${p.id}',${p.likesCount||0})">👍 ${p.likesCount||0} J'aime</button><button onclick="location.href='feed.html'">💬 Commenter</button></div></div>`;
}
window.likerPost=async (id, actuel)=>{ await set(ref(db,'jasonbook/posts/'+id+'/likesCount'), actuel+1); };
window.envoyerDemande=async (cibleUid)=>{
  await set(ref(db,'jasonbook/demandes/'+cibleUid+'/'+uid), { deUid:uid, deNom:monNom, date:new Date().toLocaleString() });
  await set(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+cibleUid), { versUid:cibleUid, date:new Date().toLocaleString() });
  const nRef=push(ref(db,'jasonbook/notifications/'+cibleUid));
  await set(nRef,{ type:"demande", texte:monNom+" t'a envoyé une demande d'ami", deUid:uid, deNom:monNom, date:new Date().toLocaleString(), lu:false });
  alert("Demande envoyée !");
};
// Si ?q= dans l'URL
const params=new URLSearchParams(location.search);
if(params.get('q')){ document.getElementById('query').value=params.get('q'); }
</script>
</body>
</html>
