<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JASONBOOK ✨ - Mes amis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
:root{--bg:#0A0A0F;--card:#16161F;--card2:#1F1F2E;--violet:#7C3AED;--gold:#FFC107;--muted:#A1A1AA;--line:#26262F}
body{background:var(--bg);color:#fff;min-height:100vh;padding-bottom:92px;overflow-x:hidden}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);padding:8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.logo{font-size:16px;font-weight:900;white-space:nowrap;flex-shrink:0}
.logo i{color:var(--gold);font-style:normal}
.logo small{display:block;font-size:7px;color:var(--muted);letter-spacing:.8px}
.search-top{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-notif,.btn-menu{width:34px;height:34px;min-width:34px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.wrap{max-width:650px;margin:0 auto;padding:14px 12px}
.head h1{font-size:24px}
.head p{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:flex;gap:10px;margin:14px 0}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stats b{font-size:22px;color:var(--gold);display:block}
.stats small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--card);color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.tabs button.active{background:linear-gradient(135deg,var(--gold),#FF9800);color:#000}
.search-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search-box input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font-size:14px}
.user-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.info b{font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.info small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.badge-new{background:var(--gold);color:#111;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px}
.badge-statut{background:var(--card2);color:#ccc;font-size:10px;padding:3px 7px;border-radius:999px}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{border:none;padding:8px 12px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}
.btn-violet{background:var(--violet);color:#fff}
.btn-gold{background:var(--gold);color:#111}
.btn-grey{background:var(--card2);color:#fff}
.btn-red{background:#E0245E;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px;background:var(--card);border-radius:16px;border:1px solid var(--line)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(10,10,15,.98);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bottom button{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;flex:1}
.bottom button.active{color:var(--gold)}
.bottom button span{font-size:22px}
.bottom .centre{width:52px;height:52px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--violet),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;border:4px solid #0A0A0F;flex:none}
</style>
</head>
<body>

<div class="top">
<div class="logo" onclick="location.href='feed.html'">JASON<i>BOOK</i> ✨<small>MADE IN KINSHASA</small></div>
<div class="search-top" onclick="location.href='recherche.html'">🔍 Chercher...</div>
<button class="btn-notif" onclick="location.href='notifications.html'">🔔</button>
<button class="btn-menu" onclick="location.href='profil.html'">☰</button>
</div>

<div class="wrap">
<div class="head"><h1>👥 Mes amis</h1><p>Gère tes relations et découvre de nouvelles personnes.</p></div>
<div class="stats">
<div><b id="nbUsers">0</b><small>Utilisateurs</small></div>
<div><b id="nbAmis">0</b><small>Mes amis</small></div>
<div><b id="nbDemandes">0</b><small>Demandes reçues</small></div>
</div>
<div class="tabs">
<button class="active" data-filtre="tous" onclick="setFiltre('tous',this)">🌍 Tous (<span id="cTous">0</span>)</button>
<button data-filtre="recues" onclick="setFiltre('recues',this)">📩 Reçues</button>
<button data-filtre="amis" onclick="setFiltre('amis',this)">🤝 Amis (<span id="cAmis">0</span>)</button>
<button data-filtre="envoyees" onclick="setFiltre('envoyees',this)">📤 Envoyées</button>
</div>
<div class="search-box">🔍 <input id="recherche" placeholder="Rechercher un utilisateur..." oninput="rendre()"></div>
<div id="list"></div>
<div class="empty" id="emptyBox" style="display:none">Aucun utilisateur trouvé.<br><small>Si quelqu'un vient de s'inscrire, il apparaît ici en quelques secondes.</small></div>
<p id="debug" style="text-align:center;color:#555;font-size:11px;margin-top:10px"></p>
</div>

<div class="bottom">
<button onclick="location.href='feed.html'"><span>🏠</span>Accueil</button>
<button class="active" onclick="location.href='amis.html'"><span>👥</span>Amis</button>
<button onclick="location.href='creer-post.html'"><span class="centre">+</span></button>
<button onclick="location.href='messages.html'"><span>💬</span>Messages</button>
<button onclick="location.href='profil.html'"><span>👤</span>Moi</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,set,remove,push,get} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U",authDomain:"starlink-investit.firebaseapp.com",databaseURL:"https://starlink-investit-default-rtdb.firebaseio.com",projectId:"starlink-investit",storageBucket:"starlink-investit.firebasestorage.app",messagingSenderId:"807081599583",appId:"1:807081599583:web:e00ec3959bc4acdae031ea"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const uid=localStorage.getItem("jasonbook_uid"); if(!uid) location.href="index.html";
const monNom=localStorage.getItem("jasonbook_nom")||"";
const maPhoto=localStorage.getItem("jasonbook_photo")||"";
let tousUsers=[], mesAmis=new Set(), demandesRecuesMap={}, demandesEnvoyeesMap={}, filtre="tous";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function estNouveau(ts){ if(!ts) return false; return (Date.now()-ts) < 7*24*60*60*1000; }
function extraireDemandes(data){
  const map={};
  Object.entries(data||{}).forEach(([cle,val])=>{
    if(!val || typeof val!=="object") return;
    const vraiUid = val.deUid || val.aUid || val.uid || cle;
    const nom = val.deNom || val.nom || val.aNom || "Utilisateur";
    const photo = val.dePhoto || val.photo || val.aPhoto || "";
    map[vraiUid]={cleFirebase:cle, nom, photo, timestamp:val.timestamp||0};
  });
  return map;
}
window.setFiltre=(f,btn)=>{ filtre=f; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); rendre(); };
function rendre(){
  const q=(document.getElementById('recherche').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  // On fusionne : profils + personnes qui ont envoyé une demande
  let all=[...tousUsers];
  Object.entries(demandesRecuesMap).forEach(([id,d])=>{
    if(!all.find(u=>u.uid===id)) all.push({uid:id, nom:d.nom, photo:d.photo, ville:"", pays:"", metier:"", timestamp:d.timestamp||0});
  });
  let liste=all.filter(u=>u.uid!==uid);
  if(filtre==="amis") liste=liste.filter(u=>mesAmis.has(u.uid));
  if(filtre==="recues") liste=liste.filter(u=>demandesRecuesMap[u.uid]);
  if(filtre==="envoyees") liste=liste.filter(u=>demandesEnvoyeesMap[u.uid]);
  if(q) liste=liste.filter(u=>(u.nom+" "+(u.ville||"")+" "+(u.metier||"")).toLowerCase().includes(q));
  liste.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  document.getElementById('emptyBox').style.display=liste.length?"none":"block";
  document.getElementById('debug').innerText="Dernière mise à jour : "+new Date().toLocaleTimeString()+" • Total dans la base : "+tousUsers.length;
  liste.forEach(u=>{
    const isAmi=mesAmis.has(u.uid);
    const isRecue=!!demandesRecuesMap[u.uid];
    const isEnvoyee=!!demandesEnvoyeesMap[u.uid];
    let statut=""; let btns="";
    if(isAmi){ statut='<span class="badge-statut">Ami</span>'; btns=`<button class="btn-violet" onclick="allerMessage('${u.uid}')">💬 Message</button><button class="btn-grey" onclick="location.href='profil-ami.html?uid=${u.uid}'">Profil</button><button class="btn-red" onclick="retirerAmi('${u.uid}')">Retirer</button>`; }
    else if(isRecue){ statut='<span class="badge-statut">Demande reçue</span>'; btns=`<button class="btn-gold" onclick="accepterDemande('${u.uid}')">✅ Accepter</button><button class="btn-red" onclick="refuserDemande('${u.uid}')">Refuser</button>`; }
    else if(isEnvoyee){ statut='<span class="badge-statut">Envoyée</span>'; btns=`<button class="btn-grey">En attente</button><button class="btn-red" onclick="annulerDemande('${u.uid}')">Annuler</button>`; }
    else { btns=`<button class="btn-gold" onclick="envoyerDemande('${u.uid}','${esc(u.nom)}')">➕ Ajouter</button><button class="btn-grey" onclick="location.href='profil-ami.html?uid=${u.uid}'">Profil</button>`; }
    const div=document.createElement('div'); div.className='user-card';
    div.innerHTML=`<div class="avatar">${u.photo?`<img src="${esc(u.photo)}">`:esc((u.nom||"?").charAt(0).toUpperCase())}</div><div class="info"><b>${esc(u.nom)} ${estNouveau(u.timestamp)?'<span class="badge-new">NOUVEAU</span>':''} ${statut}</b><small>${esc(u.metier||"")}${u.metier&&u.ville?" • ":""}${esc(u.ville||"")}${u.pays?" • "+esc(u.pays):""}</small><div class="btns">${btns}</div></div>`;
    box.appendChild(div);
  });
  document.getElementById('nbUsers').innerText=all.filter(u=>u.uid!==uid).length;
  document.getElementById('nbAmis').innerText=mesAmis.size;
  document.getElementById('nbDemandes').innerText=Object.keys(demandesRecuesMap).length;
  document.getElementById('cTous').innerText=all.filter(u=>u.uid!==uid).length;
  document.getElementById('cAmis').innerText=mesAmis.size;
}
window.allerMessage=(amiUid)=>{ location.href='messages.html?ami='+amiUid; };
window.envoyerDemande=async (cibleUid,nom)=>{
  const n1=push(ref(db,'jasonbook/demandes/'+cibleUid)); await set(n1,{deUid:uid,deNom:monNom,dePhoto:maPhoto||"",date:new Date().toLocaleString(),timestamp:Date.now()});
  const n2=push(ref(db,'jasonbook/demandesEnvoyees/'+uid)); await set(n2,{aUid:cibleUid,date:new Date().toLocaleString(),timestamp:Date.now()});
  const n=push(ref(db,'jasonbook/notifications/'+cibleUid)); await set(n,{type:"demande_ami",texte:monNom+" t'a envoyé une demande d'ami",deUid:uid,deNom:monNom,date:new Date().toLocaleString(),timestamp:Date.now(),lu:false});
  alert("Demande envoyée à "+nom+" ✅");
};
window.annulerDemande=async (cibleUid)=>{
  const cle=demandesEnvoyeesMap[cibleUid]?.cleFirebase;
  if(cle) await remove(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+cle));
  const snap=await get(ref(db,'jasonbook/demandes/'+cibleUid)); const d=snap.val()||{};
  for(const [k,v] of Object.entries(d)){ if(v.deUid===uid) await remove(ref(db,'jasonbook/demandes/'+cibleUid+'/'+k)); }
};
window.accepterDemande=async (deUid)=>{
  await set(ref(db,'jasonbook/amis/'+uid+'/'+deUid),{timestamp:Date.now()});
  await set(ref(db,'jasonbook/amis/'+deUid+'/'+uid),{timestamp:Date.now()});
  const cle=demandesRecuesMap[deUid]?.cleFirebase;
  if(cle) await remove(ref(db,'jasonbook/demandes/'+uid+'/'+cle));
  alert("Ami ajouté ✅");
};
window.refuserDemande=async (deUid)=>{
  const cle=demandesRecuesMap[deUid]?.cleFirebase;
  if(cle) await remove(ref(db,'jasonbook/demandes/'+uid+'/'+cle));
};
window.retirerAmi=async (amiUid)=>{ if(!confirm("Retirer cet ami ?")) return; await remove(ref(db,'jasonbook/amis/'+uid+'/'+amiUid)); await remove(ref(db,'jasonbook/amis/'+amiUid+'/'+uid)); };
onValue(ref(db,'jasonbook/users'),s=>{
  const d=s.val()||{};
  tousUsers=Object.entries(d).map(([uid2,u])=>({uid:uid2, nom:u.nom||u.name||"Utilisateur", photo:u.photo||u.photoUrl||"", ville:u.ville||"", pays:u.pays||"", metier:u.metier||u.profession||"", timestamp:u.timestamp||u.createdAt||0}));
  rendre();
});
onValue(ref(db,'jasonbook/amis/'+uid),s=>{ const d=s.val()||{}; mesAmis=new Set(Object.keys(d)); rendre(); });
onValue(ref(db,'jasonbook/demandes/'+uid),s=>{ demandesRecuesMap=extraireDemandes(s.val()||{}); rendre(); });
onValue(ref(db,'jasonbook/demandesEnvoyees/'+uid),s=>{ demandesEnvoyeesMap=extraireDemandes(s.val()||{}); rendre(); });
</script>
</body>
</html>
