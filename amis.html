<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JASONBOOK - Profil Ami</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#E9EBEE;color:#111;min-height:100vh;padding-bottom:40px}
:root{--violet:#7C3AED;--or:#FFC107;--carte:#fff}
header{background:#fff;position:sticky;top:0;z-index:30;border-bottom:1px solid #DDD;display:flex;align-items:center;gap:10px;padding:10px 12px}
header .logo{font-weight:900;font-size:22px;flex:1}
header .logo span{width:34px;height:34px;background:linear-gradient(135deg,var(--or),#FF9800);color:#111;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
header .logo i{color:var(--or);font-style:normal}
header input{flex:1;max-width:220px;padding:9px 12px;border:none;background:#EEE;border-radius:999px;outline:none;font-size:13px}
.cover{background:#1877F2;height:180px;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{width:140px;height:140px;border-radius:50%;background:#1877F2;border:5px solid #fff;position:absolute;left:50%;transform:translateX(-50%);bottom:-70px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#fff;overflow:hidden}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.card{background:#fff;margin:90px 12px 0;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h1{font-size:26px;margin-top:4px}
.card .sub{color:#666;font-size:13px;margin:4px 0 12px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btns button{border:none;padding:11px 18px;border-radius:8px;font-weight:800;cursor:pointer;font-size:14px}
.btn-ami{background:#22C55E;color:#fff}
.btn-msg{background:#EEE;color:#111}
.btn-ajouter{background:#1877F2;color:#fff}
.btn-bloquer{background:#FEE;color:#C00}
.section{background:#fff;margin:12px;border-radius:12px;padding:14px}
.section h3{font-size:16px;margin-bottom:8px}
.post{background:#fff;margin:12px;border-radius:12px;padding:12px}
.post b{font-size:14px}
.post p{font-size:14px;line-height:1.5;margin:6px 0}
.post img{width:100%;border-radius:10px;margin-top:8px}
.debug{font-size:11px;color:#888;text-align:center;padding:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #DDD;display:flex;justify-content:space-around;padding:10px 0;z-index:30}
.bottom-nav a{font-size:26px;text-decoration:none}
</style>
</head>
<body>
<header><div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON <i>BOOK</i></div><input placeholder="🔍 Rechercher" onclick="location.href='recherche.html'"></header>
<div class="cover" id="cover"><div class="avatar-wrap" id="avatar">?</div></div>
<div class="card">
<h1 id="nom">Chargement...</h1>
<p class="sub" id="infos">...</p>
<p class="sub" id="nbAmis"></p>
<div class="btns" id="btns">
<button class="btn-ajouter" id="btnAction" onclick="actionAmi()">➕ Ajouter</button>
<button class="btn-msg" onclick="ecrireMessage()">💬 Message</button>
<button class="btn-bloquer" onclick="bloquer()">🚫 Bloquer</button>
</div>
</div>
<div class="section"><h3>À propos</h3><p id="apropos" style="font-size:14px;color:#333;line-height:1.5">...</p></div>
<div class="section"><h3>Publications de cette personne</h3><div id="posts"></div></div>
<div class="debug" id="debug"></div>

<div class="bottom-nav">
<a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="messages.html">💬</a><a href="profil.html">👤</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const params = new URLSearchParams(location.search);
let targetUid = params.get('uid');
const monNom = localStorage.getItem('jasonbook_nom')||"";
let userData=null, vraiUid=null, estAmi=false, demandeEnvoyee=false;

if(!targetUid){ document.getElementById('nom').innerText="Aucun profil choisi"; }

async function charger(){
  if(!targetUid) return;
  // 1. Essayer directement users / targetUid
  let snap = await get(ref(db,'jasonbook/users/'+targetUid));
  if(snap.val()){ userData={uid:targetUid, ...snap.val()}; vraiUid=targetUid; }
  else {
    // 2. Scanner TOUS les users - peut-être que son profil est sous une autre clé
    const tous = await get(ref(db,'jasonbook/users'));
    const d = tous.val()||{};
    for(const [key,u] of Object.entries(d)){
      if(key===targetUid || u.uid===targetUid || u.id===targetUid){ userData={uid:key, ...u}; vraiUid=key; break; }
    }
    // 3. Si toujours rien, chercher son nom dans la demande / notification
    if(!userData){
      const dem = await get(ref(db,'jasonbook/demandes/'+uid+'/'+targetUid));
      const dem2 = await get(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+targetUid));
      const notifs = await get(ref(db,'jasonbook/notifications/'+uid));
      let nomTrouve="";
      if(dem.val() && dem.val().deNom) nomTrouve=dem.val().deNom;
      if(!nomTrouve && notifs.val()){
        for(const n of Object.values(notifs.val())){ if(n.deUid===targetUid && n.deNom){ nomTrouve=n.deNom; break; } }
      }
      // ✅ On affiche quand même son nom, pas "Profil introuvable"
      userData={uid:targetUid, nomComplet: nomTrouve || "Utilisateur JASONBOOK", prenom: nomTrouve ? nomTrouve.split(' ')[0] : "?", photoProfil:"", pays:"", activite:"", bio:"Ce compte a été créé 2 fois, son profil est sous un autre identifiant. Mais tu peux lui écrire."};
      vraiUid=targetUid;
    }
  }
  afficher();
  // Amis ?
  const amisSnap = await get(ref(db,'jasonbook/amis/'+uid+'/'+targetUid));
  const amisSnap2 = vraiUid!==targetUid ? await get(ref(db,'jasonbook/amis/'+uid+'/'+vraiUid)) : null;
  estAmi = !!(amisSnap.val() || (amisSnap2 && amisSnap2.val()));
  const envSnap = await get(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+targetUid));
  demandeEnvoyee = !!envSnap.val();
  majBouton();
  // Nombre d'amis de cette personne - on essaie les 2 uids
  let nb=0;
  const a1 = await get(ref(db,'jasonbook/amis/'+targetUid));
  if(a1.val()) nb=Object.keys(a1.val()).length;
  if(!nb && vraiUid!==targetUid){ const a2=await get(ref(db,'jasonbook/amis/'+vraiUid)); if(a2.val()) nb=Object.keys(a2.val()).length; }
  document.getElementById('nbAmis').innerText = nb ? nb+" ami(s)" : "1 ami";
  // Posts - on essaie les 2 uids
  chargerPosts();
}
function afficher(){
  if(!userData) return;
  const nom = userData.nomComplet || userData.prenom || "Utilisateur";
  document.getElementById('nom').innerText = nom;
  document.getElementById('infos').innerText = (userData.activite||"") + (userData.pays ? " • "+userData.pays : "");
  document.getElementById('apropos').innerText = userData.bio || userData.aPropos || "Aucune info.";
  const av=document.getElementById('avatar');
  if(userData.photoProfil) av.innerHTML=`<img src="${userData.photoProfil}">`;
  else av.innerText=(userData.prenom||"?").charAt(0).toUpperCase();
  if(userData.photoCouverture) document.getElementById('cover').innerHTML=`<img src="${userData.photoCouverture}"><div class="avatar-wrap">${av.innerHTML}</div>`;
  document.getElementById('debug').innerText = "UID demandé : "+targetUid+" • Profil trouvé sous : "+vraiUid;
}
function majBouton(){
  const b=document.getElementById('btnAction');
  if(estAmi){ b.innerText="✅ Ami"; b.className="btn-ami"; b.onclick=()=>{ if(confirm("Retirer cet ami ?")) retirerAmi(); }; }
  else if(demandeEnvoyee){ b.innerText="En attente..."; b.className="btn-msg"; b.onclick=()=>annulerDemande(); }
  else { b.innerText="➕ Ajouter"; b.className="btn-ajouter"; b.onclick=()=>envoyerDemande(); }
}
window.actionAmi=()=>{};
async function envoyerDemande(){
  await set(ref(db,'jasonbook/demandes/'+targetUid+'/'+uid),{deUid:uid, deNom:monNom, date:new Date().toLocaleString()});
  await set(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+targetUid),{versUid:targetUid, date:new Date().toLocaleString()});
  alert("Demande envoyée !"); majBouton(); demandeEnvoyee=true; majBouton();
}
async function annulerDemande(){
  await remove(ref(db,'jasonbook/demandes/'+targetUid+'/'+uid));
  await remove(ref(db,'jasonbook/demandesEnvoyees/'+uid+'/'+targetUid));
  demandeEnvoyee=false; majBouton();
}
async function retirerAmi(){
  await remove(ref(db,'jasonbook/amis/'+uid+'/'+targetUid));
  await remove(ref(db,'jasonbook/amis/'+targetUid+'/'+uid));
  if(vraiUid!==targetUid){ await remove(ref(db,'jasonbook/amis/'+uid+'/'+vraiUid)); await remove(ref(db,'jasonbook/amis/'+vraiUid+'/'+uid)); }
  estAmi=false; majBouton();
}
window.ecrireMessage=()=>{
  if(!targetUid){ alert("Impossible, pas d'identifiant."); return; }
  // ✅ Message marche même si profil introuvable, car on utilise l'uid
  location.href='messages.html?uid='+targetUid;
};
window.bloquer=async ()=>{
  if(!confirm("Bloquer cette personne ?")) return;
  await set(ref(db,'jasonbook/bloques/'+uid+'/'+targetUid),{uid:targetUid, nom:document.getElementById('nom').innerText, date:new Date().toLocaleString()});
  alert("Bloqué 🚫");
};
async function chargerPosts(){
  const box=document.getElementById('posts'); box.innerHTML="<p style='color:#888;font-size:13px'>Chargement...</p>";
  const s=await get(ref(db,'jasonbook/posts'));
  const d=s.val()||{};
  const list=Object.entries(d).map(([id,p])=>({id,...p})).filter(p=>p.auteurUid===targetUid || p.auteurUid===vraiUid).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  if(!list.length){ box.innerHTML="<p style='color:#888;font-size:13px'>Aucune publication pour le moment.</p>"; return; }
  box.innerHTML="";
  list.forEach(p=>{
    const div=document.createElement('div'); div.className='post';
    div.innerHTML=`<b>${p.nomAuteur||""}</b><p>${p.texte||""}</p>${p.photoUrl?`<img src="${p.photoUrl}">`:""}`;
    box.appendChild(div);
  });
}
charger();
</script>
</body>
</html>
